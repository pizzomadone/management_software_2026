name: Fix dynamic messagebox localization
on:
  push:
    branches: [fix/macos-filechooser-i18n]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Add parameterized dialog translations
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/I18n.java')
          s=p.read_text(encoding='utf-8')
          field='    private static Map<String, String> translations = Map.of();\n'
          if 'private static List<MessageTemplate> messageTemplates' not in s:
              if field not in s: raise SystemExit('translations field not found')
              s=s.replace(field,field+'    private static List<MessageTemplate> messageTemplates = List.of();\n',1)

          assign='        translations = loaded;\n'
          build='''        translations = loaded;
        List<MessageTemplate> templates = new ArrayList<>();
        for (Map.Entry<String, String> entry : loaded.entrySet()) {
            if (entry.getKey().matches(".*\\\\{\\\\d+\\\\}.*")) {
                templates.add(new MessageTemplate(entry.getKey(), entry.getValue()));
            }
        }
        messageTemplates = List.copyOf(templates);
'''
          if 'messageTemplates = List.copyOf(templates);' not in s:
              if assign not in s: raise SystemExit('translation assignment not found')
              s=s.replace(assign,build,1)

          old='''        int separator = source.indexOf(": ");
        if (separator > 0 && separator < 80) {
            String prefix = source.substring(0, separator);
            String translated = translations.get(prefix);
            if (translated != null) return translated + ": " + source.substring(separator + 2);
        }

        return source;
'''
          new='''        int separator = source.indexOf(": ");
        if (separator > 0 && separator < 120) {
            String prefix = source.substring(0, separator);
            String translated = translations.get(prefix);
            if (translated == null) translated = translations.get(prefix + ":");
            if (translated != null) {
                String remainder = source.substring(separator + 2);
                String localizedRemainder = translations.getOrDefault(remainder, remainder);
                return translated + (translated.endsWith(":") ? " " : ": ") + localizedRemainder;
            }
        }

        for (MessageTemplate template : messageTemplates) {
            String translated = template.translate(source);
            if (translated != null) return translated;
        }

        return source;
'''
          if 'for (MessageTemplate template : messageTemplates)' not in s:
              if old not in s: raise SystemExit('tr fallback block not found')
              s=s.replace(old,new,1)

          marker='''    private static String localized(Object owner, String current) {
'''
          helper='''    private static final class MessageTemplate {
        private final java.util.regex.Pattern pattern;
        private final String translatedTemplate;
        private final Map<Integer, Integer> placeholderGroups = new HashMap<>();

        private MessageTemplate(String sourceTemplate, String translatedTemplate) {
            this.translatedTemplate = translatedTemplate;
            java.util.regex.Matcher matcher = java.util.regex.Pattern.compile("\\\\{(\\\\d+)\\\\}").matcher(sourceTemplate);
            StringBuilder regex = new StringBuilder("^");
            int last = 0;
            int group = 1;
            while (matcher.find()) {
                regex.append(java.util.regex.Pattern.quote(sourceTemplate.substring(last, matcher.start())));
                regex.append("(.*?)");
                placeholderGroups.put(Integer.parseInt(matcher.group(1)), group++);
                last = matcher.end();
            }
            regex.append(java.util.regex.Pattern.quote(sourceTemplate.substring(last))).append("$");
            pattern = java.util.regex.Pattern.compile(regex.toString(), java.util.regex.Pattern.DOTALL);
        }

        private String translate(String source) {
            java.util.regex.Matcher matcher = pattern.matcher(source);
            if (!matcher.matches()) return null;
            String result = translatedTemplate;
            for (Map.Entry<Integer, Integer> entry : placeholderGroups.entrySet()) {
                result = result.replace("{" + entry.getKey() + "}", matcher.group(entry.getValue()));
            }
            return result;
        }
    }

'''
          if 'private static final class MessageTemplate' not in s:
              if marker not in s: raise SystemExit('localized method marker not found')
              s=s.replace(marker,helper+marker,1)
          p.write_text(s,encoding='utf-8')

          templates = {
            "This order has already been invoiced as {0}.": {
              "en":"This order has already been invoiced as {0}.",
              "it":"Questo ordine è già stato fatturato con la fattura {0}.",
              "es":"Este pedido ya ha sido facturado con la factura {0}.",
              "pt_BR":"Este pedido já foi faturado com a fatura {0}.",
              "fr":"Cette commande a déjà été facturée avec la facture {0}.",
              "de":"Dieser Auftrag wurde bereits mit Rechnung {0} fakturiert.",
