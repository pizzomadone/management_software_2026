            "Are you sure you want to remove {0} from the invoice?": {"en":"Are you sure you want to remove {0} from the invoice?","it":"Rimuovere {0} dalla fattura?","es":"¿Quitar {0} de la factura?","pt_BR":"Remover {0} da fatura?","fr":"Retirer {0} de la facture ?","de":"{0} aus der Rechnung entfernen?","pl":"Usunąć {0} z faktury?"},
            "Are you sure you want to remove {0} from the order?": {"en":"Are you sure you want to remove {0} from the order?","it":"Rimuovere {0} dall'ordine?","es":"¿Quitar {0} del pedido?","pt_BR":"Remover {0} do pedido?","fr":"Retirer {0} de la commande ?","de":"{0} aus dem Auftrag entfernen?","pl":"Usunąć {0} z zamówienia?"},
