              "pt_BR":"O pedido não pode ser excluído porque a fatura {0} foi gerada a partir dele. Exclua primeiro a fatura.",
              "fr":"La commande ne peut pas être supprimée car la facture {0} en a été générée. Supprimez d'abord la facture.",
              "de":"Der Auftrag kann nicht gelöscht werden, da daraus die Rechnung {0} erstellt wurde. Löschen Sie zuerst die Rechnung.",
              "pl":"Nie można usunąć zamówienia, ponieważ na jego podstawie utworzono fakturę {0}. Najpierw usuń fakturę."},
            "Are you sure you want to delete the customer '{0}'?": {
