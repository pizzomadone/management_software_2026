            "WARNING: This will permanently delete customer '{0}' and ALL related data:": {
              "en":"WARNING: This will permanently delete customer '{0}' and ALL related data:","it":"ATTENZIONE: verranno eliminati definitivamente il cliente '{0}' e TUTTI i dati collegati:","es":"ADVERTENCIA: se eliminarán permanentemente el cliente '{0}' y TODOS los datos relacionados:","pt_BR":"ATENÇÃO: o cliente '{0}' e TODOS os dados relacionados serão excluídos permanentemente:","fr":"ATTENTION : le client '{0}' et TOUTES les données associées seront définitivement supprimés :","de":"WARNUNG: Kunde '{0}' und ALLE zugehörigen Daten werden dauerhaft gelöscht:","pl":"OSTRZEŻENIE: klient '{0}' i WSZYSTKIE powiązane dane zostaną trwale usunięte:"},
            "Customer '{0}' and all related records deleted successfully": {
              "en":"Customer '{0}' and all related records deleted successfully","it":"Cliente '{0}' e tutti i dati collegati eliminati correttamente","es":"Cliente '{0}' y todos los registros relacionados eliminados correctamente","pt_BR":"Cliente '{0}' e todos os registros relacionados excluídos com sucesso","fr":"Client '{0}' et tous les enregistrements associés supprimés avec succès","de":"Kunde '{0}' und alle zugehörigen Datensätze wurden erfolgreich gelöscht","pl":"Klient '{0}' i wszystkie powiązane rekordy zostały pomyślnie usunięte"},
