name: Fix dynamic messagebox i18n
on:
  push:
    branches: [fix/macos-filechooser-i18n]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Patch i18n
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/I18n.java'); s=p.read_text(encoding='utf-8')
          needle='''        return source;\n    }\n\n    private static String localized(Object owner, String current) {\n'''
          repl='''        String templated = translateTemplate(source);\n        return templated != null ? templated : source;\n    }\n\n    private static String translateTemplate(String source) {\n        for (Map.Entry<String,String> entry : translations.entrySet()) {\n            String key=entry.getKey();\n            if (!key.contains("{0}")) continue;\n            java.util.regex.Matcher pm=java.util.regex.Pattern.compile("\\\\{(\\\\d+)\\\\}").matcher(key);\n            StringBuilder re=new StringBuilder("^"); int last=0,group=1; Map<Integer,Integer> groups=new HashMap<>();\n            while(pm.find()) {\n                re.append(java.util.regex.Pattern.quote(key.substring(last,pm.start()))).append("(.*?)");\n                groups.put(Integer.parseInt(pm.group(1)),group++); last=pm.end();\n            }\n            re.append(java.util.regex.Pattern.quote(key.substring(last))).append("$");\n            java.util.regex.Matcher sm=java.util.regex.Pattern.compile(re.toString(),java.util.regex.Pattern.DOTALL).matcher(source);\n            if(!sm.matches()) continue;\n            String result=entry.getValue();\n            for(Map.Entry<Integer,Integer> g:groups.entrySet()) result=result.replace("{"+g.getKey()+"}",sm.group(g.getValue()));\n            return result;\n        }\n        return null;\n    }\n\n    private static String localized(Object owner, String current) {\n'''
          if 'private static String translateTemplate(String source)' not in s:
              if needle not in s: raise SystemExit('I18n insertion point missing')
              s=s.replace(needle,repl,1)
          old='''            String translated = translations.get(prefix);\n            if (translated != null) return translated + ": " + source.substring(separator + 2);\n'''
          new='''            String translated = translations.get(prefix);\n            if (translated == null) translated = translations.get(prefix + ":");\n            if (translated != null) return translated + (translated.endsWith(":") ? " " : ": ") + source.substring(separator + 2);\n'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          rows={
          'en':[
          ('This order has already been invoiced as {0}.','This order has already been invoiced as {0}.'),
          ('Order cannot be deleted because invoice {0} was generated from it. Delete the invoice first.','Order cannot be deleted because invoice {0} was generated from it. Delete the invoice first.'),
          ("Are you sure you want to delete the order from customer '{0}'?","Are you sure you want to delete the order from customer '{0}'?"),
          ('Invoice {0} generated successfully!','Invoice {0} generated successfully!'),
          ('Order #{0} not found in the list.','Order #{0} not found in the list.'),
          ('Enter new quantity for {0}:','Enter new quantity for {0}:'),
          ('Are you sure you want to remove {0} from the order?','Are you sure you want to remove {0} from the order?'),
          ('Are you sure you want to remove {0} from the invoice?','Are you sure you want to remove {0} from the invoice?'),
          ('Are you sure you want to delete invoice {0} from customer {1}?','Are you sure you want to delete invoice {0} from customer {1}?'),
          ("Are you sure you want to delete the product '{0}'?","Are you sure you want to delete the product '{0}'?"),
          ("Product with code '{0}' not found in the list.","Product with code '{0}' not found in the list."),
          ("Are you sure you want to delete supplier '{0}'?","Are you sure you want to delete supplier '{0}'?"),
          ('Are you sure you want to delete order {0}?','Are you sure you want to delete order {0}?'),
          ('Are you sure you want to delete the price for product {0}?','Are you sure you want to delete the price for product {0}?')],
          'it':[
          ('This order has already been invoiced as {0}.','Questo ordine è già stato fatturato con la fattura {0}.'),
          ('Order cannot be deleted because invoice {0} was generated from it. Delete the invoice first.',"L'ordine non può essere eliminato perché da esso è stata generata la fattura {0}. Elimina prima la fattura."),
          ("Are you sure you want to delete the order from customer '{0}'?","Eliminare l'ordine del cliente '{0}'?"),
          ('Invoice {0} generated successfully!','Fattura {0} generata correttamente!'),
          ('Order #{0} not found in the list.',"Ordine cliente n. {0} non trovato nell'elenco."),
          ('Enter new quantity for {0}:','Inserisci la nuova quantità per {0}:'),
          ('Are you sure you want to remove {0} from the order?',"Rimuovere {0} dall'ordine?"),
          ('Are you sure you want to remove {0} from the invoice?','Rimuovere {0} dalla fattura?'),
          ('Are you sure you want to delete invoice {0} from customer {1}?','Eliminare la fattura {0} del cliente {1}?'),
          ("Are you sure you want to delete the product '{0}'?","Eliminare il prodotto '{0}'?"),
          ("Product with code '{0}' not found in the list.","Prodotto con codice '{0}' non trovato nell'elenco."),
          ("Are you sure you want to delete supplier '{0}'?","Eliminare il fornitore '{0}'?"),
          ('Are you sure you want to delete order {0}?',"Eliminare l'ordine {0}?"),
          ('Are you sure you want to delete the price for product {0}?','Eliminare il prezzo del prodotto {0}?')],
          'es':[], 'pt_BR':[], 'fr':[], 'de':[], 'pl':[]}
          # For non-Italian catalogs use safe localized template translations for the most visible dynamic order/invoice messages.
          extra={
          'es':['Este pedido ya ha sido facturado con la factura {0}.','El pedido no se puede eliminar porque se generó la factura {0} a partir de él. Elimina primero la factura.'],
          'pt_BR':['Este pedido já foi faturado com a fatura {0}.','O pedido não pode ser excluído porque a fatura {0} foi gerada a partir dele. Exclua primeiro a fatura.'],
          'fr':['Cette commande a déjà été facturée avec la facture {0}.',"La commande ne peut pas être supprimée car la facture {0} en a été générée. Supprimez d'abord la facture."],
          'de':['Dieser Auftrag wurde bereits mit Rechnung {0} fakturiert.','Der Auftrag kann nicht gelöscht werden, da daraus die Rechnung {0} erstellt wurde. Löschen Sie zuerst die Rechnung.'],
          'pl':['To zamówienie zostało już zafakturowane fakturą {0}.','Nie można usunąć zamówienia, ponieważ na jego podstawie utworzono fakturę {0}. Najpierw usuń fakturę.']}
          basekeys=[rows['en'][0][0],rows['en'][1][0]]
          for lang in extra: rows[lang]=list(zip(basekeys,extra[lang]))
          def key(s):
              out=''
              for c in s:
                  out+=('\\'+c) if c in ' :=#!' else c
              return out
          for lang,pairs in rows.items():
              fp=Path('resources/i18n/messages_'+lang+'.properties'); text=fp.read_text(encoding='utf-8')
              adds=[]
              for k,v in pairs:
                  ek=key(k)
                  if not any(line.startswith(ek+'=') for line in text.splitlines()): adds.append(ek+'='+v)
              if adds: fp.write_text(text.rstrip()+'\n\n# Dynamic message boxes\n'+'\n'.join(adds)+'\n',encoding='utf-8')
      - name: Test
        run: ant test
      - name: Verify
        run: |
          grep -q 'translateTemplate' src/I18n.java
          grep -q 'Questo ordine è già stato fatturato' resources/i18n/messages_it.properties
      - name: Commit
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git add src/I18n.java resources/i18n/messages_*.properties
          git commit -m "Translate dynamic message boxes"
          git push origin HEAD:fix/macos-filechooser-i18n
