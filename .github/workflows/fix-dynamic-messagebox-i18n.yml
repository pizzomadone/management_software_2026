            "Are you sure you want to delete the order from customer '{0}'?": {"en":"Are you sure you want to delete the order from customer '{0}'?","it":"Eliminare l'ordine del cliente '{0}'?","es":"¿Eliminar el pedido del cliente '{0}'?","pt_BR":"Excluir o pedido do cliente '{0}'?","fr":"Supprimer la commande du client '{0}' ?","de":"Auftrag des Kunden '{0}' löschen?","pl":"Usunąć zamówienie klienta '{0}'?"},
            "Invoice {0} generated successfully!": {"en":"Invoice {0} generated successfully!","it":"Fattura {0} generata correttamente!","es":"¡Factura {0} generada correctamente!","pt_BR":"Fatura {0} gerada com sucesso!","fr":"Facture {0} générée avec succès !","de":"Rechnung {0} wurde erfolgreich erstellt!","pl":"Faktura {0} została pomyślnie wygenerowana!"},
            "Order #{0} not found in the list.": {"en":"Order #{0} not found in the list.","it":"Ordine cliente n. {0} non trovato nell'elenco.","es":"Pedido n.º {0} no encontrado en la lista.","pt_BR":"Pedido nº {0} não encontrado na lista.","fr":"Commande n° {0} introuvable dans la liste.","de":"Auftrag Nr. {0} wurde in der Liste nicht gefunden.","pl":"Nie znaleziono zamówienia nr {0} na liście."},
            "Product '{0}' has only non-critical configuration data:": {"en":"Product '{0}' has only non-critical configuration data:","it":"Il prodotto '{0}' contiene solo dati di configurazione non critici:","es":"El producto '{0}' solo contiene datos de configuración no críticos:","pt_BR":"O produto '{0}' contém apenas dados de configuração não críticos:","fr":"Le produit '{0}' ne contient que des données de configuration non critiques :","de":"Produkt '{0}' enthält nur unkritische Konfigurationsdaten:","pl":"Produkt '{0}' zawiera tylko niekrytyczne dane konfiguracyjne:"},
            "Are you sure you want to delete the product '{0}'?": {"en":"Are you sure you want to delete the product '{0}'?","it":"Eliminare il prodotto '{0}'?","es":"¿Eliminar el producto '{0}'?","pt_BR":"Excluir o produto '{0}'?","fr":"Supprimer le produit '{0}' ?","de":"Produkt '{0}' löschen?","pl":"Usunąć produkt '{0}'?"},
            "Product with code '{0}' not found in the list.": {"en":"Product with code '{0}' not found in the list.","it":"Prodotto con codice '{0}' non trovato nell'elenco.","es":"Producto con código '{0}' no encontrado en la lista.","pt_BR":"Produto com código '{0}' não encontrado na lista.","fr":"Produit avec le code '{0}' introuvable dans la liste.","de":"Produkt mit Code '{0}' wurde in der Liste nicht gefunden.","pl":"Nie znaleziono na liście produktu o kodzie '{0}'."},
            "Are you sure you want to delete order {0}?": {"en":"Are you sure you want to delete order {0}?","it":"Eliminare l'ordine {0}?","es":"¿Eliminar el pedido {0}?","pt_BR":"Excluir o pedido {0}?","fr":"Supprimer la commande {0} ?","de":"Auftrag {0} löschen?","pl":"Usunąć zamówienie {0}?"},
            "Are you sure you want to delete the price for product {0}?": {"en":"Are you sure you want to delete the price for product {0}?","it":"Eliminare il prezzo del prodotto {0}?","es":"¿Eliminar el precio del producto {0}?","pt_BR":"Excluir o preço do produto {0}?","fr":"Supprimer le prix du produit {0} ?","de":"Preis für Produkt {0} löschen?","pl":"Usunąć cenę produktu {0}?"},
            "Are you sure you want to delete supplier '{0}'?": {"en":"Are you sure you want to delete supplier '{0}'?","it":"Eliminare il fornitore '{0}'?","es":"¿Eliminar el proveedor '{0}'?","pt_BR":"Excluir o fornecedor '{0}'?","fr":"Supprimer le fournisseur '{0}' ?","de":"Lieferanten '{0}' löschen?","pl":"Usunąć dostawcę '{0}'?"},
            "WARNING: This will permanently delete supplier '{0}' and ALL related data:": {"en":"WARNING: This will permanently delete supplier '{0}' and ALL related data:","it":"ATTENZIONE: verranno eliminati definitivamente il fornitore '{0}' e TUTTI i dati collegati:","es":"ADVERTENCIA: se eliminarán permanentemente el proveedor '{0}' y TODOS los datos relacionados:","pt_BR":"ATENÇÃO: o fornecedor '{0}' e TODOS os dados relacionados serão excluídos permanentemente:","fr":"ATTENTION : le fournisseur '{0}' et TOUTES les données associées seront définitivement supprimés :","de":"WARNUNG: Lieferant '{0}' und ALLE zugehörigen Daten werden dauerhaft gelöscht:","pl":"OSTRZEŻENIE: dostawca '{0}' i WSZYSTKIE powiązane dane zostaną trwale usunięte:"},
            "Supplier '{0}' and all related records deleted successfully": {"en":"Supplier '{0}' and all related records deleted successfully","it":"Fornitore '{0}' e tutti i dati collegati eliminati correttamente","es":"Proveedor '{0}' y todos los registros relacionados eliminados correctamente","pt_BR":"Fornecedor '{0}' e todos os registros relacionados excluídos com sucesso","fr":"Fournisseur '{0}' et tous les enregistrements associés supprimés avec succès","de":"Lieferant '{0}' und alle zugehörigen Datensätze wurden erfolgreich gelöscht","pl":"Dostawca '{0}' i wszystkie powiązane rekordy zostały pomyślnie usunięte"},
            "Insufficient quantity. Current availability: {0}": {"en":"Insufficient quantity. Current availability: {0}","it":"Quantità insufficiente. Disponibilità attuale: {0}","es":"Cantidad insuficiente. Disponibilidad actual: {0}","pt_BR":"Quantidade insuficiente. Disponibilidade atual: {0}","fr":"Quantité insuffisante. Disponibilité actuelle : {0}","de":"Unzureichende Menge. Aktuelle Verfügbarkeit: {0}","pl":"Niewystarczająca ilość. Aktualna dostępność: {0}"},
            "Requested: {0}": {"en":"Requested: {0}","it":"Richiesta: {0}","es":"Solicitada: {0}","pt_BR":"Solicitada: {0}","fr":"Demandée : {0}","de":"Angefordert: {0}","pl":"Żądana: {0}"},
            "{0} file not found in the application directory.": {"en":"{0} file not found in the application directory.","it":"File {0} non trovato nella cartella dell'applicazione.","es":"Archivo {0} no encontrado en la carpeta de la aplicación.","pt_BR":"Arquivo {0} não encontrado na pasta do aplicativo.","fr":"Fichier {0} introuvable dans le dossier de l'application.","de":"Datei {0} wurde im Anwendungsordner nicht gefunden.","pl":"Nie znaleziono pliku {0} w folderze aplikacji."},
            "Error reading {0}:": {"en":"Error reading {0}:","it":"Errore durante la lettura di {0}:","es":"Error al leer {0}:","pt_BR":"Erro ao ler {0}:","fr":"Erreur lors de la lecture de {0} :","de":"Fehler beim Lesen von {0}:","pl":"Błąd podczas odczytu {0}:"},
            "Error opening {0}: {1}": {"en":"Error opening {0}: {1}","it":"Errore durante l'apertura di {0}: {1}","es":"Error al abrir {0}: {1}","pt_BR":"Erro ao abrir {0}: {1}","fr":"Erreur lors de l'ouverture de {0} : {1}","de":"Fehler beim Öffnen von {0}: {1}","pl":"Błąd podczas otwierania {0}: {1}"}
          }

          exact = {
            "This action CANNOT be undone!": {"it":"Questa operazione NON può essere annullata!","es":"¡Esta acción NO se puede deshacer!","pt_BR":"Esta ação NÃO pode ser desfeita!","fr":"Cette action est IRRÉVERSIBLE !","de":"Diese Aktion kann NICHT rückgängig gemacht werden!","pl":"Tej operacji NIE można cofnąć!"},
            "Stock will be restored.": {"it":"La giacenza verrà ripristinata.","es":"Se restaurará el stock.","pt_BR":"O estoque será restaurado.","fr":"Le stock sera restauré.","de":"Der Bestand wird wiederhergestellt.","pl":"Stan magazynowy zostanie przywrócony."},
            "Reservations will be cancelled.": {"it":"Le prenotazioni verranno annullate.","es":"Se cancelarán las reservas.","pt_BR":"As reservas serão canceladas.","fr":"Les réservations seront annulées.","de":"Die Reservierungen werden storniert.","pl":"Rezerwacje zostaną anulowane."},
            "Stock has been restored.": {"it":"La giacenza è stata ripristinata.","es":"El stock se ha restaurado.","pt_BR":"O estoque foi restaurado.","fr":"Le stock a été restauré.","de":"Der Bestand wurde wiederhergestellt.","pl":"Stan magazynowy został przywrócony."},
            "Reservations have been cancelled.": {"it":"Le prenotazioni sono state annullate.","es":"Las reservas se han cancelado.","pt_BR":"As reservas foram canceladas.","fr":"Les réservations ont été annulées.","de":"Die Reservierungen wurden storniert.","pl":"Rezerwacje zostały anulowane."},
            "Stock will be adjusted accordingly.": {"it":"La giacenza verrà aggiornata di conseguenza.","es":"El stock se ajustará en consecuencia.","pt_BR":"O estoque será ajustado de acordo.","fr":"Le stock sera ajusté en conséquence.","de":"Der Bestand wird entsprechend angepasst.","pl":"Stan magazynowy zostanie odpowiednio skorygowany."},
            "Stock has been adjusted.": {"it":"La giacenza è stata aggiornata.","es":"El stock se ha ajustado.","pt_BR":"O estoque foi ajustado.","fr":"Le stock a été ajusté.","de":"Der Bestand wurde angepasst.","pl":"Stan magazynowy został skorygowany."},
            "Stock received from completed supplier orders will be removed before deletion.": {"it":"La giacenza ricevuta dagli ordini fornitore completati verrà rimossa prima dell'eliminazione.","es":"El stock recibido de pedidos de proveedor completados se retirará antes de la eliminación.","pt_BR":"O estoque recebido de pedidos de fornecedor concluídos será removido antes da exclusão.","fr":"Le stock reçu des commandes fournisseur terminées sera retiré avant la suppression.","de":"Der aus abgeschlossenen Lieferantenbestellungen erhaltene Bestand wird vor dem Löschen entfernt.","pl":"Stan przyjęty z zakończonych zamówień do dostawców zostanie usunięty przed skasowaniem."},
            "These records will also be deleted. Continue?": {"it":"Anche questi dati verranno eliminati. Continuare?","es":"Estos registros también se eliminarán. ¿Continuar?","pt_BR":"Esses registros também serão excluídos. Continuar?","fr":"Ces enregistrements seront également supprimés. Continuer ?","de":"Diese Datensätze werden ebenfalls gelöscht. Fortfahren?","pl":"Te rekordy również zostaną usunięte. Kontynuować?"},
            "Minimum quantity and reorder quantity cannot be negative": {"it":"La quantità minima e la quantità di riordino non possono essere negative","es":"La cantidad mínima y la cantidad de reposición no pueden ser negativas","pt_BR":"A quantidade mínima e a quantidade de reposição não podem ser negativas","fr":"La quantité minimale et la quantité de réapprovisionnement ne peuvent pas être négatives","de":"Mindestmenge und Nachbestellmenge dürfen nicht negativ sein","pl":"Minimalna ilość i ilość ponownego zamówienia nie mogą być ujemne"},
            "Please enter a valid positive integer for quantity": {"it":"Inserisci un numero intero positivo valido per la quantità","es":"Introduce un número entero positivo válido para la cantidad","pt_BR":"Informe um número inteiro positivo válido para a quantidade","fr":"Saisissez un entier positif valide pour la quantité","de":"Geben Sie eine gültige positive Ganzzahl für die Menge ein","pl":"Wprowadź prawidłową dodatnią liczbę całkowitą jako ilość"},
            "Paid amount exceeds order total. Continue?": {"it":"L'importo pagato supera il totale dell'ordine. Continuare?","es":"El importe pagado supera el total del pedido. ¿Continuar?","pt_BR":"O valor pago excede o total do pedido. Continuar?","fr":"Le montant payé dépasse le total de la commande. Continuer ?","de":"Der bezahlte Betrag übersteigt die Auftragssumme. Fortfahren?","pl":"Zapłacona kwota przekracza wartość zamówienia. Kontynuować?"},
            "Insufficient stock for the following products:": {"it":"Scorta insufficiente per i seguenti prodotti:","es":"Stock insuficiente para los siguientes productos:","pt_BR":"Estoque insuficiente para os seguintes produtos:","fr":"Stock insuffisant pour les produits suivants :","de":"Unzureichender Bestand für folgende Produkte:","pl":"Niewystarczający stan magazynowy dla następujących produktów:"}
          }

          def esc_key(k):
              out=''
              for i,ch in enumerate(k):
                  if ch in '\\:= #!' or (i==0 and ch in '#!'):
                      out+='\\'+ch
                  else: out+=ch
              return out
          def esc_val(v):
              return v.replace('\\','\\\\').replace('\n','\\n').replace('\r','\\r')

          langs=['en','it','es','pt_BR','fr','de','pl']
          for lang in langs:
              path=Path(f'resources/i18n/messages_{lang}.properties')
              text=path.read_text(encoding='utf-8')
              additions=[]
              for key,vals in templates.items():
                  ek=esc_key(key)
                  if not any(line.startswith(ek+'=') for line in text.splitlines()):
                      additions.append(ek+'='+esc_val(vals[lang]))
              for key,vals in exact.items():
                  ek=esc_key(key)
                  if not any(line.startswith(ek+'=') for line in text.splitlines()):
                      additions.append(ek+'='+esc_val(key if lang=='en' else vals[lang]))
              if additions:
                  text=text.rstrip()+"\n\n# Dynamic message-box localization\n"+'\n'.join(additions)+'\n'
                  path.write_text(text,encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Verify dynamic template implementation
        run: |
          grep -q 'private static final class MessageTemplate' src/I18n.java
          grep -q 'This\\ order\\ has\\ already\\ been\\ invoiced\\ as\\ {0}' resources/i18n/messages_it.properties
          grep -q 'Questo ordine è già stato fatturato' resources/i18n/messages_it.properties
      - name: Commit tested localization fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git add src/I18n.java resources/i18n/messages_*.properties
          git commit -m "Translate dynamic message boxes"
          git push origin HEAD:fix/macos-filechooser-i18n
