name: Fix toolbar width v2

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Patch toolbar width
        run: |
          python3 -c "from pathlib import Path; p=Path('src/MainWindow.java'); s=p.read_text(encoding='utf-8'); needle='        button.setPreferredSize(new Dimension(buttonWidth, 60));\\n'; add='        textLabel.addPropertyChangeListener(\\\"text\\\", event -> {\\n            int translatedWidth = Math.max(80,\\n                textLabel.getFontMetrics(textLabel.getFont()).stringWidth(textLabel.getText()) + 20);\\n            button.setPreferredSize(new Dimension(translatedWidth, 60));\\n            if (toolBar != null) toolBar.revalidate();\\n        });\\n'; assert s.count(needle)==1; p.write_text(s.replace(needle, needle+add, 1), encoding='utf-8')"
      - name: Run regression suite
        run: ant test
      - name: Commit tested fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/fix-toolbar-width-v2.yml
          git add src/MainWindow.java
          git commit -m "Resize toolbar buttons after translation"
          git push origin HEAD:fix/macos-filechooser-i18n
