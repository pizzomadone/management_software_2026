name: Fix currency dialog alignment

on:
  push:
    branches: [fix/macos-filechooser-i18n]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y ant
      - name: Align currency warning content
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/SettingsPanel.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    warningPanel.setLayout(new BoxLayout(warningPanel,BoxLayout.Y_AXIS));','        warningPanel.setLayout(new BoxLayout(warningPanel,BoxLayout.Y_AXIS));',1)
          s=s.replace('    JTextArea warningText=new JTextArea(warning);','        JTextArea warningText=new JTextArea(warning);',1)
          for line in ['warningText.setEditable(false);','warningText.setFocusable(false);','warningText.setOpaque(false);','warningText.setBorder(null);','warningText.setFont(UIManager.getFont("Label.font"));','warningPanel.add(warningText);','warningPanel.add(Box.createVerticalStrut(10));']:
              s=s.replace('    '+line,'        '+line,1)
          s=s.replace('        warningText.setBorder(null);\n','        warningText.setBorder(null);\n        warningText.setMargin(new Insets(0,0,0,0));\n',1)
          s=s.replace('        warningText.setFont(UIManager.getFont("Label.font"));\n','        warningText.setFont(UIManager.getFont("Label.font"));\n        warningText.setAlignmentX(Component.LEFT_ALIGNMENT);\n',1)
          old='    warningPanel.add(new JLabel(I18n.tr("Before changing currency, we recommend creating a backup of your database.")));'
          new='        JLabel backupAdvice=new JLabel(I18n.tr("Before changing currency, we recommend creating a backup of your database."));\n        backupAdvice.setAlignmentX(Component.LEFT_ALIGNMENT);\n        warningPanel.add(backupAdvice);'
          if old not in s:
              raise SystemExit('Backup advice line not found')
          s=s.replace(old,new,1)
          s=s.replace('    boolean[] backupRequested={false};','        boolean[] backupRequested={false};',1)
          s=s.replace('    JLabel backupLink=new JLabel("<html><a href=\'backup\'>"+I18n.tr("Open Backup")+"</a></html>");','        JLabel backupLink=new JLabel("<html><a href=\'backup\'>"+I18n.tr("Open Backup")+"</a></html>");',1)
          s=s.replace('    backupLink.setCursor(Cursor.getPredefinedCursor(Cursor.HAND_CURSOR));','        backupLink.setAlignmentX(Component.LEFT_ALIGNMENT);\n        backupLink.setCursor(Cursor.getPredefinedCursor(Cursor.HAND_CURSOR));',1)
          p.write_text(s,encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Commit tested fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/fix-currency-dialog-alignment.yml
          git add src/SettingsPanel.java
          git commit -m "Align currency change warning content"
          git push origin HEAD:fix/macos-filechooser-i18n
