name: Dashboard KPI audit

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Inject dashboard KPI verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ExtendedRegressionTest.java')
          s=p.read_text(encoding='utf-8')
          marker='        test("currency change explanations translate in every supported language",()->{'
          if marker not in s:
              raise SystemExit('KPI audit insertion marker not found')
          test=r'''        test("dashboard KPI values match their question-mark definitions",()->{
              fresh();
              sql("UPDATE products SET quantity=3,acquisition_cost=1.005,price=2.005,active=1 WHERE id=1");
              sql("UPDATE products SET quantity=2,acquisition_cost=0,price=5,active=1 WHERE id=2");
              sql("INSERT INTO products(id,code,name,price,quantity,acquisition_cost,active) VALUES"+
                  "(3,'NEG','Negative',100,-4,100,1),"+
                  "(4,'OFF','Inactive',100,100,100,0),"+
                  "(5,'ZERO','Zero stock',7,0,7,1)");
              sql("INSERT INTO minimum_stock(product_id,minimum_quantity,reorder_quantity) VALUES"+
                  "(1,4,4),(2,1,1),(4,200,200),(5,5,5)");

              java.time.LocalDate current=java.time.LocalDate.now().withDayOfMonth(1);
              java.time.LocalDate prior=current.minusMonths(1);
              String now=current.toString(), old=prior.toString();
              sql("INSERT INTO orders(id,customer_id,order_date,status,total) VALUES"+
                  "(10,1,'"+now+"','Completed',10.01),"+
                  "(11,1,'"+now+"','Completed',5.00),"+
                  "(12,1,'"+old+"','New',100),"+
                  "(13,1,'"+now+"','In Progress',200),"+
                  "(14,1,'"+now+"','Cancelled',300),"+
                  "(15,1,'"+old+"','Completed',400)");
              sql("INSERT INTO invoices(id,number,date,customer_id,taxable_amount,vat,total,status,currency_code) VALUES"+
                  "(10,'KPI-I','"+now+"',1,20,4.4,24.4,'Issued','EUR'),"+
                  "(11,'KPI-P','"+now+"',1,30,6.6,36.6,'Paid','EUR'),"+
                  "(12,'KPI-D','"+now+"',1,100,22,122,'Draft','EUR'),"+
                  "(13,'KPI-C','"+now+"',1,200,44,244,'Canceled','EUR'),"+
                  "(14,'KPI-O','"+old+"',1,300,66,366,'Issued','EUR')");

              DashboardPanel d=new DashboardPanel(null);call(d,"loadKPIData");
              require(SettingsPanel.formatCurrency(3.02).equals(((JLabel)get(d,"warehouseValueLabel")).getText()),
                  "Standard-cost KPI differs from tooltip definition");
              require(SettingsPanel.formatCurrency(16.02).equals(((JLabel)get(d,"warehouseSaleValueLabel")).getText()),
                  "Sale-value KPI differs from tooltip definition");
              require("3".equals(((JLabel)get(d,"lowStockCountLabel")).getText()),
                  "Low-stock KPI differs from tooltip definition");
              require("2".equals(((JLabel)get(d,"zeroStockLabel")).getText()),
                  "Out-of-stock KPI differs from tooltip definition");
              require(SettingsPanel.formatCurrency(15.01).equals(((JLabel)get(d,"monthRevenueLabel")).getText()),
                  "Monthly order-sales KPI differs from tooltip definition");
              require(SettingsPanel.formatCurrency(50.00,"EUR").equals(((JLabel)get(d,"monthInvoicedLabel")).getText()),
                  "Monthly invoiced KPI differs from tooltip definition");
              require("2".equals(((JLabel)get(d,"pendingOrdersLabel")).getText()),
                  "Pending-orders KPI differs from tooltip definition");
              require("81.1%".equals(((JLabel)get(d,"avgMarginLabel")).getText().replace(',','.')),
                  "Potential-margin KPI differs from tooltip definition: "+((JLabel)get(d,"avgMarginLabel")).getText());
              require("1".equals(((JLabel)get(d,"zeroCostCountLabel")).getText()),"Zero-cost supporting count is wrong");
              require("1".equals(((JLabel)get(d,"negativeStockCountLabel")).getText()),"Negative-stock supporting count is wrong");
          });
          '''
          p.write_text(s.replace(marker,test+marker,1),encoding='utf-8')
          PY
      - name: Run full regression suite with KPI audit
        run: ant test
