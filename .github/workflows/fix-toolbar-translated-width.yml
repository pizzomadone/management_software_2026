name: Fix translated toolbar width

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Fix toolbar translated widths
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/MainWindow.java')
          s = p.read_text(encoding='utf-8')
          old = '''        button.setToolTipText(tooltip);
        int buttonWidth = Math.max(80, textLabel.getFontMetrics(textLabel.getFont()).stringWidth(text) + 20);
        button.setPreferredSize(new Dimension(buttonWidth, 60));
'''
          new = '''        button.setToolTipText(tooltip);
        Runnable updateButtonWidth = () -> {
            int buttonWidth = Math.max(80,
                textLabel.getFontMetrics(textLabel.getFont()).stringWidth(textLabel.getText()) + 20);
            button.setPreferredSize(new Dimension(buttonWidth, 60));
        };
        updateButtonWidth.run();
        textLabel.addPropertyChangeListener("text", event -> {
            updateButtonWidth.run();
            if (toolBar != null) toolBar.revalidate();
        });
'''
          if old not in s:
              raise SystemExit('Toolbar width block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Commit tested fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/fix-toolbar-translated-width.yml
          git add src/MainWindow.java
          git commit -m "Resize toolbar buttons after translation"
          git push origin HEAD:fix/macos-filechooser-i18n
