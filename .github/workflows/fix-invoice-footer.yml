name: Fix invoice footer placement

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Move WareStat message into invoice footer
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/PdfWriter.java')
          s=p.read_text(encoding='utf-8')
          field='    private final String pageLabel;\n'
          if 'private final String footerPrefix;' not in s:
              if field not in s: raise SystemExit('pageLabel field not found')
              s=s.replace(field,field+'    private final String footerPrefix;\n',1)

          ctor='    public PdfWriter(String title, boolean landscape, String pageLabel) throws IOException {\n        this.title=Objects.toString(title,"");\n'
          repl='    public PdfWriter(String title, boolean landscape, String pageLabel) throws IOException {\n        this(title,landscape,pageLabel,"WareStat");\n    }\n\n    public PdfWriter(String title, boolean landscape, String pageLabel, String footerPrefix) throws IOException {\n        this.title=Objects.toString(title,"");\n'
          if 'String footerPrefix) throws IOException' not in s:
              if ctor not in s: raise SystemExit('PdfWriter constructor marker not found')
              s=s.replace(ctor,repl,1)

          page_assign='        this.pageLabel=Objects.toString(pageLabel,"Page").isBlank()?"Page":pageLabel;\n'
          footer_assign='        this.footerPrefix=Objects.toString(footerPrefix,"").trim();\n'
          if footer_assign not in s:
              if page_assign not in s: raise SystemExit('pageLabel assignment not found')
              s=s.replace(page_assign,page_assign+footer_assign,1)

          old_footer='        text("WareStat | "+pageLabel+" "+document.getNumberOfPages(),MARGIN,28,regular,8);\n'
          new_footer='        String footer=(footerPrefix.isBlank()?"":footerPrefix+" | ")+pageLabel+" "+document.getNumberOfPages();\n        text(footer,MARGIN,28,regular,8);\n'
          if new_footer not in s:
              if old_footer not in s: raise SystemExit('PdfWriter footer marker not found')
              s=s.replace(old_footer,new_footer,1)
          p.write_text(s,encoding='utf-8')

          p=Path('src/InvoicePDFGenerator.java')
          s=p.read_text(encoding='utf-8')
          old_ctor='            try(PdfWriter pdf=new PdfWriter("",false,I18n.tr("Page"))) {\n'
          new_ctor='            try(PdfWriter pdf=new PdfWriter("",false,I18n.tr("Page"),"Documento generato con WareStat")) {\n'
          if new_ctor not in s:
              if old_ctor not in s: raise SystemExit('Invoice PdfWriter marker not found')
              s=s.replace(old_ctor,new_ctor,1)
          s=s.replace('                pdf.note("Documento generato con WareStat");\n','',1)
          p.write_text(s,encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Commit tested fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git add src/PdfWriter.java src/InvoicePDFGenerator.java
          git commit -m "Place WareStat invoice message in page footer"
          git push origin HEAD:fix/macos-filechooser-i18n
