name: Critical logic fixes v3

on:
  push:
    branches: [fix/macos-filechooser-i18n]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y ant
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p,s): Path(p).write_text(s,encoding='utf-8')
          def rx(p,pat,repl,label,flags=re.S):
              s=load(p); n,c=re.subn(pat,repl,s,count=1,flags=flags)
              if c!=1: raise SystemExit(f'{label}: matches={c}')
              save(p,n)
          def one(p,old,new,label):
              s=load(p); c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: matches={c}')
              save(p,s.replace(old,new,1))

          # Finalized invoice lock, both parent-window constructors.
          rx('src/InvoiceDialog.java',r'this\.historicalForeignCurrencyLocked = invoice != null && !"Draft"\.equals\(invoice\.getStatus\(\)\)\s*&& !currencyCode\(\)\.equals\(SettingsPanel\.getCurrencyCode\(\)\);','this.historicalForeignCurrencyLocked = invoice != null && isFinalizedStatus(invoice.getStatus());','invoice JDialog lock')
          one('src/InvoiceDialog.java','    private static boolean isFinalizedStatus(String status) {','    static boolean isFinalizedStatus(String status) {','invoice policy visibility')

          # Reconcile derived reservation cache at startup/upgrades.
          sm=load('src/StockManager.java')
          marker='    // Helper classes\n\n'
          if marker not in sm: raise SystemExit('stock helper marker')
          method='''    /** Rebuild the cached reserved quantity from the active reservation ledger. */
              public static void reconcileReservedStock(Connection conn) throws SQLException {
                  try (Statement s=conn.createStatement(); ResultSet r=s.executeQuery("""
                          SELECT product_id, SUM(reserved_quantity) AS reserved
                          FROM stock_reservations WHERE status='ACTIVE'
                          GROUP BY product_id HAVING SUM(reserved_quantity)>2147483647
                          """)) {
                      if (r.next()) throw new SQLException("Active reservations exceed the supported quantity for product " + r.getInt("product_id"));
                  }
                  try (Statement s=conn.createStatement()) {
                      s.executeUpdate("""
                          UPDATE products SET reserved_quantity=COALESCE((
                              SELECT SUM(r.reserved_quantity) FROM stock_reservations r
                              WHERE r.product_id=products.id AND r.status='ACTIVE'
                          ),0)
                          """);
                  }
              }

          '''
          save('src/StockManager.java',sm.replace(marker,method+marker,1))
          one('src/DatabaseManager.java','        createStockReservationTriggers();','        createStockReservationTriggers();\n        StockManager.reconcileReservedStock(connection);','startup reservation reconcile')

          # Correct manual OUTWARD availability.
          wm=load('src/WarehouseMovementDialog.java')
          marker='    // Method to load movement data for editing\n'
          helper='''    private int availableForOutward(Connection conn,int productId) throws SQLException {
                  int available=StockManager.getAvailableStock(conn,productId);
                  if (movement==null || movement.getProductId()!=productId) return available;
                  try {
                      if ("OUTWARD".equals(movement.getType())) return Math.addExact(available,movement.getQuantity());
                      if ("INWARD".equals(movement.getType())) return Math.subtractExact(available,movement.getQuantity());
                  } catch (ArithmeticException e) { throw new SQLException("Stock availability exceeds the supported range",e); }
                  throw new SQLException("Unsupported existing movement type: "+movement.getType());
              }

          '''
          if marker not in wm: raise SystemExit('movement marker')
          wm=wm.replace(marker,helper+marker,1)
          pat=r'if \("OUTWARD"\.equals\(type\)\) \{\s*if \(movement != null && "OUTWARD"\.equals\(movement\.getType\(\)\) &&\s*movement\.getProductId\(\) == selectedProduct\.getId\(\)\) \{.*?\}\s*if \(requestedQuantity > currentStock\) \{'
          wm,c=re.subn(pat,'if ("OUTWARD".equals(type)) {\n                int available=availableForOutward(DatabaseManager.getInstance().getConnection(),selectedProduct.getId());\n                if (requestedQuantity > available) {',wm,count=1,flags=re.S)
          if c!=1: raise SystemExit(f'movement preview block: {c}')
          wm=wm.replace('                        currentStock, requestedQuantity));','                        available, requestedQuantity));',1)
          wm=wm.replace('                        currentStock, currentStock - requestedQuantity));','                        available, available - requestedQuantity));',1)
          pat=r'int availability = getCurrentStock\(selectedProduct\.getId\(\)\);\s*if \(movement != null && "OUTWARD"\.equals\(movement\.getType\(\)\) &&\s*movement\.getProductId\(\) == selectedProduct\.getId\(\)\) \{\s*availability \+= movement\.getQuantity\(\); // Restore original quantity\s*\}'
          wm,c=re.subn(pat,'int availability = availableForOutward(conn,selectedProduct.getId());',wm,count=1,flags=re.S)
          if c!=1: raise SystemExit(f'movement save block: {c}')
          save('src/WarehouseMovementDialog.java',wm)

          # Prevent linked order divergence and invoicing unfinished/cancelled orders.
          od=load('src/OrderDialog.java')
          marker='            DatabaseManager.beginTransaction(conn);\n            try {\n            // Check stock availability for New, In Progress and Completed states'
          guard='''            DatabaseManager.beginTransaction(conn);
                      try {
                      if (order != null) {
                          try (PreparedStatement p=conn.prepareStatement("SELECT 1 FROM invoices WHERE order_id=? LIMIT 1")) {
                              p.setInt(1,order.getId()); try (ResultSet r=p.executeQuery()) {
                                  if (r.next()) throw new SQLException(I18n.tr("This order already has an invoice and cannot be modified."));
                              }
                          }
                      }
                      // Check stock availability for New, In Progress and Completed states'''
          if marker not in od: raise SystemExit('order save guard marker')
          save('src/OrderDialog.java',od.replace(marker,guard,1))

          op=load('src/OrdersPanel.java')
          pat=r'(int orderId = \(int\)tableModel\.getValueAt\(modelRow, 0\);\s*try \{)\s*(Order order = loadOrderDetails\(orderId\);)'
          repl=r'''\1
                          try (PreparedStatement p=DatabaseManager.getInstance().getConnection().prepareStatement("SELECT number FROM invoices WHERE order_id=? LIMIT 1")) {
                              p.setInt(1,orderId); try (ResultSet r=p.executeQuery()) {
                                  if (r.next()) { JOptionPane.showMessageDialog(this,I18n.tr("This order already has an invoice and cannot be modified.")+"\\n"+I18n.tr("Invoice")+": "+r.getString(1),I18n.tr("Invoice Already Exists"),JOptionPane.WARNING_MESSAGE); return; }
                              }
                          }
                          \2'''
          op,c=re.subn(pat,repl,op,count=1,flags=re.S)
          if c!=1: raise SystemExit(f'order edit guard: {c}')
          pat=r'(String status = \(String\)tableModel\.getValueAt\(modelRow, 3\);)(\s*try \{\s*Connection connection = DatabaseManager\.getInstance\(\)\.getConnection\(\);)'
          repl=r'''\1
                  if (!"Completed".equals(status)) {
                      JOptionPane.showMessageDialog(this,I18n.tr("Only completed customer orders can be invoiced."),I18n.tr("Generate Invoice"),JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          \2'''
          op,c=re.subn(pat,repl,op,count=1,flags=re.S)
          if c!=1: raise SystemExit(f'order invoice eligibility: {c}')
          save('src/OrdersPanel.java',op)

          # Finalized invoices cannot be deleted directly.
          ip=load('src/InvoicesPanel.java')
          pat=r'(String status = \(String\)tableModel\.getValueAt\(modelRow, 6\);)(\s*int result = JOptionPane\.showConfirmDialog\(this,)'
          repl=r'''\1
                  if (InvoiceDialog.isFinalizedStatus(status)) {
                      JOptionPane.showMessageDialog(this,I18n.tr("Issued, Paid and Canceled invoices are historical documents. Only their status can be changed."),I18n.tr("Historical Invoice"),JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          \2'''
          ip,c=re.subn(pat,repl,ip,count=1,flags=re.S)
          if c!=1: raise SystemExit(f'invoice delete guard: {c}')
          save('src/InvoicesPanel.java',ip)

          # ...nor indirectly by deleting the customer.
          cp=load('src/CustomersPanel.java')
          pat=r'(boolean hasOrders = hasCustomerOrders\(conn, id\);\s*boolean hasInvoices = hasCustomerInvoices\(conn, id\);)'
          repl=r'''\1
                          if (hasFinalizedCustomerInvoices(conn,id)) {
                              JOptionPane.showMessageDialog(this,I18n.tr("Issued, Paid and Canceled invoices are historical documents. Only their status can be changed."),I18n.tr("Historical Invoice"),JOptionPane.WARNING_MESSAGE);
                              return;
                          }'''
          cp,c=re.subn(pat,repl,cp,count=1,flags=re.S)
          if c!=1: raise SystemExit(f'customer history guard: {c}')
          marker='    private boolean hasCustomerInvoices(Connection conn, int customerId) throws SQLException {\n'
          helper='''    private boolean hasFinalizedCustomerInvoices(Connection conn,int customerId) throws SQLException {
                  try (PreparedStatement p=conn.prepareStatement("SELECT 1 FROM invoices WHERE customer_id=? AND status<>'Draft' LIMIT 1")) {
                      p.setInt(1,customerId); try (ResultSet r=p.executeQuery()) { return r.next(); }
                  }
              }

          '''
          if marker not in cp: raise SystemExit('customer helper marker')
          save('src/CustomersPanel.java',cp.replace(marker,helper+marker,1))

          # Translations.
          messages={
            'en':['Only completed customer orders can be invoiced.','This order already has an invoice and cannot be modified.'],
            'it':['È possibile fatturare solo gli ordini cliente completati.','Questo ordine ha già una fattura e non può essere modificato.'],
            'es':['Solo se pueden facturar los pedidos de clientes completados.','Este pedido ya tiene una factura y no puede modificarse.'],
            'fr':['Seules les commandes client terminées peuvent être facturées.','Cette commande possède déjà une facture et ne peut pas être modifiée.'],
            'de':['Nur abgeschlossene Kundenaufträge können in Rechnung gestellt werden.','Dieser Auftrag hat bereits eine Rechnung und kann nicht geändert werden.'],
            'pl':['Fakturować można tylko zrealizowane zamówienia klientów.','To zamówienie ma już fakturę i nie może być modyfikowane.'],
            'pt_BR':['Somente pedidos de clientes concluídos podem ser faturados.','Este pedido já possui uma fatura e não pode ser alterado.']}
          keys=['Only completed customer orders can be invoiced.','This order already has an invoice and cannot be modified.']
          def key(x): return ''.join(('\\'+c if c in ' :=\\' else c) for c in x)
          for lang,vals in messages.items():
              p=Path(f'resources/i18n/messages_{lang}.properties'); s=p.read_text(encoding='utf-8').rstrip()+'\n'
              for k,v in zip(keys,vals):
                  if key(k)+'=' not in s: s += key(k)+'='+v+'\n'
              p.write_text(s,encoding='utf-8')

          # Critical regression tests.
          tr=load('tests/OperationalRegressionTest.java')
          marker='    static void operational() throws Exception {\n'
          if tr.count(marker)!=1: raise SystemExit('test insertion marker')
          add='''        test("startup reconciles active reservation cache",()->{
                      fresh();StockManager.createOrUpdateReservation(db,1,"ORDER",77,8,"");sql("UPDATE products SET reserved_quantity=0 WHERE id=1");call(DatabaseManager.getInstance(),"createTables");
                      require("8".equals(value("SELECT reserved_quantity FROM products WHERE id=1")),"Active reservations were lost from availability after startup");
                  });
                  test("manual outward availability honors reservations and edit reversal",()->{
                      fresh();StockManager.createOrUpdateReservation(db,1,"ORDER",77,8,"");WarehouseMovementDialog d=empty(WarehouseMovementDialog.class);put(d,"movement",null);
                      require(((Number)call(d,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,"Manual issue ignored reservations");
                      sql("UPDATE products SET quantity=15 WHERE id=1");put(d,"movement",new WarehouseMovement(1,1,"A",new java.util.Date(),"INWARD",5,"OTHER",null,null,""));
                      require(((Number)call(d,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,"Edited inward movement availability is wrong");
                      sql("UPDATE products SET quantity=5 WHERE id=1");put(d,"movement",new WarehouseMovement(1,1,"A",new java.util.Date(),"OUTWARD",5,"OTHER",null,null,""));
                      require(((Number)call(d,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,"Edited outward movement availability is wrong");
                  });
                  test("linked invoice freezes its source order",()->{
                      fresh();completed();sql("INSERT INTO invoices(number,date,customer_id,taxable_amount,vat,total,status,order_id,currency_code) VALUES('LOCKED',0,1,30,0,30,'Issued',1,'EUR')");
                      OD d=order(true,5,"Completed");rejectedSave(d,"saveOrder","orderSaved");
                      require(qty()==7 && "30.0|3".equals(value("SELECT total||'|'||(SELECT quantity FROM order_details WHERE order_id=1) FROM orders WHERE id=1")),"Invoiced order diverged from invoice");
                      CustomersPanel customers=new CustomersPanel();require((Boolean)call(customers,"hasFinalizedCustomerInvoices",new Class<?>[]{Connection.class,int.class},db,1),"Finalized customer history was not detected");
                  });
                  test("non-completed orders cannot be invoiced",()->{
                      for(String status:java.util.List.of("New","In Progress","Cancelled")) { fresh();sql("INSERT INTO orders(id,customer_id,order_date,status,total) VALUES(10,1,0,'"+status+"',10)");sql("INSERT INTO order_details(order_id,product_id,quantity,unit_price) VALUES(10,1,1,10)");OrdersPanel p=new OrdersPanel();JTable t=(JTable)get(p,"ordersTable");t.setRowSelectionInterval(0,0);try{call(p,"generateInvoiceFromOrder");}catch(java.awt.HeadlessException expected){}require("0".equals(value("SELECT COUNT(*) FROM invoices")),"Non-completed order was invoiced: "+status); }
                  });
          '''
          save('tests/OperationalRegressionTest.java',tr.replace(marker,marker+add,1))
      - name: Test
        run: ant test
      - name: Commit
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/critical-logic-fix.yml .github/workflows/critical-logic-fix-v2.yml .github/workflows/critical-logic-fix-v3.yml
          git add src tests resources/i18n
          git commit -m "Fix critical stock and document integrity paths"
          git push origin HEAD:fix/macos-filechooser-i18n
