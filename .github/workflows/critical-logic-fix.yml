name: Critical logic fixes

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Apply critical logic fixes
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old,new,1)

          # 1) Finalized invoices must be locked regardless of parent window type.
          p='src/InvoiceDialog.java'; s=read(p)
          s=replace_once(s,
              '        this.historicalForeignCurrencyLocked = invoice != null && !"Draft".equals(invoice.getStatus())\n            && !currencyCode().equals(SettingsPanel.getCurrencyCode());',
              '        this.historicalForeignCurrencyLocked = invoice != null && isFinalizedStatus(invoice.getStatus());',
              'InvoiceDialog JDialog lock')
          s=replace_once(s,
              '    private static boolean isFinalizedStatus(String status) {',
              '    static boolean isFinalizedStatus(String status) {',
              'InvoiceDialog status policy visibility')
          write(p,s)

          # 2) Rebuild the derived reserved-stock cache from ACTIVE reservations at startup/upgrades.
          p='src/StockManager.java'; s=read(p)
          marker='    // Helper classes\n\n'
          method='''    /** Rebuild the cached reserved quantity from the reservation ledger. */
              public static void reconcileReservedStock(Connection conn) throws SQLException {
                  try (Statement stmt=conn.createStatement(); ResultSet rows=stmt.executeQuery("""
                          SELECT product_id, SUM(reserved_quantity) AS reserved
                          FROM stock_reservations
                          WHERE status='ACTIVE'
                          GROUP BY product_id
                          HAVING SUM(reserved_quantity) > 2147483647
                          """)) {
                      if (rows.next()) throw new SQLException("Active reservations exceed the supported quantity for product " + rows.getInt("product_id"));
                  }
                  try (Statement stmt=conn.createStatement()) {
                      stmt.executeUpdate("""
                          UPDATE products
                          SET reserved_quantity=COALESCE((
                              SELECT SUM(r.reserved_quantity)
                              FROM stock_reservations r
                              WHERE r.product_id=products.id AND r.status='ACTIVE'
                          ),0)
                          """);
                  }
              }

          '''
          s=replace_once(s,marker,method+marker,'StockManager reservation reconciliation')
          write(p,s)

          p='src/DatabaseManager.java'; s=read(p)
          s=replace_once(s,
              '        // Create triggers for stock reservation synchronization\n        createStockReservationTriggers();',
              '        // Create triggers for stock reservation synchronization\n        createStockReservationTriggers();\n        // reserved_quantity is a cache: repair older/stale databases from the reservation ledger.\n        StockManager.reconcileReservedStock(connection);',
              'DatabaseManager reservation reconciliation call')
          write(p,s)

          # 3) Manual OUTWARD movements must respect quantities already reserved by customer orders.
          p='src/WarehouseMovementDialog.java'; s=read(p)
          insert='''    private int availableForOutward(Connection conn, int productId) throws SQLException {
                  int available=StockManager.getAvailableStock(conn, productId);
                  if (movement != null && movement.getProductId() == productId) {
                      try {
                          if ("OUTWARD".equals(movement.getType())) return Math.addExact(available, movement.getQuantity());
                          if ("INWARD".equals(movement.getType())) return Math.subtractExact(available, movement.getQuantity());
                          throw new SQLException("Unsupported existing movement type: " + movement.getType());
                      } catch (ArithmeticException e) {
                          throw new SQLException("Stock availability exceeds the supported range", e);
                      }
                  }
                  return available;
              }

          '''
          s=replace_once(s,
              '    // Method to load movement data for editing\n',
              insert+'    // Method to load movement data for editing\n',
              'Warehouse movement helper insertion')
          old='''            // Get current stock from database (fresh data)
                      int currentStock = getCurrentStock(selectedProduct.getId());
          
                      if ("OUTWARD".equals(type)) {
                          if (movement != null && "OUTWARD".equals(movement.getType()) &&
                              movement.getProductId() == selectedProduct.getId()) {
                              // If editing an outward movement for the same product, add back the original quantity
                              currentStock += movement.getQuantity();
                          }
          
                          if (requestedQuantity > currentStock) {
                              availabilityLabel.setText(String.format(
                                  "⚠️ Insufficient stock! Available: %d, Requested: %d",
                                  currentStock, requestedQuantity));
          '''
          new='''            // Get current stock from database (fresh data)
                      int currentStock = getCurrentStock(selectedProduct.getId());
          
                      if ("OUTWARD".equals(type)) {
                          Connection conn=DatabaseManager.getInstance().getConnection();
                          int available=availableForOutward(conn, selectedProduct.getId());
                          if (requestedQuantity > available) {
                              availabilityLabel.setText(String.format(
                                  "⚠️ Insufficient stock! Available: %d, Requested: %d",
                                  available, requestedQuantity));
          '''
          s=replace_once(s,old,new,'Warehouse movement preview availability')
          s=replace_once(s,
              '                                currentStock, currentStock - requestedQuantity));',
              '                                available, available - requestedQuantity));',
              'Warehouse movement preview remaining')
          old='''                int availability = getCurrentStock(selectedProduct.getId());
                          if (movement != null && "OUTWARD".equals(movement.getType()) &&
                              movement.getProductId() == selectedProduct.getId()) {
                              availability += movement.getQuantity(); // Restore original quantity
                          }
          '''
          s=replace_once(s,old,
              '                int availability = availableForOutward(conn, selectedProduct.getId());\n',
              'Warehouse movement save availability')
          write(p,s)

          # 4) An invoiced customer order is the source of an immutable linked document.
          p='src/OrderDialog.java'; s=read(p)
          anchor='''            DatabaseManager.beginTransaction(conn);
                      try {
                      // Check stock availability for New, In Progress and Completed states
          '''
          guard='''            DatabaseManager.beginTransaction(conn);
                      try {
                      if (order != null) {
                          try (PreparedStatement linked=conn.prepareStatement("SELECT number FROM invoices WHERE order_id=? LIMIT 1")) {
                              linked.setInt(1, order.getId());
                              try (ResultSet invoiceRow=linked.executeQuery()) {
                                  if (invoiceRow.next()) throw new SQLException(I18n.tr("This order already has an invoice and cannot be modified."));
                              }
                          }
                      }
                      // Check stock availability for New, In Progress and Completed states
          '''
          s=replace_once(s,anchor,guard,'OrderDialog linked invoice guard')
          write(p,s)

          p='src/OrdersPanel.java'; s=read(p)
          old='''    private void editSelectedOrder() {
                  int selectedRow = ordersTable.getSelectedRow();
                  if (selectedRow != -1) {
                      // Convert view index to model index (important when table is sorted)
                      int modelRow = ordersTable.convertRowIndexToModel(selectedRow);
                      int orderId = (int)tableModel.getValueAt(modelRow, 0);
                      try {
                          Order order = loadOrderDetails(orderId);
          '''
          new='''    private void editSelectedOrder() {
                  int selectedRow = ordersTable.getSelectedRow();
                  if (selectedRow != -1) {
                      // Convert view index to model index (important when table is sorted)
                      int modelRow = ordersTable.convertRowIndexToModel(selectedRow);
                      int orderId = (int)tableModel.getValueAt(modelRow, 0);
                      try {
                          try (PreparedStatement linked=DatabaseManager.getInstance().getConnection().prepareStatement(
                                  "SELECT number FROM invoices WHERE order_id=? LIMIT 1")) {
                              linked.setInt(1,orderId);
                              try (ResultSet row=linked.executeQuery()) {
                                  if (row.next()) {
                                      JOptionPane.showMessageDialog(this,
                                          I18n.tr("This order already has an invoice and cannot be modified.") + "\n" +
                                              I18n.tr("Invoice") + ": " + row.getString(1),
                                          I18n.tr("Invoice Already Exists"), JOptionPane.WARNING_MESSAGE);
                                      return;
                                  }
                              }
                          }
                          Order order = loadOrderDetails(orderId);
          '''
          s=replace_once(s,old,new,'OrdersPanel edit linked order guard')
          old='''        String status = (String)tableModel.getValueAt(modelRow, 3);
          
                  try {
                      Connection connection = DatabaseManager.getInstance().getConnection();
          '''
          new='''        String status = (String)tableModel.getValueAt(modelRow, 3);
          
                  if (!"Completed".equals(status)) {
                      JOptionPane.showMessageDialog(this,
                          I18n.tr("Only completed customer orders can be invoiced."),
                          I18n.tr("Generate Invoice"), JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          
                  try {
                      Connection connection = DatabaseManager.getInstance().getConnection();
          '''
          s=replace_once(s,old,new,'OrdersPanel invoice eligibility')
          write(p,s)

          # 5) Finalized invoices cannot be deleted, directly or through customer cascade deletion.
          p='src/InvoicesPanel.java'; s=read(p)
          anchor='''            String status = (String)tableModel.getValueAt(modelRow, 6);
          
                  int result = JOptionPane.showConfirmDialog(this,
          '''
          replacement='''            String status = (String)tableModel.getValueAt(modelRow, 6);
          
                  if (InvoiceDialog.isFinalizedStatus(status)) {
                      JOptionPane.showMessageDialog(this,
                          I18n.tr("Issued, Paid and Canceled invoices are historical documents. Only their status can be changed."),
                          I18n.tr("Historical Invoice"), JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          
                  int result = JOptionPane.showConfirmDialog(this,
          '''
          s=replace_once(s,anchor,replacement,'InvoicesPanel finalized deletion guard')
          write(p,s)

          p='src/CustomersPanel.java'; s=read(p)
          anchor='''                boolean hasOrders = hasCustomerOrders(conn, id);
                          boolean hasInvoices = hasCustomerInvoices(conn, id);
          
                          if (hasOrders || hasInvoices) {
          '''
          replacement='''                boolean hasOrders = hasCustomerOrders(conn, id);
                          boolean hasInvoices = hasCustomerInvoices(conn, id);
                          if (hasFinalizedCustomerInvoices(conn,id)) {
                              JOptionPane.showMessageDialog(this,
                                  I18n.tr("Issued, Paid and Canceled invoices are historical documents. Only their status can be changed."),
                                  I18n.tr("Historical Invoice"), JOptionPane.WARNING_MESSAGE);
                              return;
                          }
          
                          if (hasOrders || hasInvoices) {
          '''
          s=replace_once(s,anchor,replacement,'CustomersPanel finalized history guard')
          marker='''    private boolean hasCustomerInvoices(Connection conn, int customerId) throws SQLException {
          '''
          helper='''    private boolean hasFinalizedCustomerInvoices(Connection conn, int customerId) throws SQLException {
                  try (PreparedStatement pstmt=conn.prepareStatement(
                          "SELECT 1 FROM invoices WHERE customer_id=? AND status<>'Draft' LIMIT 1")) {
                      pstmt.setInt(1,customerId);
                      try (ResultSet rs=pstmt.executeQuery()) { return rs.next(); }
                  }
              }
          
          '''
          s=replace_once(s,marker,helper+marker,'CustomersPanel finalized helper')
          write(p,s)

          # Translate the two new order-policy messages in every supported language.
          translations={
              'en':('Only completed customer orders can be invoiced.','This order already has an invoice and cannot be modified.'),
              'it':('È possibile fatturare solo gli ordini cliente completati.','Questo ordine ha già una fattura e non può essere modificato.'),
              'es':('Solo se pueden facturar los pedidos de clientes completados.','Este pedido ya tiene una factura y no puede modificarse.'),
              'fr':('Seules les commandes client terminées peuvent être facturées.','Cette commande possède déjà une facture et ne peut pas être modifiée.'),
              'de':('Nur abgeschlossene Kundenaufträge können in Rechnung gestellt werden.','Dieser Auftrag hat bereits eine Rechnung und kann nicht geändert werden.'),
              'pl':('Fakturować można tylko zrealizowane zamówienia klientów.','To zamówienie ma już fakturę i nie może być modyfikowane.'),
              'pt_BR':('Somente pedidos de clientes concluídos podem ser faturados.','Este pedido já possui uma fatura e não pode ser alterado.')
          }
          def prop_key(text):
              out=''
              for ch in text:
                  out += ('\\'+ch) if ch in ' :=\\' else ch
              return out
          for lang,(a,b) in translations.items():
              path=f'resources/i18n/messages_{lang}.properties'; text=read(path).rstrip()+'\n'
              for key,val in [("Only completed customer orders can be invoiced.",a),("This order already has an invoice and cannot be modified.",b)]:
                  encoded=prop_key(key)+'='
                  if encoded not in text:
                      text += encoded+val+'\n'
              write(path,text)

          # Regression tests for the critical paths.
          p='tests/OperationalRegressionTest.java'; s=read(p)
          marker='''    static void operational() throws Exception {
                  test("inventory correction records only the physical delta",()->{
          '''
          tests='''    static void operational() throws Exception {
                  test("startup reconciles reserved stock from active reservation ledger",()->{
                      fresh();
                      StockManager.createOrUpdateReservation(db,1,"ORDER",77,8,"");
                      require("8".equals(value("SELECT reserved_quantity FROM products WHERE id=1")),"Reservation trigger fixture failed");
                      sql("UPDATE products SET reserved_quantity=0 WHERE id=1");
                      call(DatabaseManager.getInstance(),"createTables");
                      require("8".equals(value("SELECT reserved_quantity FROM products WHERE id=1")),"Startup left active reservations out of available stock");
                  });
                  test("manual outward availability respects reservations and edited movement reversal",()->{
                      fresh();
                      StockManager.createOrUpdateReservation(db,1,"ORDER",77,8,"");
                      WarehouseMovementDialog dialog=empty(WarehouseMovementDialog.class);
                      put(dialog,"movement",null);
                      require(((Number)call(dialog,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,
                          "Manual movement ignored reserved stock");
                      sql("UPDATE products SET quantity=15 WHERE id=1");
                      put(dialog,"movement",new WarehouseMovement(1,1,"Product A",new java.util.Date(),"INWARD",5,"OTHER",null,null,""));
                      require(((Number)call(dialog,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,
                          "Editing an INWARD movement did not reverse the old receipt before availability check");
                      sql("UPDATE products SET quantity=5 WHERE id=1");
                      put(dialog,"movement",new WarehouseMovement(1,1,"Product A",new java.util.Date(),"OUTWARD",5,"OTHER",null,null,""));
                      require(((Number)call(dialog,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,
                          "Editing an OUTWARD movement did not add back the old issue before availability check");
                  });
                  test("linked invoices freeze source orders and finalized customer history",()->{
                      fresh();completed();
                      sql("INSERT INTO invoices(number,date,customer_id,taxable_amount,vat,total,status,order_id,currency_code) VALUES('LOCKED',0,1,30,0,30,'Issued',1,'EUR')");
                      InvoiceSnapshots.capture(db,Integer.parseInt(value("SELECT id FROM invoices WHERE number='LOCKED'")),false);
                      OD edit=order(true,5,"Completed");rejectedSave(edit,"saveOrder","orderSaved");
                      require(qty()==7 && "30.0|3".equals(value("SELECT total||'|'||(SELECT quantity FROM order_details WHERE order_id=1) FROM orders WHERE id=1")),
                          "Editing an invoiced order changed stock or order values");
                      CustomersPanel customers=new CustomersPanel();
                      require((Boolean)call(customers,"hasFinalizedCustomerInvoices",new Class<?>[]{Connection.class,int.class},db,1),
                          "Customer cascade does not recognize finalized invoice history");
                      require(InvoiceDialog.isFinalizedStatus("Issued") && InvoiceDialog.isFinalizedStatus("Paid") && InvoiceDialog.isFinalizedStatus("Canceled") && !InvoiceDialog.isFinalizedStatus("Draft"),
                          "Finalized invoice policy is inconsistent");
                  });
                  test("cancelled and unfinished customer orders cannot enter invoice workflow",()->{
                      for(String status:java.util.List.of("New","In Progress","Cancelled")) {
                          fresh();
                          sql("INSERT INTO orders(id,customer_id,order_date,status,total) VALUES(10,1,0,'"+status+"',10)");
                          sql("INSERT INTO order_details(order_id,product_id,quantity,unit_price) VALUES(10,1,1,10)");
                          OrdersPanel panel=new OrdersPanel(); JTable table=(JTable)get(panel,"ordersTable");
                          table.setRowSelectionInterval(0,0);
                          try { call(panel,"generateInvoiceFromOrder"); } catch(java.awt.HeadlessException expected) { }
                          require("0".equals(value("SELECT COUNT(*) FROM invoices")),"Non-completed order was invoiced: "+status);
                      }
                  });
                  test("inventory correction records only the physical delta",()->{
          '''
          s=replace_once(s,marker,tests,'Operational critical regression tests')
          write(p,s)
      - name: Run full regression suite
        run: ant test
      - name: Commit tested fixes and remove temporary workflow
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/critical-logic-fix.yml
          git add src tests resources/i18n
          git commit -m "Fix critical stock and document integrity paths"
          git push origin HEAD:fix/macos-filechooser-i18n
