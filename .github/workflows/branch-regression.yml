name: Branch Regression

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run WareStat regression suite
        run: bash tests/run-regressions.sh
