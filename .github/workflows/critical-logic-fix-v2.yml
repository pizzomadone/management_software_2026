name: Critical logic fixes v2

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Patch critical paths
        shell: python
        run: |
          from pathlib import Path

          def rw(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s); p.write_text(n,encoding='utf-8')
          def once(s, old, new, label):
              c=s.count(old)
              if c != 1: raise SystemExit(f'{label}: expected 1, found {c}')
              return s.replace(old,new,1)

          # Finalized invoice policy must be identical for both constructors.
          def invoice_dialog(s):
              s=once(s,'        this.historicalForeignCurrencyLocked = invoice != null && !"Draft".equals(invoice.getStatus())\n            && !currencyCode().equals(SettingsPanel.getCurrencyCode());','        this.historicalForeignCurrencyLocked = invoice != null && isFinalizedStatus(invoice.getStatus());','JDialog finalized lock')
              return once(s,'    private static boolean isFinalizedStatus(String status) {','    static boolean isFinalizedStatus(String status) {','finalized policy visibility')
          rw('src/InvoiceDialog.java',invoice_dialog)

          # reserved_quantity is derived data: repair it from the active reservation ledger.
          def stock_manager(s):
              method='''    /** Rebuild the cached reserved quantity from the active reservation ledger. */
              public static void reconcileReservedStock(Connection conn) throws SQLException {
                  try (Statement stmt=conn.createStatement(); ResultSet rows=stmt.executeQuery("""
                          SELECT product_id, SUM(reserved_quantity) AS reserved
                          FROM stock_reservations WHERE status='ACTIVE'
                          GROUP BY product_id HAVING SUM(reserved_quantity) > 2147483647
                          """)) {
                      if (rows.next()) throw new SQLException("Active reservations exceed the supported quantity for product " + rows.getInt("product_id"));
                  }
                  try (Statement stmt=conn.createStatement()) {
                      stmt.executeUpdate("""
                          UPDATE products SET reserved_quantity=COALESCE((
                              SELECT SUM(r.reserved_quantity) FROM stock_reservations r
                              WHERE r.product_id=products.id AND r.status='ACTIVE'
                          ),0)
                          """);
                  }
              }

          '''
              return once(s,'    // Helper classes\n\n',method+'    // Helper classes\n\n','reservation reconcile method')
          rw('src/StockManager.java',stock_manager)

          def db_manager(s):
              return once(s,'        // Create triggers for stock reservation synchronization\n        createStockReservationTriggers();','        // Create triggers for stock reservation synchronization\n        createStockReservationTriggers();\n        StockManager.reconcileReservedStock(connection);','reservation reconcile startup')
          rw('src/DatabaseManager.java',db_manager)

          # Manual issues must use available stock (physical minus reservations) and reverse the old edit first.
          def movement(s):
              helper='''    private int availableForOutward(Connection conn, int productId) throws SQLException {
                  int available=StockManager.getAvailableStock(conn,productId);
                  if (movement == null || movement.getProductId() != productId) return available;
                  try {
                      if ("OUTWARD".equals(movement.getType())) return Math.addExact(available,movement.getQuantity());
                      if ("INWARD".equals(movement.getType())) return Math.subtractExact(available,movement.getQuantity());
                  } catch (ArithmeticException e) {
                      throw new SQLException("Stock availability exceeds the supported range",e);
                  }
                  throw new SQLException("Unsupported existing movement type: " + movement.getType());
              }

          '''
              s=once(s,'    // Method to load movement data for editing\n',helper+'    // Method to load movement data for editing\n','movement helper')
              old='''            if ("OUTWARD".equals(type)) {
                          if (movement != null && "OUTWARD".equals(movement.getType()) &&
                              movement.getProductId() == selectedProduct.getId()) {
                              // If editing an outward movement for the same product, add back the original quantity
                              currentStock += movement.getQuantity();
                          }
          
                          if (requestedQuantity > currentStock) {
          '''
              new='''            if ("OUTWARD".equals(type)) {
                          int available=availableForOutward(DatabaseManager.getInstance().getConnection(),selectedProduct.getId());
                          if (requestedQuantity > available) {
          '''
              s=once(s,old,new,'movement preview logic')
              s=once(s,'                        currentStock, requestedQuantity));','                        available, requestedQuantity));','movement preview available')
              s=once(s,'                        currentStock, currentStock - requestedQuantity));','                        available, available - requestedQuantity));','movement preview remainder')
              old='''                int availability = getCurrentStock(selectedProduct.getId());
                          if (movement != null && "OUTWARD".equals(movement.getType()) &&
                              movement.getProductId() == selectedProduct.getId()) {
                              availability += movement.getQuantity(); // Restore original quantity
                          }
          '''
              return once(s,old,'                int availability = availableForOutward(conn,selectedProduct.getId());\n','movement save availability')
          rw('src/WarehouseMovementDialog.java',movement)

          # Once an order has generated an invoice, its economic/stock source cannot diverge.
          def order_dialog(s):
              old='''            DatabaseManager.beginTransaction(conn);
                      try {
                      // Check stock availability for New, In Progress and Completed states
          '''
              new='''            DatabaseManager.beginTransaction(conn);
                      try {
                      if (order != null) {
                          try (PreparedStatement linked=conn.prepareStatement("SELECT number FROM invoices WHERE order_id=? LIMIT 1")) {
                              linked.setInt(1,order.getId());
                              try (ResultSet row=linked.executeQuery()) {
                                  if (row.next()) throw new SQLException(I18n.tr("This order already has an invoice and cannot be modified."));
                              }
                          }
                      }
                      // Check stock availability for New, In Progress and Completed states
          '''
              return once(s,old,new,'linked order save guard')
          rw('src/OrderDialog.java',order_dialog)

          def orders_panel(s):
              old='''            int orderId = (int)tableModel.getValueAt(modelRow, 0);
                      try {
                          Order order = loadOrderDetails(orderId);
          '''
              new='''            int orderId = (int)tableModel.getValueAt(modelRow, 0);
                      try {
                          try (PreparedStatement linked=DatabaseManager.getInstance().getConnection().prepareStatement("SELECT number FROM invoices WHERE order_id=? LIMIT 1")) {
                              linked.setInt(1,orderId);
                              try (ResultSet row=linked.executeQuery()) {
                                  if (row.next()) {
                                      JOptionPane.showMessageDialog(this,I18n.tr("This order already has an invoice and cannot be modified.") + "\\n" + I18n.tr("Invoice") + ": " + row.getString(1),I18n.tr("Invoice Already Exists"),JOptionPane.WARNING_MESSAGE);
                                      return;
                                  }
                              }
                          }
                          Order order = loadOrderDetails(orderId);
          '''
              s=once(s,old,new,'linked order UI guard')
              marker='''        String status = (String)tableModel.getValueAt(modelRow, 3);
          
                  try {
                      Connection connection = DatabaseManager.getInstance().getConnection();
          '''
              replacement='''        String status = (String)tableModel.getValueAt(modelRow, 3);
          
                  if (!"Completed".equals(status)) {
                      JOptionPane.showMessageDialog(this,I18n.tr("Only completed customer orders can be invoiced."),I18n.tr("Generate Invoice"),JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          
                  try {
                      Connection connection = DatabaseManager.getInstance().getConnection();
          '''
              return once(s,marker,replacement,'invoice eligibility')
          rw('src/OrdersPanel.java',orders_panel)

          def invoices_panel(s):
              old='''            String status = (String)tableModel.getValueAt(modelRow, 6);
          
                  int result = JOptionPane.showConfirmDialog(this,
          '''
              new='''            String status = (String)tableModel.getValueAt(modelRow, 6);
          
                  if (InvoiceDialog.isFinalizedStatus(status)) {
                      JOptionPane.showMessageDialog(this,I18n.tr("Issued, Paid and Canceled invoices are historical documents. Only their status can be changed."),I18n.tr("Historical Invoice"),JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          
                  int result = JOptionPane.showConfirmDialog(this,
          '''
              return once(s,old,new,'finalized invoice delete guard')
          rw('src/InvoicesPanel.java',invoices_panel)

          def customers_panel(s):
              old='''                boolean hasOrders = hasCustomerOrders(conn, id);
                          boolean hasInvoices = hasCustomerInvoices(conn, id);
          
                          if (hasOrders || hasInvoices) {
          '''
              new='''                boolean hasOrders = hasCustomerOrders(conn, id);
                          boolean hasInvoices = hasCustomerInvoices(conn, id);
                          if (hasFinalizedCustomerInvoices(conn,id)) {
                              JOptionPane.showMessageDialog(this,I18n.tr("Issued, Paid and Canceled invoices are historical documents. Only their status can be changed."),I18n.tr("Historical Invoice"),JOptionPane.WARNING_MESSAGE);
                              return;
                          }
          
                          if (hasOrders || hasInvoices) {
          '''
              s=once(s,old,new,'customer historical guard')
              helper='''    private boolean hasFinalizedCustomerInvoices(Connection conn,int customerId) throws SQLException {
                  try (PreparedStatement p=conn.prepareStatement("SELECT 1 FROM invoices WHERE customer_id=? AND status<>'Draft' LIMIT 1")) {
                      p.setInt(1,customerId); try (ResultSet r=p.executeQuery()) { return r.next(); }
                  }
              }

          '''
              return once(s,'    private boolean hasCustomerInvoices(Connection conn, int customerId) throws SQLException {\n',helper+'    private boolean hasCustomerInvoices(Connection conn, int customerId) throws SQLException {\n','customer finalized helper')
          rw('src/CustomersPanel.java',customers_panel)

          # New messages in all supported languages.
          vals={
            'en':['Only completed customer orders can be invoiced.','This order already has an invoice and cannot be modified.'],
            'it':['È possibile fatturare solo gli ordini cliente completati.','Questo ordine ha già una fattura e non può essere modificato.'],
            'es':['Solo se pueden facturar los pedidos de clientes completados.','Este pedido ya tiene una factura y no puede modificarse.'],
            'fr':['Seules les commandes client terminées peuvent être facturées.','Cette commande possède déjà une facture et ne peut pas être modifiée.'],
            'de':['Nur abgeschlossene Kundenaufträge können in Rechnung gestellt werden.','Dieser Auftrag hat bereits eine Rechnung und kann nicht geändert werden.'],
            'pl':['Fakturować można tylko zrealizowane zamówienia klientów.','To zamówienie ma już fakturę i nie może być modyfikowane.'],
            'pt_BR':['Somente pedidos de clientes concluídos podem ser faturados.','Este pedido já possui uma fatura e não pode ser alterado.']}
          keys=['Only completed customer orders can be invoiced.','This order already has an invoice and cannot be modified.']
          def pk(x):
              return ''.join(('\\'+c if c in ' :=\\' else c) for c in x)
          for lang,translations in vals.items():
              path=Path(f'resources/i18n/messages_{lang}.properties'); text=path.read_text(encoding='utf-8').rstrip()+'\n'
              for key,val in zip(keys,translations):
                  prefix=pk(key)+'='
                  if prefix not in text: text += prefix+val+'\n'
              path.write_text(text,encoding='utf-8')

          # Permanent regression coverage for the critical findings.
          def tests(s):
              marker='''    static void operational() throws Exception {
                  test("inventory correction records only the physical delta",()->{
          '''
              add='''    static void operational() throws Exception {
                  test("startup reconciles reserved stock from active reservation ledger",()->{
                      fresh();StockManager.createOrUpdateReservation(db,1,"ORDER",77,8,"");
                      sql("UPDATE products SET reserved_quantity=0 WHERE id=1");call(DatabaseManager.getInstance(),"createTables");
                      require("8".equals(value("SELECT reserved_quantity FROM products WHERE id=1")),"Startup ignored active reservations");
                  });
                  test("manual outward availability respects reservations and movement reversal",()->{
                      fresh();StockManager.createOrUpdateReservation(db,1,"ORDER",77,8,"");
                      WarehouseMovementDialog d=empty(WarehouseMovementDialog.class);put(d,"movement",null);
                      require(((Number)call(d,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,"Manual issue ignored reservations");
                      sql("UPDATE products SET quantity=15 WHERE id=1");put(d,"movement",new WarehouseMovement(1,1,"A",new java.util.Date(),"INWARD",5,"OTHER",null,null,""));
                      require(((Number)call(d,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,"Edited receipt was not reversed for availability");
                      sql("UPDATE products SET quantity=5 WHERE id=1");put(d,"movement",new WarehouseMovement(1,1,"A",new java.util.Date(),"OUTWARD",5,"OTHER",null,null,""));
                      require(((Number)call(d,"availableForOutward",new Class<?>[]{Connection.class,int.class},db,1)).intValue()==2,"Edited issue was not reversed for availability");
                  });
                  test("linked invoice freezes source order and finalized customer history",()->{
                      fresh();completed();sql("INSERT INTO invoices(number,date,customer_id,taxable_amount,vat,total,status,order_id,currency_code) VALUES('LOCKED',0,1,30,0,30,'Issued',1,'EUR')");
                      InvoiceSnapshots.capture(db,Integer.parseInt(value("SELECT id FROM invoices WHERE number='LOCKED'")),false);
                      OD d=order(true,5,"Completed");rejectedSave(d,"saveOrder","orderSaved");
                      require(qty()==7 && "30.0|3".equals(value("SELECT total||'|'||(SELECT quantity FROM order_details WHERE order_id=1) FROM orders WHERE id=1")),"Linked order changed");
                      CustomersPanel customers=new CustomersPanel();
                      require((Boolean)call(customers,"hasFinalizedCustomerInvoices",new Class<?>[]{Connection.class,int.class},db,1),"Finalized history not detected");
                  });
                  test("unfinished and cancelled orders cannot be invoiced",()->{
                      for(String status:java.util.List.of("New","In Progress","Cancelled")) {
                          fresh();sql("INSERT INTO orders(id,customer_id,order_date,status,total) VALUES(10,1,0,'"+status+"',10)");sql("INSERT INTO order_details(order_id,product_id,quantity,unit_price) VALUES(10,1,1,10)");
                          OrdersPanel panel=new OrdersPanel();JTable table=(JTable)get(panel,"ordersTable");table.setRowSelectionInterval(0,0);
                          try {call(panel,"generateInvoiceFromOrder");} catch(java.awt.HeadlessException expected) {}
                          require("0".equals(value("SELECT COUNT(*) FROM invoices")),"Non-completed order invoiced: "+status);
                      }
                  });
                  test("inventory correction records only the physical delta",()->{
          '''
              return once(s,marker,add,'critical regression tests')
          rw('tests/OperationalRegressionTest.java',tests)
      - name: Run full regression suite
        run: ant test
      - name: Commit tested fixes
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/critical-logic-fix.yml .github/workflows/critical-logic-fix-v2.yml
          git add src tests resources/i18n
          git commit -m "Fix critical stock and document integrity paths"
          git push origin HEAD:fix/macos-filechooser-i18n
