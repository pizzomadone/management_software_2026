name: Apply currency backup link

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Apply backup-link change
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/SettingsPanel.java')
          s = p.read_text(encoding='utf-8')
          old = '''        Object[] options={
              I18n.tr("Change currency only"),
              I18n.tr("Convert values"),
              I18n.tr("Cancel")
          };
          int choice=JOptionPane.showOptionDialog(this,warning,I18n.tr("Change Currency"),
              JOptionPane.DEFAULT_OPTION,JOptionPane.WARNING_MESSAGE,null,options,options[0]);

          if(choice<0 || choice==2) {
              restoreCurrencySelection(oldCode);
              return (String)currencyCombo.getSelectedItem();
          }
          '''
          new = '''        JPanel warningPanel=new JPanel();
          warningPanel.setLayout(new BoxLayout(warningPanel,BoxLayout.Y_AXIS));
          JTextArea warningText=new JTextArea(warning);
          warningText.setEditable(false);
          warningText.setFocusable(false);
          warningText.setOpaque(false);
          warningText.setBorder(null);
          warningText.setFont(UIManager.getFont("Label.font"));
          warningPanel.add(warningText);
          warningPanel.add(Box.createVerticalStrut(10));
          warningPanel.add(new JLabel(I18n.tr("Before changing currency, we recommend creating a backup of your database.")));

          boolean[] backupRequested={false};
          JLabel backupLink=new JLabel("<html><a href='backup'>"+I18n.tr("Open Backup")+"</a></html>");
          backupLink.setCursor(Cursor.getPredefinedCursor(Cursor.HAND_CURSOR));
          backupLink.addMouseListener(new MouseAdapter() {
              @Override public void mouseClicked(MouseEvent event) {
                  backupRequested[0]=true;
                  Window dialog=SwingUtilities.getWindowAncestor(backupLink);
                  if(dialog!=null) dialog.dispose();
              }
          });
          warningPanel.add(backupLink);

          Object[] options={
              I18n.tr("Change currency only"),
              I18n.tr("Convert values"),
              I18n.tr("Cancel")
          };
          int choice=JOptionPane.showOptionDialog(this,warningPanel,I18n.tr("Change Currency"),
              JOptionPane.DEFAULT_OPTION,JOptionPane.WARNING_MESSAGE,null,options,options[0]);

          if(backupRequested[0]) {
              restoreCurrencySelection(oldCode);
              Window owner=SwingUtilities.getWindowAncestor(this);
              if(owner instanceof MainWindow mainWindow) mainWindow.showPanelByName("BACKUP");
              return (String)currencyCombo.getSelectedItem();
          }
          if(choice<0 || choice==2) {
              restoreCurrencySelection(oldCode);
              return (String)currencyCombo.getSelectedItem();
          }
          '''
          if old not in s:
              raise SystemExit('SettingsPanel currency warning block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          translations = {
            'en': ('Before changing currency, we recommend creating a backup of your database.', 'Open Backup'),
            'it': ('Prima di cambiare valuta, è consigliato creare un backup del database.', 'Apri Backup'),
            'es': ('Antes de cambiar la moneda, recomendamos crear una copia de seguridad de la base de datos.', 'Abrir Copia de seguridad'),
            'fr': ('Avant de changer de devise, nous vous recommandons de créer une sauvegarde de la base de données.', 'Ouvrir Sauvegarde'),
            'de': ('Vor dem Währungswechsel empfehlen wir, eine Sicherung der Datenbank zu erstellen.', 'Backup öffnen'),
            'pl': ('Przed zmianą waluty zalecamy utworzenie kopii zapasowej bazy danych.', 'Otwórz Kopię zapasową'),
            'pt_BR': ('Antes de alterar a moeda, recomendamos criar um backup do banco de dados.', 'Abrir Backup'),
          }
          source1='Before changing currency, we recommend creating a backup of your database.'
          source2='Open Backup'
          def key(text):
              return text.replace('\\','\\\\').replace(' ', '\\ ').replace(':','\\:').replace('=','\\=')
          for lang,(v1,v2) in translations.items():
              path=Path(f'resources/i18n/messages_{lang}.properties')
              text=path.read_text(encoding='utf-8')
              additions=[]
              for k,v in ((source1,v1),(source2,v2)):
                  ek=key(k)
                  if not any(line.startswith(ek+'=') for line in text.splitlines()):
                      additions.append(f'{ek}={v}')
              if additions:
                  path.write_text(text.rstrip()+"\n\n# Currency backup recommendation\n"+'\n'.join(additions)+'\n',encoding='utf-8')

          test=Path('tests/ExtendedRegressionTest.java')
          ts=test.read_text(encoding='utf-8')
          needle='''                "A finalized invoice cannot be returned to Draft."
          };'''
          repl='''                "A finalized invoice cannot be returned to Draft.",
                  "Before changing currency, we recommend creating a backup of your database.",
                  "Open Backup"
          };'''
          if needle not in ts:
              raise SystemExit('Translation test insertion point not found')
          test.write_text(ts.replace(needle,repl,1),encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-currency-backup-link.yml
          git config user.name "WareStat automation"
          git config user.email "actions@github.com"
          git add src/SettingsPanel.java resources/i18n tests/ExtendedRegressionTest.java .github/workflows/patch-currency-backup-link.yml
          git commit -m "Recommend backup before changing currency"
          git push origin HEAD:fix/macos-filechooser-i18n
