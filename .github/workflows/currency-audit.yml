name: Currency and regression audit

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Fix dashboard mouse wheel
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/DashboardPanel.java')
          s = p.read_text(encoding='utf-8')
          marker = '        scrollPane.getVerticalScrollBar().setUnitIncrement(16);\n'
          if 'routeNestedMouseWheel(mainContainer, scrollPane);' not in s:
              if marker not in s:
                  raise SystemExit('Main dashboard scroll marker not found')
              s = s.replace(marker, marker + '        routeNestedMouseWheel(mainContainer, scrollPane);\n', 1)
          method_marker = '    private JPanel createHeaderPanel() {\n'
          helper = '''    private void routeNestedMouseWheel(Container root, JScrollPane dashboardScrollPane) {
              for (Component component : root.getComponents()) {
                  if (component instanceof JScrollPane nestedScrollPane) {
                      nestedScrollPane.setWheelScrollingEnabled(false);
                      nestedScrollPane.addMouseWheelListener(event -> {
                          JScrollBar bar = dashboardScrollPane.getVerticalScrollBar();
                          int increment = Math.max(1, bar.getUnitIncrement(event.getWheelRotation()));
                          bar.setValue(bar.getValue() + event.getUnitsToScroll() * increment);
                          event.consume();
                      });
                  } else if (component instanceof Container container) {
                      routeNestedMouseWheel(container, dashboardScrollPane);
                  }
              }
          }

'''
          if 'private void routeNestedMouseWheel(' not in s:
              if method_marker not in s:
                  raise SystemExit('Dashboard helper insertion marker not found')
              s = s.replace(method_marker, helper + method_marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Commit tested fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git show HEAD^:.github/workflows/currency-audit.yml > .github/workflows/currency-audit.yml
          git rm -f .github/workflows/fix-dashboard-scroll.yml
          git add src/DashboardPanel.java .github/workflows/currency-audit.yml
          git commit -m "Keep dashboard scrolling across nested panels"
          git push origin HEAD:fix/macos-filechooser-i18n
