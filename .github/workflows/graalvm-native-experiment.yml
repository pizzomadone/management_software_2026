name: GraalVM native-image experiment

on:
  push:
    branches:
      - experiment/graalvm-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-image-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up GraalVM Community 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm-community
          java-version: '21'

      - name: Ensure Ant is available
        shell: bash
        run: command -v ant >/dev/null 2>&1 || brew install ant

      - name: Compile release classes
        run: ant clean compile-release

      - name: Build native image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-out
          native-image \
            -J-Xmx6g \
            -Djava.awt.headless=false \
            -Dorg.sqlite.lib.exportPath="$PWD/native-out" \
            -H:+ReportExceptionStackTraces \
            -H:Name=WareStat-native \
            -H:Path="$PWD/native-out" \
            -H:IncludeResources='^(i18n/.*|icons/.*|fonts/.*|META-INF/services/.*|LICENSE-THIRD-PARTY.txt|NOTICE.txt)$' \
            -cp "build/release/classes:lib/*" \
            MainWindow

      - name: Inspect native output
        shell: bash
        run: |
          set -euo pipefail
          file native-out/WareStat-native
          du -h native-out/WareStat-native
          find native-out -maxdepth 1 -type f -print

      - name: Upload experimental binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WareStat-graalvm-macos-arm64-experiment
          path: native-out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
