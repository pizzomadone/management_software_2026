name: WareStat regressions

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'resources/i18n/**'
      - '.github/workflows/wsbq-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run regression suite
        run: bash tests/run-regressions.sh
