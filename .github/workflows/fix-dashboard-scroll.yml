name: Fix dashboard mouse wheel

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Patch dashboard wheel scrolling
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/DashboardPanel.java')
          s = p.read_text(encoding='utf-8')
          old = '''        JScrollPane scrollPane = new JScrollPane(mainContainer);
          scrollPane.setBorder(null);
          scrollPane.getVerticalScrollBar().setUnitIncrement(16);

          add(scrollPane, BorderLayout.CENTER);
      }

      private JPanel createHeaderPanel() {
          '''
          new = '''        JScrollPane scrollPane = new JScrollPane(mainContainer);
          scrollPane.setBorder(null);
          scrollPane.getVerticalScrollBar().setUnitIncrement(16);
          routeNestedMouseWheel(mainContainer, scrollPane);

          add(scrollPane, BorderLayout.CENTER);
      }

      private void routeNestedMouseWheel(Container root, JScrollPane dashboardScrollPane) {
          for (Component component : root.getComponents()) {
              if (component instanceof JScrollPane nestedScrollPane) {
                  nestedScrollPane.setWheelScrollingEnabled(false);
                  nestedScrollPane.addMouseWheelListener(event -> {
                      JScrollBar bar = dashboardScrollPane.getVerticalScrollBar();
                      int increment = Math.max(1, bar.getUnitIncrement(event.getWheelRotation()));
                      bar.setValue(bar.getValue() + event.getUnitsToScroll() * increment);
                      event.consume();
                  });
              } else if (component instanceof Container container) {
                  routeNestedMouseWheel(container, dashboardScrollPane);
              }
          }
      }

      private JPanel createHeaderPanel() {
          '''
          if old not in s:
              raise SystemExit('Dashboard scroll block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Commit tested fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/fix-dashboard-scroll.yml
          git add src/DashboardPanel.java
          git commit -m "Keep dashboard scrolling across nested panels"
          git push origin HEAD:fix/macos-filechooser-i18n
