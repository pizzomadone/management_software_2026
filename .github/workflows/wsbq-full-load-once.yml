name: WareStat full 20k benchmark one-shot
on:
  pull_request:
    paths:
      - '.github/workflows/wsbq-full-load-once.yml'
permissions:
  contents: read
concurrency:
  group: warestat-full20k-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-load:
    if: github.head_ref == 'test/wsbq-20k-load-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Disk free before
        run: df -h .
      - name: Generate 20000 products/photos and benchmark backup plus restore
        run: bash tests/run-load-benchmark.sh 20000 20000 true true
      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warestat-20k-full-report
          path: |
            build/load-benchmark-output/results.csv
            build/load-benchmark-output/dataset.txt
            build/load-benchmark-output/run.log
          if-no-files-found: warn
          retention-days: 7
