name: Fix all dialogs
on:
  push:
    branches: [fix/macos-filechooser-i18n]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Patch every Swing dialog
        shell: python
        run: |
          from pathlib import Path

          dialogs = r'''import javax.swing.*;
          import java.awt.Component;

          /** Centralized Swing dialogs: translate messages, titles and choices before Swing sizes the window. */
          public final class Dialogs {
              private Dialogs() {}

              private static Object message(Object value) {
                  if (value instanceof String text) return I18n.tr(text);
                  if (value instanceof Object[] values) {
                      Object[] translated = values.clone();
                      for (int i = 0; i < translated.length; i++) translated[i] = message(translated[i]);
                      return translated;
                  }
                  if (value instanceof Component component) I18n.localize(component);
                  return value;
              }

              private static Object[] choices(Object[] values) {
                  if (values == null) return null;
                  Object[] translated = values.clone();
                  for (int i = 0; i < translated.length; i++) translated[i] = message(translated[i]);
                  return translated;
              }

              public static void showMessageDialog(Component parent, Object msg) {
                  JOptionPane.showMessageDialog(parent, message(msg));
              }
              public static void showMessageDialog(Component parent, Object msg, String title, int type) {
                  JOptionPane.showMessageDialog(parent, message(msg), I18n.tr(title), type);
              }
              public static void showMessageDialog(Component parent, Object msg, String title, int type, Icon icon) {
                  JOptionPane.showMessageDialog(parent, message(msg), I18n.tr(title), type, icon);
              }

              public static int showConfirmDialog(Component parent, Object msg) {
                  return JOptionPane.showConfirmDialog(parent, message(msg));
              }
              public static int showConfirmDialog(Component parent, Object msg, String title, int optionType) {
                  return JOptionPane.showConfirmDialog(parent, message(msg), I18n.tr(title), optionType);
              }
              public static int showConfirmDialog(Component parent, Object msg, String title, int optionType, int messageType) {
                  return JOptionPane.showConfirmDialog(parent, message(msg), I18n.tr(title), optionType, messageType);
              }
              public static int showConfirmDialog(Component parent, Object msg, String title, int optionType, int messageType, Icon icon) {
                  return JOptionPane.showConfirmDialog(parent, message(msg), I18n.tr(title), optionType, messageType, icon);
              }

              public static int showOptionDialog(Component parent, Object msg, String title, int optionType,
                                                 int messageType, Icon icon, Object[] options, Object initialValue) {
                  Object[] translated = choices(options);
                  Object initial = initialValue instanceof String s ? I18n.tr(s) : initialValue;
                  if (translated != null && options != null && initialValue != null) {
                      for (int i = 0; i < options.length; i++) {
                          if (java.util.Objects.equals(options[i], initialValue)) {
                              initial = translated[i];
                              break;
                          }
                      }
                  }
                  return JOptionPane.showOptionDialog(parent, message(msg), I18n.tr(title), optionType,
                          messageType, icon, translated, initial);
              }

              public static String showInputDialog(Object msg) {
                  return JOptionPane.showInputDialog(message(msg));
              }
              public static String showInputDialog(Object msg, Object initialValue) {
                  return JOptionPane.showInputDialog(message(msg), initialValue);
              }
              public static String showInputDialog(Component parent, Object msg) {
                  return JOptionPane.showInputDialog(parent, message(msg));
              }
              public static String showInputDialog(Component parent, Object msg, Object initialValue) {
                  return JOptionPane.showInputDialog(parent, message(msg), initialValue);
              }
              public static String showInputDialog(Component parent, Object msg, String title, int messageType) {
                  return JOptionPane.showInputDialog(parent, message(msg), I18n.tr(title), messageType);
              }
              public static Object showInputDialog(Component parent, Object msg, String title, int messageType,
                                                   Icon icon, Object[] selectionValues, Object initialSelectionValue) {
                  return JOptionPane.showInputDialog(parent, message(msg), I18n.tr(title), messageType,
                          icon, choices(selectionValues), initialSelectionValue);
              }
          }
          '''
          # remove indentation introduced by YAML source formatting
          dialogs='\n'.join(line[10:] if line.startswith('          ') else line for line in dialogs.splitlines())+'\n'
          Path('src/Dialogs.java').write_text(dialogs, encoding='utf-8')

          # Every JOptionPane created by the application now receives localized content BEFORE layout/pack.
          for p in Path('src').glob('*.java'):
              if p.name == 'Dialogs.java':
                  continue
              s=p.read_text(encoding='utf-8')
              for method in ('showMessageDialog','showConfirmDialog','showOptionDialog','showInputDialog'):
                  s=s.replace('javax.swing.JOptionPane.'+method, 'Dialogs.'+method)
                  s=s.replace('JOptionPane.'+method, 'Dialogs.'+method)
              p.write_text(s, encoding='utf-8')

          # I18n: exact message first, then translate each line of compound message boxes.
          p=Path('src/I18n.java')
          s=p.read_text(encoding='utf-8')
          needle='''        String exact = translations.get(source);\n        if (exact != null) return exact;\n\n        // Preserve UI punctuation'''
          replacement='''        String exact = translations.get(source);\n        if (exact != null) return exact;\n\n        // JOptionPane messages are often assembled from several lines. Translate each\n        // line independently so dynamic values can still use registered templates.\n        if (source.indexOf('\\n') >= 0) {\n            String[] lines = source.split("\\\\n", -1);\n            StringBuilder translatedLines = new StringBuilder();\n            for (int i = 0; i < lines.length; i++) {\n                if (i > 0) translatedLines.append('\\n');\n                translatedLines.append(tr(lines[i]));\n            }\n            return translatedLines.toString();\n        }\n\n        // Preserve UI punctuation'''
          if 'JOptionPane messages are often assembled' not in s:
              if needle not in s: raise SystemExit('I18n insertion point not found')
              s=s.replace(needle,replacement,1)
          marker='''    private static String translateTemplate(String source) {'''
          fmt='''    public static String format(String source, Object... values) {\n        String result = tr(source);\n        for (int i = 0; i < values.length; i++) {\n            result = result.replace("{" + i + "}", String.valueOf(values[i]));\n        }\n        return result;\n    }\n\n'''
          if 'public static String format(String source, Object... values)' not in s:
              if marker not in s: raise SystemExit('I18n format insertion point not found')
              s=s.replace(marker,fmt+marker,1)
          p.write_text(s,encoding='utf-8')

          # Orders: success dialog gets a real navigation action.
          p=Path('src/OrdersPanel.java')
          s=p.read_text(encoding='utf-8')
          old='''                Dialogs.showMessageDialog(this,\n                    "Invoice " + invoiceNumber + " generated successfully!\\n" +\n                    "You can find it in the Invoices panel.",\n                    "Success", JOptionPane.INFORMATION_MESSAGE);\n\n                // Refresh invoices panel if available\n                parentWindow = SwingUtilities.getWindowAncestor(this);\n                if (parentWindow instanceof MainWindow) {\n                    ((MainWindow) parentWindow).refreshInvoicesPanel();\n                }'''
          # The source may not yet have been converted to Dialogs when this block is evaluated.
          old2=old.replace('Dialogs.showMessageDialog','JOptionPane.showMessageDialog')
          new='''                Object[] invoiceOptions = { I18n.tr("Go to Invoice"), I18n.tr("Close") };\n                int invoiceAction = Dialogs.showOptionDialog(this,\n                    I18n.format("Invoice {0} generated successfully!", invoiceNumber) + "\\n" +\n                    I18n.tr("You can find it in the Invoices panel."),\n                    I18n.tr("Invoice Generated"), JOptionPane.DEFAULT_OPTION,\n                    JOptionPane.INFORMATION_MESSAGE, null, invoiceOptions, invoiceOptions[0]);\n\n                Window invoiceParentWindow = SwingUtilities.getWindowAncestor(this);\n                if (invoiceParentWindow instanceof MainWindow mainWindow) {\n                    mainWindow.refreshInvoicesPanel();\n                    if (invoiceAction == 0) mainWindow.openInvoice(invoiceNumber);\n                }'''
          if 'invoiceAction = Dialogs.showOptionDialog' not in s:
              if old in s: s=s.replace(old,new,1)
              elif old2 in s: s=s.replace(old2,new,1)
              else: raise SystemExit('invoice success block not found')
          p.write_text(s,encoding='utf-8')

          # Invoice panel: allow MainWindow to select and reveal the newly generated invoice.
          p=Path('src/InvoicesPanel.java')
          s=p.read_text(encoding='utf-8')
          anchor='''    private String snapshotCustomerName(Connection c,int invoiceId) throws SQLException {'''
          method='''    public void selectInvoiceByNumber(String number) {\n        if (number == null) return;\n        for (int modelRow = 0; modelRow < tableModel.getRowCount(); modelRow++) {\n            if (!number.equals(String.valueOf(tableModel.getValueAt(modelRow, 0)))) continue;\n            int viewRow = invoicesTable.convertRowIndexToView(modelRow);\n            if (viewRow >= 0) {\n                invoicesTable.setRowSelectionInterval(viewRow, viewRow);\n                invoicesTable.scrollRectToVisible(invoicesTable.getCellRect(viewRow, 0, true));\n            }\n            return;\n        }\n    }\n\n'''
          if 'selectInvoiceByNumber(String number)' not in s:
              if anchor not in s: raise SystemExit('InvoicesPanel insertion point not found')
              s=s.replace(anchor,method+anchor,1)
          p.write_text(s,encoding='utf-8')

          # Main window: public navigation used by the new button.
          p=Path('src/MainWindow.java')
          s=p.read_text(encoding='utf-8')
          anchor='''    /**\n     * Refresh InvoicesPanel to update invoices list after generation\n     */\n    public void refreshInvoicesPanel() {'''
          method='''    public void openInvoice(String invoiceNumber) {\n        showPanel("INVOICES");\n        if (invoicesPanel != null) invoicesPanel.selectInvoiceByNumber(invoiceNumber);\n    }\n\n'''
          if 'public void openInvoice(String invoiceNumber)' not in s:
              if anchor not in s: raise SystemExit('MainWindow insertion point not found')
              s=s.replace(anchor,method+anchor,1)
          p.write_text(s,encoding='utf-8')

          # Complete dialog vocabulary. Existing entries are intentionally overridden at the end
          # so every locale uses the same current wording for message boxes.
