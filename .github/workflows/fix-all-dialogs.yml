              "Produkt '{0}' zawiera tylko niekrytyczne dane konfiguracyjne:","OSTRZEŻENIE: klient '{0}' i WSZYSTKIE powiązane dane zostaną trwale usunięte:",
              "OSTRZEŻENIE: dostawca '{0}' i WSZYSTKIE powiązane dane zostaną trwale usunięte:",'Tej operacji NIE można cofnąć!','Czy na pewno?'
          ]}

          assert all(len(v)==len(common_keys) for v in tr.values())

          def escape_key(key):
              out=[]
              for i,ch in enumerate(key):
                  if ch in '\\:=#!' or ch==' ':
                      out.append('\\'+ch)
                  else:
                      out.append(ch)
              return ''.join(out)

          marker='# Centralized dialog translations v3'
          for locale, values in tr.items():
              p=Path('resources/i18n')/f'messages_{locale}.properties'
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  s=s.split(marker,1)[0].rstrip()+'\n\n'
              s += marker+'\n'
              for key,value in zip(common_keys,values):
                  s += escape_key(key)+'='+value+'\n'
              p.write_text(s,encoding='utf-8')

          # Do not leave a temporary repair workflow in the repository.
          Path('.github/workflows/fix-all-dialogs.yml').unlink()
      - name: Compile and test
        run: ant test
      - name: Verify complete dialog routing
        shell: python
        run: |
          from pathlib import Path
          offenders=[]
          for p in Path('src').glob('*.java'):
              if p.name == 'Dialogs.java': continue
              s=p.read_text(encoding='utf-8')
              for method in ('showMessageDialog','showConfirmDialog','showOptionDialog','showInputDialog'):
                  if 'JOptionPane.'+method in s or 'javax.swing.JOptionPane.'+method in s:
                      offenders.append(f'{p}:{method}')
          if offenders:
              raise SystemExit('Direct untranslated dialogs remain: '+', '.join(offenders))
          orders=Path('src/OrdersPanel.java').read_text(encoding='utf-8')
          main=Path('src/MainWindow.java').read_text(encoding='utf-8')
          invoices=Path('src/InvoicesPanel.java').read_text(encoding='utf-8')
          assert 'Go to Invoice' in orders and 'openInvoice(invoiceNumber)' in orders
          assert 'public void openInvoice(String invoiceNumber)' in main
          assert 'selectInvoiceByNumber(String number)' in invoices
      - name: Commit
        run: |
          git config user.name 'WareStat audit'
          git config user.email 'actions@github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Localize every message box before display'
          git push origin HEAD:fix/macos-filechooser-i18n
