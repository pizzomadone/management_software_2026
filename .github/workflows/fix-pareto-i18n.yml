name: Fix Pareto translations

on:
  push:
    branches:
      - fix/macos-filechooser-i18n

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Fix Pareto dynamic translations
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/DashboardPanel.java')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '"No data available"': 'I18n.tr("No data available")',
              '"High-value products - Priority focus"': 'I18n.tr("High-value products - Priority focus")',
              '"Medium-value products - Monitor"': 'I18n.tr("Medium-value products - Monitor")',
              '"Low-value products - Consider liquidation"': 'I18n.tr("Low-value products - Consider liquidation")',
          }
          for old, new in replacements.items():
              if new in s:
                  continue
              if old not in s:
                  raise SystemExit(f'Pareto text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Run regression suite
        run: ant test
      - name: Commit tested fix
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git add src/DashboardPanel.java
          git commit -m "Translate Pareto analysis descriptions"
          git push origin HEAD:fix/macos-filechooser-i18n
