name: Repair order invoice guard

on:
  push:
    branches: [fix/macos-filechooser-i18n]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-filechooser-i18n
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y ant
      - name: Repair guard and regression test
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/OrdersPanel.java')
          s=p.read_text(encoding='utf-8')
          d0=s.index('    private void deleteSelectedOrder() {')
          g0=s.index('    private void generateInvoiceFromOrder() {',d0)
          tail=s.index('    private ',g0+10)
          delete=s[d0:g0]
          generate=s[g0:tail]
          wrong='''        if (!"Completed".equals(status)) {
                      JOptionPane.showMessageDialog(this,I18n.tr("Only completed customer orders can be invoiced."),I18n.tr("Generate Invoice"),JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          
          '''
          if wrong not in delete:
              raise SystemExit('Wrong deletion guard not found')
          delete=delete.replace(wrong,'',1)
          status='        String status = (String)tableModel.getValueAt(modelRow, 3);\n'
          if generate.count(status)!=1:
              raise SystemExit('Invoice status anchor not unique')
          guard='''        String status = (String)tableModel.getValueAt(modelRow, 3);
          
                  if (!canGenerateInvoice(status)) {
                      JOptionPane.showMessageDialog(this,
                          I18n.tr("Only completed customer orders can be invoiced."),
                          I18n.tr("Generate Invoice"), JOptionPane.WARNING_MESSAGE);
                      return;
                  }
          '''
          generate=generate.replace(status,guard,1)
          helper='''    static boolean canGenerateInvoice(String status) {
                  return "Completed".equals(status);
              }
          
          '''
          if 'static boolean canGenerateInvoice(' in s:
              raise SystemExit('Eligibility helper already exists')
          s=s[:d0]+delete+helper+generate+s[tail:]
          p.write_text(s,encoding='utf-8')

          tp=Path('tests/OperationalRegressionTest.java')
          t=tp.read_text(encoding='utf-8')
          old='''        test("non-completed orders cannot be invoiced",()->{
                      for(String status:java.util.List.of("New","In Progress","Cancelled")) { fresh();sql("INSERT INTO orders(id,customer_id,order_date,status,total) VALUES(10,1,0,'"+status+"',10)");sql("INSERT INTO order_details(order_id,product_id,quantity,unit_price) VALUES(10,1,1,10)");OrdersPanel p=new OrdersPanel();JTable t=(JTable)get(p,"ordersTable");t.setRowSelectionInterval(0,0);try{call(p,"generateInvoiceFromOrder");}catch(java.awt.HeadlessException expected){}require("0".equals(value("SELECT COUNT(*) FROM invoices")),"Non-completed order was invoiced: "+status); }
                  });
          '''
          new='''        test("only completed customer orders are invoice eligible",()->{
                      require(OrdersPanel.canGenerateInvoice("Completed"),"Completed order cannot be invoiced");
                      for(String status:java.util.List.of("New","In Progress","Cancelled"))
                          require(!OrdersPanel.canGenerateInvoice(status),"Non-completed order is invoice eligible: "+status);
                      require(!OrdersPanel.canGenerateInvoice(null),"Missing status is invoice eligible");
                  });
          '''
          if old not in t:
              raise SystemExit('Old false-positive invoice eligibility test not found')
          tp.write_text(t.replace(old,new,1),encoding='utf-8')
      - name: Run full regression suite
        run: ant test
      - name: Commit tested repair
        run: |
          git config user.name "WareStat audit"
          git config user.email "actions@github.com"
          git rm .github/workflows/repair-order-invoice-guard.yml
          git add src/OrdersPanel.java tests/OperationalRegressionTest.java
          git commit -m "Repair customer order invoice eligibility guard"
          git push origin HEAD:fix/macos-filechooser-i18n
