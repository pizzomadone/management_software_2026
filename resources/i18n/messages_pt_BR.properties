Supplier\:\ the\ supplier\ associated\ with\ this\ product.=Fornecedor: o fornecedor associado a este produto.

Supplier\ product\ code\ (optional)\:\ the\ code\ this\ supplier\ uses\ for\ the\ product\ in\ its\ catalog,\ quotes,\ invoices\ or\ portal.\ Leave\ it\ blank\ if\ the\ supplier\ does\ not\ provide\ one.=Código do produto no fornecedor (opcional): o código usado pelo fornecedor para identificar o produto em seu catálogo, cotações, faturas ou portal. Deixe em branco se o fornecedor não fornecer um código.

Purchase\ price\:\ the\ supplier's\ current\ reference\ purchase\ price.\ It\ is\ proposed\ in\ new\ supplier\ orders\ and\ can\ be\ changed\ in\ the\ order.=Preço de compra: o preço de compra de referência atual deste fornecedor. Ele é proposto em novos pedidos ao fornecedor e pode ser alterado no pedido.

Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ product's\ default\ purchase\ price;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferencial: define este como o fornecedor preferencial do produto. Seu preço de compra passa a ser o preço de compra padrão do produto; os custos FIFO históricos e o preço de venda não são alterados.

Notes\:\ optional\ notes\ about\ this\ product-supplier\ relationship.=Observações: notas opcionais sobre a relação entre o produto e o fornecedor.

