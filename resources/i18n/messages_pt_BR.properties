Completed\ or\ reversed\ sales\ cannot\ be\ modified.\ Use\ the\ reversal\ function\ for\ a\ completed\ sale\ so\ FIFO\ history\ is\ preserved.=Vendas concluídas ou estornadas não podem ser modificadas. Use o estorno para uma venda concluída para preservar o histórico FIFO.
