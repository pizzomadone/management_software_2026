Unit\ cost\ of\ this\ inward\ movement.\ It\ becomes\ the\ cost\ of\ the\ FIFO\ lot\ and\ can\ be\ changed\ before\ saving.=Custo unitário desta entrada. Ele se torna o custo do lote FIFO e pode ser alterado antes de salvar.
