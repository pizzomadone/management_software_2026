Sale\ reversed\ successfully.\ Stock\ and\ FIFO\ layers\ were\ restored\ while\ the\ original\ sale\ was\ kept\ in\ history.=Venda estornada com sucesso. Estoque e lotes FIFO foram restaurados mantendo a venda original no histórico.
