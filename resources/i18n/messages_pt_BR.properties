# Finalized invoice protection
Finalized\ invoice\:\ only\ the\ status\ can\ be\ changed.=Fatura finalizada: somente o status pode ser alterado.
Issued,\ Paid\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ their\ status\ can\ be\ changed.=Faturas emitidas, pagas e canceladas são documentos históricos. Somente o status pode ser alterado.
A\ finalized\ invoice\ cannot\ be\ returned\ to\ Draft.=Uma fatura finalizada não pode voltar ao status Rascunho.

