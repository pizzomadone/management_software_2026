Current\ purchase\ cost\ of\ the\ product.\ It\ is\ required\ for\ stock\ valuation\ and\ future\ FIFO\ movements.\ Historical\ sales\ retain\ their\ original\ FIFO\ cost.=Custo de compra atual do produto. É necessário para avaliar o estoque e para futuros movimentos FIFO. As vendas históricas mantêm seu custo FIFO original.
Purchase\ cost\ is\ required.=O custo de compra é obrigatório.
Purchase\ cost\ must\ be\ greater\ than\ zero.=O custo de compra deve ser maior que zero.
The\ new\ preferred\ supplier's\ price\ ({0})\ will\ become\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders.=O preço do novo fornecedor preferencial ({0}) se tornará o preço de referência padrão proposto em novos pedidos a fornecedores.
