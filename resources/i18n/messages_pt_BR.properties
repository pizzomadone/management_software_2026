tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Soma de estoque positivo x custo de compra.</b><br>Método do custo padrão: usa o custo de compra informado no cadastro de cada produto. Somente produtos ativos; arredonda cada produto para 2 casas decimais antes de somar. As unidades reservadas continuam incluídas. Custos zero contribuem zero; estoque negativo é excluído e sinalizado separadamente.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Soma de estoque positivo x preço de venda do catálogo.</b><br>Somente produtos ativos; arredonda cada produto para 2 casas decimais antes de somar. As unidades reservadas continuam incluídas; estoque negativo é excluído. É o valor potencial de venda do estoque atual, não uma receita já realizada.</div></html>
tooltip.kpi.lowStock=<html><div style='width: 260px'><b>Conta produtos abaixo do estoque mínimo ou com estoque negativo.</b><br>Somente produtos ativos. Conta cada produto uma vez se o estoque estiver abaixo do mínimo (quando o mínimo é maior que zero), ou se o estoque for negativo. Conta produtos, não unidades. As quantidades reservadas não são subtraídas.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Conta produtos com estoque menor ou igual a zero.</b><br>Somente produtos ativos; inclui saldos negativos. Conta produtos, não unidades faltantes. As quantidades reservadas não são subtraídas.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Soma dos totais de pedidos de clientes concluídos, sem IVA.</b><br>Usa a data do pedido no mês atual do calendário, no fuso horário local. Exclui pedidos novos, em andamento e cancelados. Faturas e pagamentos não são somados. Movimentações manuais de estoque não contam como vendas.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Soma das bases tributáveis das faturas, antes do IVA.</b><br>Inclui faturas emitidas e pagas com data no mês atual do calendário, no fuso horário local. Exclui rascunhos e faturas canceladas. Cada fatura conta uma vez, independentemente do pagamento. Pedidos de clientes não são somados.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Conta pedidos de clientes novos ou em andamento.</b><br>Considera todas as datas. Exclui pedidos concluídos e cancelados. Conta pedidos, não quantidades de produtos ou valores monetários.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (valor de venda do estoque - valor ao custo padrão) / valor de venda do estoque.</b><br>Usa os dois valores de estoque exibidos no painel: cada produto é ponderado pelo seu valor de venda. Se o valor de venda for zero, a margem fica indisponível. É uma margem potencial do estoque atual, não o lucro histórico das vendas. Um custo de compra zero pressupõe uma compra gratuita.</div></html>

