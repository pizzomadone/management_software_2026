...\ and\ {0}\ more\ product(s).=... e mais {0} produto(s).
Purchase\ cost\ is\ missing.\ Purchases\ and\ sales\ are\ blocked\ until\ the\ product\ is\ corrected.=O custo de compra está ausente. Compras e vendas ficam bloqueadas até que o produto seja corrigido.
Historical\ cost\ is\ the\ actual\ cost\ of\ the\ products\ sold,\ determined\ from\ the\ FIFO\ lots\ used\ when\ the\ sale\ was\ completed.=O custo histórico é o custo real dos produtos vendidos, determinado pelos lotes FIFO usados quando a venda foi concluída.
Gross\ profit\ \=\ historical\ sales\ revenue\ -\ historical\ FIFO\ purchase\ cost.\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded.=Lucro bruto = receita histórica de vendas - custo histórico de compra FIFO. Vendas sem custo histórico reconstruível são excluídas.
*\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Vendas sem custo histórico reconstruível são excluídas dos cálculos de custo histórico e lucro bruto.
In-stock\ products\ with\ missing\ purchase\ cost=Produtos em estoque sem custo de compra
*\ Some\ in-stock\ products\ have\ no\ purchase\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Alguns produtos em estoque não têm custo de compra; o valor do estoque a custo e a margem potencial estão incompletos.
*\ Some\ imported\ sales\ have\ no\ reconstructable\ historical\ cost\ and\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Algumas vendas importadas não têm custo histórico reconstruível e são excluídas dos cálculos de custo histórico e lucro bruto.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ their\ current\ purchase\ cost.\ Reserved\ units\ remain\ included.=Somente produtos ativos com estoque físico positivo são avaliados pelo custo de compra atual. Unidades reservadas permanecem incluídas.
Preferred\ supplier\ changed\ automatically\ to\ {0},\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price\ ({1}).=O fornecedor preferencial foi alterado automaticamente para {0}, o fornecedor restante com o menor preço de compra ({1}).
