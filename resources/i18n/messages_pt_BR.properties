The\ original\ sale\ will\ remain\ in\ history\ as\ reversed.\ Stock\ will\ be\ returned\ to\ the\ exact\ FIFO\ lots\ originally\ used.=A venda original permanecerá no histórico como estornada. O estoque será devolvido exatamente aos lotes FIFO usados originalmente.
