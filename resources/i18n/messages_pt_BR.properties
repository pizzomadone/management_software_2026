A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.=Um produto pode ter vários fornecedores, mas apenas um fornecedor preferencial.
The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.=O preço de compra mostrado aqui é o preço de referência atual do fornecedor. Ele é proposto automaticamente em novos pedidos a fornecedores e ainda pode ser alterado no pedido, por exemplo para descontos ou preços negociados.
When\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.=Ao definir outro fornecedor como preferencial, o preço de compra desse fornecedor passa a ser o preço de compra padrão proposto para este produto. O preço de venda do produto e os custos FIFO históricos não são alterados.
Double-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Clique duas vezes em uma linha para editar a relação com o fornecedor.
Search\ products\ by\ code,\ name\ or\ description.=Pesquisar produtos por código, nome ou descrição.
Create\ a\ new\ product.=Criar um novo produto.
Open\ the\ selected\ product\ details.=Abrir os detalhes do produto selecionado.
Edit\ the\ selected\ product.=Editar o produto selecionado.
View\ FIFO\ lots\ for\ the\ selected\ product.=Ver os lotes FIFO do produto selecionado.
Delete\ the\ selected\ product.=Excluir o produto selecionado.
Reload\ the\ product\ list.=Recarregar a lista de produtos.
Each\ stock\ entry\ creates\ a\ FIFO\ lot\ with\ its\ own\ quantity\ and\ unit\ cost.=Cada entrada de estoque cria um lote FIFO com sua própria quantidade e custo unitário.
When\ stock\ leaves\ the\ warehouse,\ WareStat\ consumes\ the\ oldest\ available\ lot\ first.=Quando o estoque sai do armazém, o WareStat consome primeiro o lote disponível mais antigo.
Initial\ Qty\ is\ the\ quantity\ received;\ Remaining\ Qty\ is\ what\ is\ still\ available\ in\ that\ lot.=Quantidade inicial é a quantidade recebida; Quantidade restante é o que ainda está disponível nesse lote.
Example\:=Exemplo:
5\ units\ at\ cost\ 5.00,\ then\ 5\ units\ at\ cost\ 10.00.\ If\ 7\ units\ are\ sold,\ FIFO\ uses\ all\ 5\ units\ from\ the\ first\ lot\ and\ 2\ from\ the\ second\:\ historical\ cost\ \=\ 45.00.\ The\ second\ lot\ keeps\ 3\ units\ at\ cost\ 10.00.=5 unidades ao custo de 5,00 e depois 5 unidades ao custo de 10,00. Se 7 forem vendidas, o FIFO usa primeiro as 5 do primeiro lote e depois 2 do segundo: custo histórico = 45,00. No segundo lote restam 3 unidades ao custo de 10,00.
FIFO\ Lots\ Help=Ajuda sobre lotes FIFO
New\ preferred\ supplier\:\ {0}.=Novo fornecedor preferencial: {0}.
The\ default\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ supplier's\ price\ ({0}).=O preço de compra padrão será alinhado ao preço do novo fornecedor ({0}).
Confirm?=Confirmar?
Current\ purchase\ price\ from\ the\ preferred\ supplier.\ It\ is\ used\ as\ the\ default\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order.=Preço de compra atual do fornecedor preferencial. Ele é usado como valor padrão em novos pedidos a fornecedores e ainda pode ser alterado no pedido.
The\ product\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ preferred\ supplier's\ price\ ({0}).=O preço de compra do produto será alinhado ao preço do novo fornecedor preferencial ({0}).
Quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=A quantidade deve ser um número inteiro entre 0 e 999999.
Minimum\ quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=A quantidade mínima deve ser um número inteiro entre 0 e 999999.

