Products\ without\ purchase\ cost\ are\ highlighted\ in\ orange\ and\ cannot\ be\ purchased\ or\ sold\ until\ the\ cost\ is\ entered\ in\ the\ product\ sheet.=Produtos sem custo de compra são destacados em laranja e não podem ser comprados nem vendidos até que o custo seja informado na ficha do produto.
Sales\ without\ reconstructable\ historical\ cost\ remain\ visible\ but\ are\ excluded\ from\ historical\ cost,\ gross\ profit\ and\ other\ calculations\ that\ require\ that\ cost.=Vendas sem custo histórico reconstruível continuam visíveis, mas são excluídas do custo histórico, lucro bruto e outros cálculos que exigem esse custo.
