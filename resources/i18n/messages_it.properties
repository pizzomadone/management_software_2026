Margin\ unavailable\:\ enter\ a\ purchase\ cost.=Margine non disponibile: inserisci il costo.
Margin\ unavailable\:\ purchase\ cost\ missing.=Margine non disponibile: costo mancante.
Margin\ unavailable\:\ net\ sale\ price\ is\ zero.=Margine non disponibile: prezzo netto zero.
Estimated\ margin\ \=\ (net\ sale\ price\ -\ purchase\ cost)\ /\ net\ sale\ price.\ Other\ expenses\ are\ excluded.=Margine stimato = (prezzo di vendita netto - costo di acquisto) / prezzo di vendita netto. Altre spese escluse.
Estimate\ based\ on\ the\ last\ actual\ purchase\ cost.\ Margin\ \=\ (net\ sale\ price\ -\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Stima basata sull’ultimo costo di acquisto effettivo. Margine = (prezzo netto - costo) / prezzo netto. L’utile effettivo della vendita usa il FIFO; altre spese escluse.

Stock\ at\ preferred\ supplier\ cost=Magazzino: costo fornitore preferito
In-stock\ products\ with\ missing\ preferred\ supplier\ cost=Prodotti in giacenza senza costo del fornitore preferito
*\ Some\ in-stock\ products\ have\ no\ preferred\ supplier\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Alcuni prodotti in giacenza non hanno il costo del fornitore preferito; il valore del magazzino al costo e il margine potenziale sono incompleti.
Estimated\ Margin=Margine stimato
Estimated\ margin\ \=\ (net\ sale\ price\ -\ preferred\ supplier\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Margine stimato = (prezzo di vendita netto - costo del fornitore preferito) / prezzo di vendita netto. L'utile effettivo delle vendite usa il FIFO; gli altri costi sono esclusi.
Margin\ unavailable\:\ preferred\ supplier\ cost\ missing.=Margine non disponibile: costo del fornitore preferito mancante.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ the\ current\ preferred\ supplier\ cost.\ Reserved\ units\ remain\ included.=Solo i prodotti attivi con giacenza fisica positiva sono valorizzati al costo corrente del fornitore preferito. Le unità riservate restano incluse.

Positive\ physical\ stock\ is\ valued\ at\ the\ current\ preferred\ supplier\ cost,\ including\ inactive\ products\ that\ still\ remain\ in\ stock.\ Reserved\ units\ remain\ included.=La giacenza fisica positiva è valorizzata al costo corrente del fornitore preferito, inclusi i prodotti inattivi che sono ancora presenti in magazzino. Le unità riservate restano incluse.

Insufficient\ stock\ for\ the\ following\ products\:=Disponibilità insufficiente per i seguenti prodotti:
The\ order\ cannot\ reserve\ more\ units\ than\ are\ currently\ available.\ Reduce\ the\ quantities\ or\ replenish\ stock.=L'ordine non può riservare più unità di quelle attualmente disponibili. Riduci le quantità oppure rifornisci il magazzino.

Reservation\ does\ not\ affect\ stock.\ In\ Progress\ reserves\ available\ stock.\ Completed\ decreases\ physical\ stock\ and\ applies\ FIFO.=Prenotazione non modifica il magazzino. In lavorazione riserva la disponibilità. Completato riduce la giacenza fisica e applica il FIFO.

Reservation=Prenotazione
tooltip.order.statusFlow=<html><b>Prenotazione</b>: solo commerciale; nessun effetto su magazzino o FIFO.<br><b>Nuovo</b>: riserva tutte le unità richieste.<br><b>In lavorazione</b>: mantiene la riserva.<br><b>Completato</b>: registra la data di completamento, scarica la giacenza fisica e consuma il FIFO.<br><b>Annullato</b>: libera l'eventuale riserva.</html>
With\ insufficient\ available\ stock,\ the\ order\ can\ only\ be\ saved\ as\ Reservation.\ Reservation\ does\ not\ change\ stock,\ reserved\ quantities,\ lots\ or\ FIFO.=Con disponibilità insufficiente l'ordine può essere salvato solo come Prenotazione. Prenotazione non modifica magazzino, quantità riservate, lotti o FIFO.

