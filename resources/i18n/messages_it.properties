A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.\\n\\nThe\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.\\n\\nWhen\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.\\n\\nDouble-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Un prodotto può avere più fornitori, ma un solo fornitore preferito.\n\nIl prezzo di acquisto mostrato qui è il prezzo di riferimento attuale del fornitore. Viene proposto automaticamente nei nuovi ordini fornitore e può comunque essere modificato nell'ordine, ad esempio per sconti o prezzi negoziati.\n\nQuando imposti un fornitore preferito diverso, il suo prezzo di acquisto diventa il prezzo di acquisto predefinito proposto per questo prodotto. Il prezzo di vendita del prodotto e i costi FIFO storici non vengono modificati.\n\nFai doppio clic su una riga per modificare il rapporto con il fornitore.
Set\ {0}\ as\ the\ preferred\ supplier?=Impostare {0} come fornitore preferito?
Its\ current\ purchase\ price\ ({0})\ will\ become\ the\ default\ purchase\ price\ proposed\ for\ this\ product\ in\ new\ supplier\ orders.=Il suo prezzo di acquisto attuale ({0}) diventerà il prezzo di acquisto predefinito proposto per questo prodotto nei nuovi ordini fornitore.
The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ will\ not\ be\ changed.=Il prezzo di vendita del prodotto e i costi FIFO storici non verranno modificati.
A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.=Un prodotto può avere più fornitori, ma un solo fornitore preferito.
The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.=Il prezzo di acquisto mostrato qui è il prezzo di riferimento attuale del fornitore. Viene proposto automaticamente nei nuovi ordini fornitore e può comunque essere modificato nell'ordine, ad esempio per sconti o prezzi negoziati.
When\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.=Quando imposti un fornitore preferito diverso, il suo prezzo di acquisto diventa il prezzo di acquisto predefinito proposto per questo prodotto. Il prezzo di vendita del prodotto e i costi FIFO storici non vengono modificati.
Double-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Fai doppio clic su una riga per modificare il rapporto con il fornitore.
Search\ products\ by\ code,\ name\ or\ description.=Cerca prodotti per codice, nome o descrizione.
Create\ a\ new\ product.=Crea un nuovo prodotto.
Open\ the\ selected\ product\ details.=Apri i dettagli del prodotto selezionato.
Edit\ the\ selected\ product.=Modifica il prodotto selezionato.
View\ FIFO\ lots\ for\ the\ selected\ product.=Visualizza i lotti FIFO del prodotto selezionato.
Delete\ the\ selected\ product.=Elimina il prodotto selezionato.
Reload\ the\ product\ list.=Ricarica l'elenco dei prodotti.
Each\ stock\ entry\ creates\ a\ FIFO\ lot\ with\ its\ own\ quantity\ and\ unit\ cost.=Ogni entrata crea un lotto FIFO con quantità e costo unitario.
When\ stock\ leaves\ the\ warehouse,\ WareStat\ consumes\ the\ oldest\ available\ lot\ first.=Le uscite consumano prima il lotto disponibile più vecchio.
Initial\ Qty\ is\ the\ quantity\ received;\ Remaining\ Qty\ is\ what\ is\ still\ available\ in\ that\ lot.=Qtà iniziale = quantità ricevuta; Qtà residua = quantità ancora disponibile.
Example\:=Esempio:
5\ units\ at\ cost\ 5.00,\ then\ 5\ units\ at\ cost\ 10.00.\ If\ 7\ units\ are\ sold,\ FIFO\ uses\ all\ 5\ units\ from\ the\ first\ lot\ and\ 2\ from\ the\ second\:\ historical\ cost\ \=\ 45.00.\ The\ second\ lot\ keeps\ 3\ units\ at\ cost\ 10.00.=Acquisti 5 a 5,00 e 5 a 10,00; vendi 7 → costo FIFO 45,00, restano 3 unità a 10,00.
FIFO\ Lots\ Help=Lotti FIFO
New\ preferred\ supplier\:\ {0}.=Nuovo fornitore preferito: {0}.
The\ default\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ supplier's\ price\ ({0}).=Il prezzo di acquisto predefinito verrà allineato al prezzo del nuovo fornitore ({0}).
Confirm?=Confermare?
Current\ purchase\ price\ from\ the\ preferred\ supplier.\ It\ is\ used\ as\ the\ default\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order.=Prezzo di acquisto corrente del fornitore preferito. Viene usato come valore predefinito nei nuovi ordini fornitore e può comunque essere modificato nell'ordine.
The\ product\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ preferred\ supplier's\ price\ ({0}).=Il prezzo di acquisto del prodotto verrà allineato al prezzo del nuovo fornitore preferito ({0}).
Quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La quantità deve essere un numero intero compreso tra 0 e 999999.
Minimum\ quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La quantità minima deve essere un numero intero compreso tra 0 e 999999.

Supplier\ Product\ Code=Codice prodotto del fornitore

