Purchase\ Cost\ Required=Costo di acquisto obbligatorio
Inbound\ unit\ cost\ is\ required.=Il costo unitario dell'entrata è obbligatorio.
Inbound\ unit\ cost\ must\ be\ a\ valid\ non-negative\ number.=Il costo unitario dell'entrata deve essere un numero valido non negativo.
Insufficient\ quantity.\ Current\ availability\:\ {0}=Quantità insufficiente. Disponibilità attuale: {0}
Requested\:\ {0}=Richiesti: {0}
Error\ saving\ movement=Errore durante il salvataggio del movimento
Operation\ not\ available\:\ one\ or\ more\ products\ have\ no\ purchase\ cost.=Operazione non disponibile: uno o più prodotti non hanno un costo di acquisto.
Enter\ the\ purchase\ cost\ in\ the\ product\ sheet\ before\ making\ purchases\ or\ sales.=Inserisci il costo di acquisto nella scheda prodotto prima di effettuare acquisti o vendite.
...\ and\ {0}\ more\ product(s).=... e altri {0} prodotti.
Purchase\ cost\ is\ missing.\ Purchases\ and\ sales\ are\ blocked\ until\ the\ product\ is\ corrected.=Il costo di acquisto è mancante. Acquisti e vendite sono bloccati finché il prodotto non viene corretto.
Historical\ cost\ is\ the\ actual\ cost\ of\ the\ products\ sold,\ determined\ from\ the\ FIFO\ lots\ used\ when\ the\ sale\ was\ completed.=Costo storico = costo FIFO registrato al completamento della vendita.
Gross\ profit\ \=\ historical\ sales\ revenue\ -\ historical\ FIFO\ purchase\ cost.\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded.=Utile lordo = vendite nette - costo FIFO storico. Le vendite con costo storico sconosciuto sono escluse.
*\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Le vendite senza costo storico ricostruibile sono escluse dai calcoli del costo storico e dell'utile lordo.
In-stock\ products\ with\ missing\ purchase\ cost=Prodotti in giacenza senza costo di acquisto
*\ Some\ in-stock\ products\ have\ no\ purchase\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Alcuni prodotti in giacenza non hanno un costo di acquisto; il valore del magazzino al costo e il margine potenziale sono incompleti.
*\ Some\ imported\ sales\ have\ no\ reconstructable\ historical\ cost\ and\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Alcune vendite importate non hanno un costo storico ricostruibile e sono escluse dai calcoli del costo storico e dell'utile lordo.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ their\ current\ purchase\ cost.\ Reserved\ units\ remain\ included.=Sono valorizzati solo i prodotti attivi con giacenza fisica positiva, usando il loro costo di acquisto corrente. Le unità prenotate restano incluse.
Preferred\ supplier\ changed\ automatically\ to\ {0},\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price\ ({1}).=Fornitore preferito cambiato automaticamente in {0}, il fornitore rimanente con il prezzo di acquisto più basso ({1}).
Preferred\ Supplier\ Changed=Fornitore preferito cambiato
Preferred\ supplier\ changed\ automatically\ to\ the\ lowest-cost\ remaining\ supplier\ for\:=Fornitore preferito cambiato automaticamente con quello rimanente dal costo più basso per:
Supplier\ '{0}'\ and\ all\ related\ records\ deleted\ successfully.=Il fornitore '{0}' e tutti i relativi dati sono stati eliminati correttamente.
{0}\ product(s)\ now\ have\ no\ preferred\ supplier\ because\ no\ alternative\ supplier\ remained.={0} prodotti ora non hanno un fornitore preferito perché non erano disponibili fornitori alternativi.
Supplier\ Deleted=Fornitore eliminato
Completed\ or\ reversed\ sales\ cannot\ be\ modified.\ Use\ the\ reversal\ function\ for\ a\ completed\ sale\ so\ FIFO\ history\ is\ preserved.=Le vendite completate o stornate non possono essere modificate. Per una vendita completata usa lo storno, così lo storico FIFO viene preservato.
Historical\ Sale=Vendita storica
This\ sale\ has\ already\ been\ reversed\ and\ is\ kept\ as\ historical\ data.=Questa vendita è già stata stornata e viene conservata come dato storico.
Reverse\ the\ completed\ sale\ for\ customer\ '{0}'?=Stornare la vendita completata del cliente '{0}'?
The\ original\ sale\ will\ remain\ in\ history\ as\ reversed.\ Stock\ will\ be\ returned\ to\ the\ exact\ FIFO\ lots\ originally\ used.=La vendita originale rimarrà nello storico come stornata. Le quantità saranno restituite esattamente ai lotti FIFO utilizzati in origine.
Reverse\ Completed\ Sale=Storna vendita completata
Sale\ reversed\ successfully.\ Stock\ and\ FIFO\ layers\ were\ restored\ while\ the\ original\ sale\ was\ kept\ in\ history.=Vendita stornata correttamente. Giacenze e lotti FIFO sono stati ripristinati mantenendo la vendita originale nello storico.
Sale\ Reversed=Vendita stornata
Unable\ to\ reverse\ the\ completed\ sale=Impossibile stornare la vendita completata
Reversed=Stornata
Import\ completed\:\ {0}\ product(s)\ without\ purchase\ cost,\ {1}\ sale(s)\ with\ historical\ cost\ that\ cannot\ be\ reconstructed.=Importazione completata: {0} prodotti senza costo di acquisto, {1} vendite con costo storico non ricostruibile.
Products\ without\ purchase\ cost\ are\ highlighted\ in\ orange\ and\ cannot\ be\ purchased\ or\ sold\ until\ the\ cost\ is\ entered\ in\ the\ product\ sheet.=I prodotti senza costo di acquisto sono evidenziati in arancione e non possono essere acquistati o venduti finché il costo non viene inserito nella scheda prodotto.
Sales\ without\ reconstructable\ historical\ cost\ remain\ visible\ but\ are\ excluded\ from\ historical\ cost,\ gross\ profit\ and\ other\ calculations\ that\ require\ that\ cost.=Le vendite senza costo storico ricostruibile restano visibili ma sono escluse dal costo storico, dall'utile lordo e dagli altri calcoli che richiedono tale costo.
SALE_REVERSAL=STORNO VENDITA
ORDER_REVERSAL=STORNO ORDINE
This\ completed\ sale\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Questa vendita completata ha uno storico FIFO incompleto e non può essere stornata in sicurezza
This\ outward\ movement\ cannot\ be\ changed\ because\ later\ FIFO\ movements\ exist\ for\ the\ same\ product=Questo movimento in uscita non può essere modificato perché esistono movimenti FIFO successivi per lo stesso prodotto
This\ completed\ sale\ has\ already\ been\ reversed=Questa vendita completata è già stata stornata
Only\ completed\ customer\ orders\ can\ be\ reversed=Possono essere stornati solo gli ordini cliente completati
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferito: imposta questo come fornitore preferito del prodotto. Il suo prezzo di acquisto diventa il prezzo di riferimento predefinito proposto nei nuovi ordini fornitore; i costi FIFO storici e il prezzo di vendita non cambiano.
Supplier\ '{0}'\ has\ related\ business\ records\:=Il fornitore '{0}' ha dati gestionali collegati:
Existing\ orders=Ordini esistenti
{0}\ supplied\ product(s)\ will\ be\ disassociated={0} prodotti forniti verranno disassociati
For\ {0}\ product(s),\ this\ is\ the\ preferred\ supplier.\ WareStat\ will\ automatically\ choose\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price;\ if\ no\ alternative\ exists,\ the\ product\ will\ remain\ without\ a\ preferred\ supplier.=Per {0} prodotti questo è il fornitore preferito. WareStat sceglierà automaticamente, tra quelli rimasti, il fornitore con il prezzo di acquisto più basso; se non esistono alternative, il prodotto resterà senza fornitore preferito.
Choose\ what\ should\ happen\:=Scegli cosa fare:
Keep\:\ nothing\ is\ deleted;\ supplier,\ orders,\ stock\ and\ references\ remain\ unchanged.=Mantieni: non viene eliminato nulla; fornitore, ordini, magazzino e riferimenti restano invariati.
Delete\ all\:\ supplier\ orders\ and\ product\ associations\ are\ permanently\ deleted;\ stock\ received\ from\ completed\ orders\ is\ reversed\ and\ related\ movements\ are\ deleted.=Elimina tutto: ordini fornitore e associazioni prodotto vengono eliminati definitivamente; il magazzino ricevuto dagli ordini completati viene ripristinato e i relativi movimenti vengono eliminati.
All\ orders\ from\ this\ supplier=Tutti gli ordini di questo fornitore
All\ supplied-product\ associations=Tutte le associazioni prodotto-fornitore
Preferred-supplier\ references\ linked\ to\ those\ products=I riferimenti al fornitore preferito collegati a questi prodotti
All\ related\ warehouse\ movements=Tutti i movimenti di magazzino collegati
If\ preferred\ suppliers\ change,\ the\ lowest-cost\ remaining\ supplier\ will\ be\ selected\ automatically.=Se cambia un fornitore preferito, verrà scelto automaticamente quello con il costo più basso tra i fornitori rimasti.
This\ action\ CANNOT\ be\ undone!=Questa operazione NON può essere annullata!
This\ supplier\ receipt\ cannot\ be\ reversed\ because\ its\ FIFO\ lot\ has\ historical\ consumption\ records=Questa ricezione da fornitore non può essere annullata perché il relativo lotto FIFO ha già uno storico di consumi
This\ outward\ movement\ has\ no\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Questo movimento in uscita non ha uno storico FIFO e non può essere annullato in sicurezza
This\ supplier\ receipt\ has\ no\ FIFO\ lot\ history\ and\ cannot\ be\ reversed\ safely=Questa ricezione da fornitore non ha uno storico dei lotti FIFO e non può essere annullata in sicurezza
Completed\ or\ reversed\ customer\ sales\ cannot\ be\ deleted.\ Reverse\ completed\ sales\ instead.=Le vendite cliente completate o stornate non possono essere eliminate. Le vendite completate devono essere stornate.
Reverse\ Sale=Storna vendita
Reverse\ the\ completed\ sale\ while\ preserving\ FIFO\ history.=Storna la vendita completata mantenendo lo storico FIFO.
Historical\ cost\ unavailable=Costo storico non disponibile
Reverse\ Movement=Storna movimento
