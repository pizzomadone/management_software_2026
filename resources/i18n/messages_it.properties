A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.\\n\\nThe\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.\\n\\nWhen\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.\\n\\nDouble-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Un prodotto può avere più fornitori, ma un solo fornitore preferito.\n\nIl prezzo di acquisto mostrato qui è il prezzo di riferimento attuale del fornitore. Viene proposto automaticamente nei nuovi ordini fornitore e può comunque essere modificato nell'ordine, ad esempio per sconti o prezzi negoziati.\n\nQuando imposti un fornitore preferito diverso, il suo prezzo di acquisto diventa il prezzo di acquisto predefinito proposto per questo prodotto. Il prezzo di vendita del prodotto e i costi FIFO storici non vengono modificati.\n\nFai doppio clic su una riga per modificare il rapporto con il fornitore.
