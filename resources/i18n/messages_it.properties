This\ sale\ has\ been\ reversed\ and\ is\ kept\ as\ historical\ data;\ the\ order\ cannot\ be\ modified.=Questa vendita è stata stornata e viene conservata come dato storico; l'ordine non è modificabile.
This\ order\ cannot\ be\ modified\ because\ it\ has\ a\ linked\ invoice.\ Payment\ can\ still\ be\ updated.\ To\ reverse\ the\ sale,\ delete\ a\ draft\ invoice\ or\ cancel\ an\ issued\ invoice\ first,\ then\ use\ Reverse\ Sale.=Questo ordine non è modificabile perché ha una fattura associata. Il pagamento può comunque essere aggiornato. Per stornare la vendita, elimina prima una fattura in bozza oppure annulla quella emessa, quindi usa Storna vendita.
This\ completed\ order\ is\ locked\ to\ protect\ stock\ and\ FIFO\ history.\ Payment\ can\ be\ updated,\ or\ it\ can\ be\ returned\ to\ In\ Progress\ if\ completion\ was\ a\ mistake.=Questo ordine completato è bloccato per proteggere magazzino e storico FIFO. Puoi aggiornare il pagamento oppure riportarlo a In lavorazione se il completamento è avvenuto per errore.
Reversed\ order\:\ it\ cannot\ be\ modified.=Ordine stornato: non modificabile.
Order\ locked\:\ linked\ invoice.\ Only\ payment\ can\ be\ changed.\ To\ reverse\ the\ sale,\ remove\ or\ cancel\ the\ invoice\ first.=Ordine bloccato: fattura associata. Modificabile solo il pagamento. Per stornare, rimuovi o annulla prima la fattura.
Completed\ order\:\ only\ payment\ can\ be\ changed,\ or\ the\ order\ can\ be\ returned\ to\ In\ Progress.=Ordine completato: puoi modificare solo il pagamento o riportarlo a In lavorazione.
Order\ locked\:\ linked\ invoice.\ Only\ payment\ can\ be\ changed.\ To\ reverse\ the\ sale,\ delete\ the\ invoice\ if\ it\ is\ a\ draft,\ or\ cancel\ it\ if\ it\ has\ been\ issued.=Ordine bloccato: fattura associata. Modificabile solo il pagamento. Per stornare, elimina la fattura se è in bozza oppure annullala se è stata emessa.
