Each\ stock\ entry\ creates\ a\ FIFO\ lot\ with\ its\ own\ quantity\ and\ unit\ cost.=Ogni entrata di magazzino crea un lotto FIFO con quantità e costo unitario propri.
When\ stock\ leaves\ the\ warehouse,\ WareStat\ consumes\ the\ oldest\ available\ lot\ first.=Quando la merce esce dal magazzino, WareStat scarica prima il lotto disponibile più vecchio.
Initial\ Qty\ is\ the\ quantity\ received;\ Remaining\ Qty\ is\ what\ is\ still\ available\ in\ that\ lot.=Quantità iniziale è la quantità ricevuta; Quantità residua è ciò che resta disponibile nel lotto.
Example\:=Esempio:
5\ units\ at\ cost\ 5.00,\ then\ 5\ units\ at\ cost\ 10.00.\ If\ 7\ units\ are\ sold,\ FIFO\ uses\ all\ 5\ units\ from\ the\ first\ lot\ and\ 2\ from\ the\ second\:\ historical\ cost\ \=\ 45.00.\ The\ second\ lot\ keeps\ 3\ units\ at\ cost\ 10.00.=5 unità a costo 5,00, poi 5 unità a costo 10,00. Se ne vendi 7, il FIFO usa prima tutte le 5 unità del primo lotto e poi 2 del secondo: costo storico = 45,00. Nel secondo lotto restano 3 unità a costo 10,00.
