# Clear currency-change explanations
Currency\ change\:\ {OLD}\ →\ {NEW}=Cambio valuta: {OLD} → {NEW}
Change\ currency\ only\:\ numbers\ stay\ the\ same.=Cambia solo valuta: i valori numerici restano invariati.
Convert\ values\:\ monetary\ values\ are\ recalculated\ using\ a\ rate\ you\ enter.=Converti valori: i valori monetari vengono ricalcolati usando un tasso inserito dall'utente.
Currency\ changed\ successfully.=Valuta modificata correttamente.
No\ amounts\ were\ converted.=Nessun importo è stato convertito.
Operational\ values\ were\ converted\ using\ the\ selected\ exchange\ rate.=I valori operativi sono stati convertiti usando il tasso di cambio selezionato.

# Finalized invoice protection
Finalized\ invoice\:\ only\ the\ status\ can\ be\ changed.=Fattura definitiva: è possibile modificare solo lo stato.
Issued,\ Paid\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ their\ status\ can\ be\ changed.=Le fatture emesse, pagate e annullate sono documenti storici. È possibile modificarne solo lo stato.
A\ finalized\ invoice\ cannot\ be\ returned\ to\ Draft.=Una fattura definitiva non può tornare allo stato Bozza.

