tooltip.kpi.warehouseValue=<html><table width='300'><tr><td><b>Formula: somma, per prodotto, di max(giacenza fisica, 0) × costo unitario attuale del fornitore preferito, con arrotondamento per prodotto.</b><br>Include prodotti attivi e inattivi e unità prenotate; esclude giacenze negative. Non usa i costi FIFO storici. Costi assenti o nulli valgono zero e il totale viene segnalato con *.</td></tr></table></html>
tooltip.kpi.warehouseSaleValue=<html><table width='300'><tr><td><b>Formula: somma, per prodotto, di max(giacenza fisica, 0) × prezzo unitario attuale di vendita IVA esclusa, arrotondato per prodotto.</b><br>Include prodotti attivi e inattivi e unità prenotate; esclude giacenze negative. È un valore di vendita potenziale, non un ricavo realizzato.</td></tr></table></html>
tooltip.kpi.zeroStock=<html><table width='300'><tr><td><b>Conta i prodotti attivi con disponibilità ≤ 0.</b><br>Disponibilità = giacenza fisica − unità prenotate. Include scorte fisiche nulle/negative e prodotti interamente prenotati; non richiede una scorta minima configurata.</td></tr></table></html>
tooltip.kpi.monthRevenue=<html><table width='300'><tr><td><b>Somma degli importi IVA esclusa degli ordini cliente Completati nel mese solare corrente (ora locale).</b><br>Conta la data di completamento; solo se manca, per i dati storici, usa la data dell'ordine. Esclude ordini non completati e vendite stornate. Fatture e pagamenti non modificano il totale.</td></tr></table></html>
tooltip.kpi.monthInvoiced=<html><table width='300'><tr><td><b>Somma degli imponibili IVA esclusa delle fatture Emesse con data nel mese solare corrente (ora locale).</b><br>Esclude bozze e fatture annullate; non dipende dai pagamenti. Se ci sono valute diverse, le mostra separatamente senza convertirle. Non sommare alle vendite completate: la stessa vendita può figurare in entrambi.</td></tr></table></html>
tooltip.kpi.pendingOrders=<html><table width='300'><tr><td><b>Conta gli ordini cliente in stato Prenotazione, Nuovo o In lavorazione.</b><br>Considera tutte le date; esclude ordini Completati, Annullati o Stornati. È il numero di ordini, non di pezzi o importi da incassare.</td></tr></table></html>
tooltip.kpi.avgMargin=<html><table width='300'><tr><td><b>Formula: 100 × (valore netto di vendita del magazzino − valore al costo del fornitore preferito) ÷ valore netto di vendita.</b><br>È calcolato sui valori totali (ponderato, non media dei margini dei prodotti), con una cifra decimale. Se il valore di vendita è zero compare —. È potenziale, non utile realizzato; * indica costi mancanti.</td></tr></table></html>

