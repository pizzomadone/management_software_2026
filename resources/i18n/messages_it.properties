tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Somma di giacenza positiva x costo di acquisto.</b><br>Metodo del costo standard: usa il costo di acquisto inserito nella scheda prodotto. Solo prodotti attivi; ogni prodotto viene arrotondato a 2 decimali prima della somma. Le unità prenotate restano incluse. I costi zero contribuiscono zero; le giacenze negative sono escluse e segnalate separatamente.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Somma di giacenza positiva x prezzo di vendita a catalogo.</b><br>Solo prodotti attivi; ogni prodotto viene arrotondato a 2 decimali prima della somma. Le unità prenotate restano incluse; le giacenze negative sono escluse. È il valore potenziale di vendita della merce presente, non un ricavo già realizzato.</div></html>
tooltip.kpi.lowStock=<html><div style='width: 260px'><b>Conta i prodotti sotto scorta minima o con giacenza negativa.</b><br>Solo prodotti attivi. Conta ogni prodotto una volta se la giacenza è inferiore alla scorta minima (quando questa è maggiore di zero), oppure se la giacenza è negativa. Conta prodotti, non pezzi. Le quantità prenotate non vengono sottratte.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Conta i prodotti con giacenza minore o uguale a zero.</b><br>Solo prodotti attivi; sono incluse le giacenze negative. Conta prodotti, non pezzi mancanti. Le quantità prenotate non vengono sottratte.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Somma dei totali degli ordini cliente completati, IVA esclusa.</b><br>Usa la data ordine nel mese di calendario corrente, secondo il fuso locale. Esclude ordini nuovi, in lavorazione e annullati. Fatture e pagamenti non vengono aggiunti. I movimenti manuali di magazzino non sono vendite.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Somma degli imponibili delle fatture, prima dell’IVA.</b><br>Include fatture emesse e pagate con data nel mese di calendario corrente, secondo il fuso locale. Esclude bozze e fatture annullate. Ogni fattura conta una volta, indipendentemente dal pagamento. Gli ordini cliente non vengono aggiunti.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Conta gli ordini cliente nuovi o in lavorazione.</b><br>Considera tutte le date. Esclude gli ordini completati e annullati. Conta ordini, non quantità di prodotti o importi.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (valore di vendita del magazzino - valore al costo standard) / valore di vendita.</b><br>Usa i due valori di magazzino mostrati nella dashboard: ogni prodotto pesa in proporzione al proprio valore di vendita. Con valore di vendita zero, il margine non è disponibile. È un margine potenziale sulla merce presente, non l’utile storico delle vendite. Un costo di acquisto zero presuppone un acquisto gratuito.</div></html>

