# Supplier receipt validation
Purchase\ price\ must\ be\ greater\ than\ zero=Il prezzo di acquisto deve essere maggiore di zero
Supplier\ receipt\ date\ is\ required=La data di ricezione dell'ordine fornitore è obbligatoria
Every\ product\ must\ have\ a\ supplier,\ a\ positive\ quantity\ and\ a\ purchase\ price\ greater\ than\ zero.\ Check\:\ {0}=Ogni prodotto deve avere un fornitore, una quantità positiva e un prezzo di acquisto maggiore di zero. Controlla: {0}
Preferred\ Supplier\ Cost=Costo fornitore preferito
Click\ to\ edit\ the\ preferred\ supplier\ cost.=Clicca per modificare il costo del fornitore preferito.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.\ Click\ the\ value\ to\ edit\ it.=Il costo del fornitore preferito è il costo di acquisto corrente salvato per il fornitore preferito. Clicca sul valore per modificarlo.
When\ a\ supplier\ order\ is\ received,\ its\ actual\ unit\ purchase\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ that\ supplier's\ current\ cost.=Quando un ordine fornitore viene ricevuto, il suo prezzo unitario di acquisto effettivo diventa il costo del lotto FIFO e aggiorna il costo corrente di quel fornitore.
Last\ purchase\ cost\ is\ the\ unit\ cost\ of\ the\ most\ recently\ received\ supplier\ purchase.\ It\ is\ updated\ automatically\ and\ cannot\ be\ edited\ here.=L'ultimo costo di acquisto è il costo unitario dell'acquisto fornitore ricevuto più recentemente. Si aggiorna automaticamente e non può essere modificato qui.
Historical\ FIFO\ lots\ and\ completed\ sales\ keep\ the\ costs\ recorded\ when\ they\ were\ created.=I lotti FIFO storici e le vendite completate mantengono i costi registrati quando sono stati creati.
Purchase\ Cost\ Help=Guida costi di acquisto
Purchase\ price\:\ the\ supplier's\ current\ purchase\ cost\ for\ this\ product.\ It\ is\ proposed\ in\ new\ supplier\ orders.=Prezzo di acquisto: il costo di acquisto corrente di questo prodotto presso il fornitore. Viene proposto nei nuovi ordini fornitore.
If\ the\ actual\ unit\ price\ is\ changed\ in\ a\ supplier\ order,\ the\ price\ used\ when\ the\ order\ is\ received\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ this\ supplier\ cost.=Se il prezzo unitario effettivo viene modificato in un ordine fornitore, il prezzo usato alla ricezione diventa il costo del lotto FIFO e aggiorna il costo di questo fornitore.
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferito: imposta questo come fornitore preferito del prodotto. Il suo prezzo di acquisto diventa il prezzo predefinito proposto nei nuovi ordini fornitore; i costi FIFO storici e il prezzo di vendita non cambiano.
The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ purchase\ cost\ and\ is\ proposed\ automatically\ in\ new\ supplier\ orders.=Il prezzo di acquisto mostrato qui è il costo di acquisto corrente del fornitore e viene proposto automaticamente nei nuovi ordini fornitore.
When\ an\ order\ is\ received,\ its\ actual\ unit\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ also\ becomes\ the\ current\ cost\ saved\ for\ that\ supplier.=Quando un ordine viene ricevuto, il suo prezzo unitario effettivo diventa il costo del lotto FIFO e diventa anche il costo corrente salvato per quel fornitore.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.=Il costo del fornitore preferito è il costo di acquisto corrente salvato per il fornitore preferito.
The\ completed\ customer\ order\ cannot\ be\ created\ because\ stock\ cannot\ go\ below\ zero.\ Reduce\ the\ quantities\ or\ save\ the\ invoice\ without\ creating\ the\ order.=Impossibile creare l'ordine cliente completato perché il magazzino non può scendere sotto zero. Riduci le quantità oppure salva la fattura senza creare l'ordine.

Payment\ Status\:=Stato pagamento:
Paid\ Amount\:=Importo pagato:
Paid\ Amount\ *\:=Importo pagato *:
Update\ Payment=Aggiorna pagamento
Payment\ can\ be\ updated\ separately\ only\ for\ completed\ customer\ orders.=Il pagamento può essere aggiornato separatamente solo per gli ordini cliente completati.
Partial\ paid\ amount\ must\ be\ greater\ than\ zero\ and\ less\ than\ the\ total.=L'importo del pagamento parziale deve essere maggiore di zero e inferiore al totale.
Invalid\ Payment=Pagamento non valido
Error\ while\ updating\ payment=Errore durante l'aggiornamento del pagamento
Payment\ is\ managed\ by\ the\ linked\ customer\ order\ and\ is\ read-only\ here.=Il pagamento è gestito dall'ordine cliente collegato ed è di sola lettura qui.
Invoice\ linked\ to\ a\ customer\ order\:\ document\ content\ is\ locked\ and\ payment\ is\ managed\ from\ the\ order.=Fattura collegata a un ordine cliente: il contenuto del documento è bloccato e il pagamento è gestito dall'ordine.
Historical\ invoice\ in\ a\ different\ currency\:\ only\ status\ and\ payment\ can\ be\ changed.=Fattura storica in una valuta diversa: è possibile modificare solo stato e pagamento.
Finalized\ invoice\:\ only\ status\ and\ payment\ can\ be\ changed.=Fattura finalizzata: è possibile modificare solo stato e pagamento.
This\ invoice\ is\ linked\ to\ a\ customer\ order.\ Products,\ quantities,\ customer\ and\ date\ cannot\ be\ changed.\ Payment\ is\ managed\ from\ the\ order.=Questa fattura è collegata a un ordine cliente. Prodotti, quantità, cliente e data non possono essere modificati. Il pagamento è gestito dall'ordine.
This\ historical\ invoice\ uses\ {OLD}.\ The\ current\ operating\ currency\ is\ {NEW}.\ Only\ status\ and\ payment\ can\ be\ changed.=Questa fattura storica usa {OLD}. La valuta operativa corrente è {NEW}. È possibile modificare solo stato e pagamento.
Issued\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ status\ and\ payment\ can\ be\ changed.=Le fatture emesse e annullate sono documenti storici. È possibile modificare solo stato e pagamento.
Sale\ Price\ incl.\ VAT=Prezzo di vendita IVA inclusa
