Supplier\ product\ code\ (optional)\:\ the\ code\ this\ supplier\ uses\ for\ the\ product\ in\ its\ catalog,\ quotes,\ invoices\ or\ portal.\ Leave\ it\ blank\ if\ the\ supplier\ does\ not\ provide\ one.=Codice prodotto del fornitore (opzionale): il codice con cui il fornitore identifica il prodotto nel proprio catalogo, nei preventivi, nelle fatture o nel portale. Lascialo vuoto se il fornitore non ne fornisce uno.

Purchase\ price\:\ the\ supplier's\ current\ reference\ purchase\ price.\ It\ is\ proposed\ in\ new\ supplier\ orders\ and\ can\ be\ changed\ in\ the\ order.=Prezzo d'acquisto: il prezzo di acquisto di riferimento attuale di questo fornitore. Viene proposto nei nuovi ordini fornitore e può essere modificato nell'ordine.

Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ product's\ default\ purchase\ price;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferito: imposta questo come fornitore preferito del prodotto. Il suo prezzo d'acquisto diventa il prezzo d'acquisto predefinito del prodotto; i costi FIFO storici e il prezzo di vendita non cambiano.

Notes\:\ optional\ notes\ about\ this\ product-supplier\ relationship.=Note: note facoltative sulla relazione tra prodotto e fornitore.

Supplier\ product\ fields=Campi del fornitore del prodotto
Product\:\ the\ WareStat\ product\ supplied\ by\ this\ supplier.=Prodotto: il prodotto WareStat fornito da questo fornitore.
Purchase\ Cost=Costo di acquisto
Current\ purchase\ cost\ of\ the\ product.\ It\ is\ required\ for\ stock\ valuation\ and\ future\ FIFO\ movements.\ Historical\ sales\ retain\ their\ original\ FIFO\ cost.=Costo di acquisto corrente del prodotto. È necessario per valorizzare il magazzino e per i futuri movimenti FIFO. Le vendite storiche mantengono il loro costo FIFO originale.
Purchase\ cost\ is\ required.=Il costo di acquisto è obbligatorio.
Purchase\ cost\ must\ be\ greater\ than\ zero.=Il costo di acquisto deve essere maggiore di zero.
The\ new\ preferred\ supplier's\ price\ ({0})\ will\ become\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders.=Il prezzo del nuovo fornitore preferito ({0}) diventerà il prezzo di riferimento predefinito proposto nei nuovi ordini fornitore.
Edit\ Movement=Modifica movimento
Inbound\ Unit\ Cost=Costo unitario entrata
Unit\ cost\ of\ this\ inward\ movement.\ It\ becomes\ the\ cost\ of\ the\ FIFO\ lot\ and\ can\ be\ changed\ before\ saving.=Costo unitario di questa entrata. Diventa il costo del lotto FIFO e può essere modificato prima del salvataggio.
