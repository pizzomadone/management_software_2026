Reverse\ this\ outward\ movement?\ The\ original\ remains\ in\ history,\ quantities\ return\ to\ their\ original\ FIFO\ lots\ and\ later\ sales\ are\ not\ changed.=Stornare questa uscita? Il movimento originale rimane nello storico, le quantità tornano ai lotti FIFO originali e le vendite successive non vengono modificate.
Posted\ outward\ movements\ cannot\ be\ edited\ or\ deleted.\ Use\ Reverse\ Movement.=Le uscite registrate non possono essere modificate o eliminate. Usa Storna movimento.
This\ inward\ movement\ has\ historical\ FIFO\ consumption\ records\ and\ cannot\ be\ changed.=Questa entrata è collegata a consumi FIFO storici e non può essere modificata.
Only\ manual\ outward\ movements\ or\ stock\ reductions\ can\ be\ reversed\ here.=Qui puoi stornare soltanto uscite manuali o rettifiche negative della giacenza.
This\ movement\ has\ already\ been\ reversed.=Questo movimento è già stato stornato.
This\ outward\ movement\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely.=Questa uscita ha uno storico FIFO incompleto e non può essere stornata in modo sicuro.
The\ last\ actual\ purchase\ cost,\ historical\ costs\ and\ existing\ FIFO\ lots\ will\ not\ change.=L’ultimo costo reale di acquisto, i costi storici e i lotti FIFO esistenti non verranno modificati.
No\ alternative\ supplier\ remains.\ This\ product\ now\ has\ no\ preferred\ supplier.=Non rimangono fornitori alternativi. Il prodotto ora non ha un fornitore preferito.
