tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Sum of positive stock x purchase cost.</b><br>Standard costing: use the purchase cost entered in each product record. Active products only; round each product to 2 decimals, then sum. Reserved units remain included. Zero costs contribute zero; negative stock is excluded and flagged separately.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Sum of positive stock x catalog selling price.</b><br>Active products only; round each product to 2 decimals, then sum. Reserved units remain included; negative stock is excluded. This is the potential selling value of current stock, not earned revenue.</div></html>
tooltip.kpi.lowStock=<html><div style='width: 260px'><b>Count products below minimum stock or with negative stock.</b><br>Active products only. Count a product once if stock is below its minimum (when the minimum is greater than zero), or if stock is negative. Counts products, not units. Reserved quantities are not subtracted.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Count products with stock less than or equal to zero.</b><br>Active products only; negative balances are included. Counts products, not missing units. Reserved quantities are not subtracted.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Sum of completed customer order totals, excluding VAT.</b><br>Use the order date in the current local calendar month. Exclude New, In Progress and Cancelled orders. Invoices and payments are not added. Manual stock movements do not count as sales.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Sum of invoice taxable amounts, before VAT.</b><br>Include Issued and Paid invoices dated in the current local calendar month. Exclude Draft and Canceled invoices. Each invoice is counted once, regardless of payment. Customer orders are not added.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Count New or In Progress customer orders.</b><br>Across all dates. Completed and Cancelled orders are excluded. Counts orders, not product quantities or monetary amounts.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (stock sale value - stock standard cost) / stock sale value.</b><br>Uses the two stock values shown in this dashboard, so products are weighted by their selling value. With zero sale value, the margin is unavailable. This is a potential margin on current stock, not historical sales profit. A zero purchase cost assumes a free purchase.</div></html>

# Currency change workflow
Changing\ the\ operating\ currency\ affects\ products,\ costs,\ supplier\ price\ lists,\ customer\ orders,\ supplier\ orders\ and\ Draft\ invoices.=Changing the operating currency affects products, costs, supplier price lists, customer orders, supplier orders and Draft invoices.
Issued,\ Paid\ and\ Canceled\ invoices\ keep\ their\ original\ currency\ and\ amounts.=Issued, Paid and Canceled invoices keep their original currency and amounts.
Choose\ how\ existing\ operational\ values\ should\ be\ handled\:=Choose how existing operational values should be handled:
Change\ currency\ only=Change currency only
Convert\ values=Convert values
Change\ Currency=Change Currency
No\ amounts\ will\ be\ converted.=No amounts will be converted.
For\ example,\ 100\ {OLD}\ will\ become\ 100\ {NEW}.=For example, 100 {OLD} will become 100 {NEW}.
Confirm\ Currency\ Change=Confirm Currency Change
Enter\ the\ exchange\ rate\:\ 1\ {OLD}\ \=\ ?\ {NEW}=Enter the exchange rate: 1 {OLD} = ? {NEW}
Exchange\ rate\ must\ be\ a\ valid\ positive\ number.=Exchange rate must be a valid positive number.
Existing\ operational\ monetary\ values\ will\ be\ converted\ using\:=Existing operational monetary values will be converted using:
Issued,\ Paid\ and\ Canceled\ invoices\ will\ not\ be\ changed.=Issued, Paid and Canceled invoices will not be changed.
Confirm\ Currency\ Conversion=Confirm Currency Conversion
Historical\ invoice\ in\ a\ different\ currency\:\ only\ the\ status\ can\ be\ changed.=Historical invoice in a different currency: only the status can be changed.
