tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Sum of positive physical stock x preferred supplier cost.</b><br>Active and inactive products are included while stock physically remains. Reserved units remain included. Products with missing preferred supplier cost make this value incomplete; negative stock is excluded from valuation.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Positive physical stock × net sale price.</b><br>Active and inactive products with stock are included. Reserved units remain included; negative stock is excluded. This is potential stock value, not earned revenue.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Count products with available stock less than or equal to zero.</b><br>Available stock = physical stock - reserved quantity. Active products only; negative balances are included.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Completed customer sales, excluding VAT.</b><br>Uses the completion date in the current local month. Invoices and payments are not added; reversed sales are excluded.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Issued invoice taxable amounts, excluding VAT.</b><br>Uses the invoice date in the current local month. Draft and Canceled invoices are excluded; payment status does not change the total.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Customer orders not yet completed.</b><br>Counts Reservation, New and In Progress orders across all dates.<br>Completed, Cancelled and Reversed orders are excluded.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (stock sale value - stock value at preferred supplier cost) / stock sale value.</b><br>This is a potential margin on current stock, not historical sales profit. If preferred supplier costs are missing, the displayed value is marked as incomplete.</div></html>

