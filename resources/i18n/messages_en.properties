# Finalized invoice protection
Finalized\ invoice\:\ only\ the\ status\ can\ be\ changed.=Finalized invoice: only the status can be changed.
Issued,\ Paid\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ their\ status\ can\ be\ changed.=Issued, Paid and Canceled invoices are historical documents. Only their status can be changed.
A\ finalized\ invoice\ cannot\ be\ returned\ to\ Draft.=A finalized invoice cannot be returned to Draft.

