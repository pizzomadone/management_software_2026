The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.=Pokazana tutaj cena zakupu jest bieżącą ceną referencyjną dostawcy. Jest automatycznie proponowana w nowych zamówieniach do dostawców i nadal można ją zmienić w zamówieniu, na przykład z powodu rabatu lub wynegocjowanej ceny.
