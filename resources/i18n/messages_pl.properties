Import\ completed\:\ {0}\ product(s)\ without\ purchase\ cost,\ {1}\ sale(s)\ with\ historical\ cost\ that\ cannot\ be\ reconstructed,\ {2}\ completed\ sale(s)\ without\ reconstructable\ FIFO\ history.=Import zakończony: {0} produkt(y) bez kosztu zakupu, {1} sprzedaż(e) z niemożliwym do odtworzenia kosztem historycznym, {2} zakończona(e) sprzedaż(e) bez możliwej do odtworzenia historii FIFO.
Completed\ sales\ without\ reconstructable\ FIFO\ history\ remain\ visible\ but\ cannot\ be\ reopened\ or\ reversed\ automatically\ because\ the\ original\ lots\ cannot\ be\ determined\ safely.=Zakończone sprzedaże bez możliwej do odtworzenia historii FIFO pozostają widoczne, ale nie mogą być automatycznie ponownie otwarte ani stornowane, ponieważ nie można bezpiecznie ustalić pierwotnych partii.
This\ sale\ has\ been\ reversed\ and\ is\ kept\ as\ historical\ data;\ the\ order\ cannot\ be\ modified.=Ta sprzedaż została stornowana i jest zachowana jako dane historyczne; zamówienia nie można modyfikować.
This\ order\ cannot\ be\ modified\ because\ it\ has\ a\ linked\ invoice.\ Payment\ can\ still\ be\ updated.\ To\ reverse\ the\ sale,\ delete\ a\ draft\ invoice\ or\ cancel\ an\ issued\ invoice\ first,\ then\ use\ Reverse\ Sale.=Tego zamówienia nie można modyfikować, ponieważ ma powiązaną fakturę. Płatność można nadal aktualizować. Aby stornować sprzedaż, najpierw usuń fakturę roboczą albo anuluj fakturę wystawioną, a następnie użyj Stornuj sprzedaż.
This\ completed\ order\ is\ locked\ to\ protect\ stock\ and\ FIFO\ history.\ Payment\ can\ be\ updated,\ or\ it\ can\ be\ returned\ to\ In\ Progress\ if\ completion\ was\ a\ mistake.=To zakończone zamówienie jest zablokowane w celu ochrony stanu magazynu i historii FIFO. Płatność można aktualizować albo przywrócić zamówienie do W realizacji, jeśli zakończono je przez pomyłkę.
Reversed\ order\:\ it\ cannot\ be\ modified.=Stornowane zamówienie: nie można go modyfikować.
Order\ locked\:\ linked\ invoice.\ Only\ payment\ can\ be\ changed.\ To\ reverse\ the\ sale,\ remove\ or\ cancel\ the\ invoice\ first.=Zamówienie zablokowane: powiązana faktura. Można zmienić tylko płatność. Aby stornować, najpierw usuń lub anuluj fakturę.
Completed\ order\:\ only\ payment\ can\ be\ changed,\ or\ the\ order\ can\ be\ returned\ to\ In\ Progress.=Zakończone zamówienie: można zmienić tylko płatność lub przywrócić status W realizacji.
Order\ locked\:\ linked\ invoice.\ Only\ payment\ can\ be\ changed.\ To\ reverse\ the\ sale,\ delete\ the\ invoice\ if\ it\ is\ a\ draft,\ or\ cancel\ it\ if\ it\ has\ been\ issued.=Zamówienie zablokowane: powiązana faktura. Można zmienić tylko płatność. Aby stornować sprzedaż, usuń fakturę, jeśli jest robocza, albo anuluj ją, jeśli została wystawiona.
Order\ Cannot\ Be\ Changed=Zamówienia nie można zmienić
Delete\ the\ draft\ invoice\ first.=Najpierw usuń fakturę roboczą.
Only\ a\ completed\ sale\ can\ be\ reversed\ while\ linked\ to\ a\ canceled\ invoice.=Tylko zakończona sprzedaż może zostać stornowana przy powiązanej anulowanej fakturze.
Cancel\ the\ issued\ invoice\ first.=Najpierw anuluj wystawioną fakturę.
Order\ cannot\ be\ reversed\ because\ invoice\ {0}\ is\ linked\ to\ it.\ {1}=Zamówienia nie można stornować, ponieważ jest z nim powiązana faktura {0}. {1}
