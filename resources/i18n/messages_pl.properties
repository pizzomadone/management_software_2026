# Full supplier order return
Returned=Zwrócone
Returned\ to\ supplier=Zwrócono dostawcy
Supplier\ return\ requires\ all\ received\ goods\ to\ be\ available\ in\ their\ original\ FIFO\ lots.=Zwrot wymaga dostępności całego otrzymanego towaru w pierwotnych partiach FIFO.
Supplier\ return\ requires\ a\ complete\ FIFO\ receipt\ history.=Zwrot wymaga kompletnej historii FIFO przyjęcia.
