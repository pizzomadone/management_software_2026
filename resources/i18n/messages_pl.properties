# Supplier receipt validation
Purchase\ price\ must\ be\ greater\ than\ zero=Cena zakupu musi być większa od zera
Supplier\ receipt\ date\ is\ required=Data przyjęcia zamówienia od dostawcy jest wymagana
Every\ product\ must\ have\ a\ supplier,\ a\ positive\ quantity\ and\ a\ purchase\ price\ greater\ than\ zero.\ Check\:\ {0}=Każdy produkt musi mieć dostawcę, dodatnią ilość i cenę zakupu większą od zera. Sprawdź: {0}
Preferred\ Supplier\ Cost=Koszt preferowanego dostawcy
Click\ to\ edit\ the\ preferred\ supplier\ cost.=Kliknij, aby zmienić koszt preferowanego dostawcy.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.\ Click\ the\ value\ to\ edit\ it.=Koszt preferowanego dostawcy to aktualny koszt zakupu zapisany dla tego dostawcy. Kliknij wartość, aby ją zmienić.
When\ a\ supplier\ order\ is\ received,\ its\ actual\ unit\ purchase\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ that\ supplier's\ current\ cost.=Po przyjęciu zamówienia od dostawcy rzeczywista jednostkowa cena zakupu staje się kosztem partii FIFO i aktualizuje bieżący koszt tego dostawcy.
Last\ purchase\ cost\ is\ the\ unit\ cost\ of\ the\ most\ recently\ received\ supplier\ purchase.\ It\ is\ updated\ automatically\ and\ cannot\ be\ edited\ here.=Ostatni koszt zakupu to koszt jednostkowy ostatnio przyjętego zakupu od dostawcy. Jest aktualizowany automatycznie i nie można go tutaj edytować.
Historical\ FIFO\ lots\ and\ completed\ sales\ keep\ the\ costs\ recorded\ when\ they\ were\ created.=Historyczne partie FIFO i zakończone sprzedaże zachowują koszty zapisane w chwili ich utworzenia.
Purchase\ Cost\ Help=Pomoc dotycząca kosztów zakupu
Purchase\ price\:\ the\ supplier's\ current\ purchase\ cost\ for\ this\ product.\ It\ is\ proposed\ in\ new\ supplier\ orders.=Cena zakupu: bieżący koszt zakupu tego produktu u dostawcy. Jest proponowany w nowych zamówieniach do dostawców.
If\ the\ actual\ unit\ price\ is\ changed\ in\ a\ supplier\ order,\ the\ price\ used\ when\ the\ order\ is\ received\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ this\ supplier\ cost.=Jeśli rzeczywista cena jednostkowa zostanie zmieniona w zamówieniu do dostawcy, cena użyta przy przyjęciu stanie się kosztem partii FIFO i zaktualizuje koszt tego dostawcy.
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferowany: ustawia tego dostawcę jako preferowanego dla produktu. Jego cena zakupu staje się domyślną ceną proponowaną w nowych zamówieniach do dostawców; historyczne koszty FIFO i cena sprzedaży nie zmieniają się.
The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ purchase\ cost\ and\ is\ proposed\ automatically\ in\ new\ supplier\ orders.=Pokazana tutaj cena zakupu jest bieżącym kosztem zakupu u dostawcy i jest automatycznie proponowana w nowych zamówieniach.
When\ an\ order\ is\ received,\ its\ actual\ unit\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ also\ becomes\ the\ current\ cost\ saved\ for\ that\ supplier.=Po przyjęciu zamówienia jego rzeczywista cena jednostkowa staje się kosztem partii FIFO oraz bieżącym kosztem zapisanym dla tego dostawcy.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.=Koszt preferowanego dostawcy to bieżący koszt zakupu zapisany dla preferowanego dostawcy.
The\ completed\ customer\ order\ cannot\ be\ created\ because\ stock\ cannot\ go\ below\ zero.\ Reduce\ the\ quantities\ or\ save\ the\ invoice\ without\ creating\ the\ order.=Nie można utworzyć zakończonego zamówienia klienta, ponieważ stan magazynowy nie może spaść poniżej zera. Zmniejsz ilości lub zapisz fakturę bez tworzenia zamówienia.

Payment\ Status\:=Status płatności:
Paid\ Amount\:=Zapłacona kwota:
Paid\ Amount\ *\:=Zapłacona kwota *:
Update\ Payment=Aktualizuj płatność
Payment\ can\ be\ updated\ separately\ only\ for\ completed\ customer\ orders.=Płatność można aktualizować oddzielnie tylko dla zakończonych zamówień klientów.
Partial\ paid\ amount\ must\ be\ greater\ than\ zero\ and\ less\ than\ the\ total.=Kwota częściowej płatności musi być większa od zera i mniejsza od sumy.
Invalid\ Payment=Nieprawidłowa płatność
Error\ while\ updating\ payment=Błąd podczas aktualizacji płatności
Payment\ is\ managed\ by\ the\ linked\ customer\ order\ and\ is\ read-only\ here.=Płatność jest zarządzana przez powiązane zamówienie klienta i tutaj jest tylko do odczytu.
Invoice\ linked\ to\ a\ customer\ order\:\ document\ content\ is\ locked\ and\ payment\ is\ managed\ from\ the\ order.=Faktura jest powiązana z zamówieniem klienta: zawartość dokumentu jest zablokowana, a płatność jest zarządzana z poziomu zamówienia.
Historical\ invoice\ in\ a\ different\ currency\:\ only\ status\ and\ payment\ can\ be\ changed.=Faktura historyczna w innej walucie: można zmieniać tylko status i płatność.
Finalized\ invoice\:\ only\ status\ and\ payment\ can\ be\ changed.=Sfinalizowana faktura: można zmieniać tylko status i płatność.
This\ invoice\ is\ linked\ to\ a\ customer\ order.\ Products,\ quantities,\ customer\ and\ date\ cannot\ be\ changed.\ Payment\ is\ managed\ from\ the\ order.=Ta faktura jest powiązana z zamówieniem klienta. Produktów, ilości, klienta i daty nie można zmieniać. Płatność jest zarządzana z poziomu zamówienia.
This\ historical\ invoice\ uses\ {OLD}.\ The\ current\ operating\ currency\ is\ {NEW}.\ Only\ status\ and\ payment\ can\ be\ changed.=Ta faktura historyczna używa {OLD}. Bieżąca waluta operacyjna to {NEW}. Można zmieniać tylko status i płatność.
Issued\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ status\ and\ payment\ can\ be\ changed.=Wystawione i anulowane faktury są dokumentami historycznymi. Można zmieniać tylko status i płatność.
Sale\ Price\ incl.\ VAT=Cena sprzedaży z VAT
Customer\ sale\ price\ incl.\ VAT=Cena sprzedaży dla klienta z VAT
Unit\ Price\ incl.\ VAT=Cena jednostkowa z VAT
Total\ incl.\ VAT=Razem z VAT
Unit\ price\ excl.\ VAT=Cena jednostkowa bez VAT
Total\ excl.\ VAT=Razem bez VAT
Stock\ at\ net\ sale\ price=Magazyn wg ceny sprzedaży netto

{0}\ net\ +\ {1}\ VAT={0} netto + {1} VAT
Estimated\ margin\:\ {0}\ ({1}/unit)=Szacowana marża: {0} ({1}/szt.)
Margin\ unavailable\:\ enter\ a\ purchase\ cost.=Marża niedostępna: podaj koszt zakupu.
Margin\ unavailable\:\ purchase\ cost\ missing.=Marża niedostępna: brak kosztu zakupu.
Margin\ unavailable\:\ net\ sale\ price\ is\ zero.=Marża niedostępna: cena netto wynosi zero.
Estimated\ margin\ \=\ (net\ sale\ price\ -\ purchase\ cost)\ /\ net\ sale\ price.\ Other\ expenses\ are\ excluded.=Szacowana marża = (cena sprzedaży netto - koszt zakupu) / cena sprzedaży netto. Pozostałe wydatki nie są uwzględnione.
Estimate\ based\ on\ the\ last\ actual\ purchase\ cost.\ Margin\ \=\ (net\ sale\ price\ -\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Szacunek na podstawie ostatniego rzeczywistego kosztu zakupu. Marża = (cena netto - koszt) / cena netto. Rzeczywisty zysk ze sprzedaży jest obliczany metodą FIFO; pozostałe wydatki nie są uwzględnione.

Stock\ at\ preferred\ supplier\ cost=Zapas: koszt preferowanego dostawcy
In-stock\ products\ with\ missing\ preferred\ supplier\ cost=Produkty na stanie bez kosztu preferowanego dostawcy
*\ Some\ in-stock\ products\ have\ no\ preferred\ supplier\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Dla części produktów na stanie brakuje kosztu preferowanego dostawcy; wartość kosztowa zapasu i potencjalna marża są niepełne.
Estimated\ Margin=Szacowana marża
Estimated\ margin\ \=\ (net\ sale\ price\ -\ preferred\ supplier\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Szacowana marża = (cena sprzedaży netto - koszt preferowanego dostawcy) / cena sprzedaży netto. Rzeczywisty zysk ze sprzedaży korzysta z FIFO; pozostałe koszty są wykluczone.
Margin\ unavailable\:\ preferred\ supplier\ cost\ missing.=Marża niedostępna: brak kosztu preferowanego dostawcy.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ the\ current\ preferred\ supplier\ cost.\ Reserved\ units\ remain\ included.=Tylko aktywne produkty z dodatnim stanem fizycznym są wyceniane według bieżącego kosztu preferowanego dostawcy. Zarezerwowane sztuki pozostają uwzględnione.

Positive\ physical\ stock\ is\ valued\ at\ the\ current\ preferred\ supplier\ cost,\ including\ inactive\ products\ that\ still\ remain\ in\ stock.\ Reserved\ units\ remain\ included.=Dodatni stan fizyczny jest wyceniany według bieżącego kosztu preferowanego dostawcy, łącznie z nieaktywnymi produktami, które nadal pozostają na stanie. Zarezerwowane sztuki pozostają uwzględnione.

Reservation\ does\ not\ affect\ stock.\ In\ Progress\ reserves\ available\ stock.\ Completed\ decreases\ physical\ stock\ and\ applies\ FIFO.=Rezerwacja nie zmienia stanu magazynowego. W realizacji rezerwuje dostępny stan. Zakończone zmniejsza stan fizyczny i stosuje FIFO.
Insufficient\ stock\ for\ the\ following\ products\:=Niewystarczający stan dla następujących produktów:
The\ order\ cannot\ reserve\ more\ units\ than\ are\ currently\ available.\ Reduce\ the\ quantities\ or\ replenish\ stock.=Zamówienie nie może zarezerwować więcej sztuk niż jest obecnie dostępnych. Zmniejsz ilości lub uzupełnij stan magazynowy.

Reservation=Rezerwacja
tooltip.order.statusFlow=<html><b>Rezerwacja</b>: wyłącznie handlowa; bez wpływu na stan i FIFO.<br><b>Nowe</b>: rezerwuje wszystkie wymagane sztuki.<br><b>W realizacji</b>: utrzymuje rezerwację.<br><b>Zakończone</b>: zapisuje datę zakończenia, zmniejsza stan fizyczny i zużywa FIFO.<br><b>Anulowane</b>: zwalnia rezerwację.</html>
With\ insufficient\ available\ stock,\ the\ order\ can\ only\ be\ saved\ as\ Reservation.\ Reservation\ does\ not\ change\ stock,\ reserved\ quantities,\ lots\ or\ FIFO.=Przy niewystarczającej dostępności zamówienie można zapisać tylko jako Rezerwacja. Rezerwacja nie zmienia stanu, zarezerwowanych ilości, partii ani FIFO.

units=szt.
