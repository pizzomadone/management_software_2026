Cannot\ delete\ this\ supplier\:\ completed\ purchases\ have\ missing\ or\ depleted\ original\ FIFO\ lots.=Nie można usunąć dostawcy: niektóre zakończone zakupy mają brakujące lub już zużyte pierwotne partie FIFO.
