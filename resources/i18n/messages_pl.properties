tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Suma dodatnich stanów x koszt zakupu.</b><br>Metoda kosztu standardowego: używa kosztu zakupu wpisanego w karcie każdego produktu. Tylko aktywne produkty; wartość każdego produktu jest zaokrąglana do 2 miejsc po przecinku przed sumowaniem. Zarezerwowane sztuki pozostają uwzględnione. Zerowe koszty dają zero; stany ujemne są wyłączone i sygnalizowane oddzielnie.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Suma dodatnich stanów x katalogowa cena sprzedaży.</b><br>Tylko aktywne produkty; wartość każdego produktu jest zaokrąglana do 2 miejsc po przecinku przed sumowaniem. Zarezerwowane sztuki pozostają uwzględnione; stany ujemne są wyłączone. To potencjalna wartość sprzedaży obecnych zapasów, a nie już osiągnięty przychód.</div></html>
tooltip.kpi.lowStock=<html><div style='width: 260px'><b>Liczy produkty poniżej stanu minimalnego lub ze stanem ujemnym.</b><br>Tylko aktywne produkty. Produkt liczy się raz, jeśli stan jest poniżej minimum (gdy minimum jest większe od zera) lub gdy stan jest ujemny. Liczy produkty, nie sztuki. Ilości zarezerwowane nie są odejmowane.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Liczy produkty ze stanem mniejszym lub równym zero.</b><br>Tylko aktywne produkty; uwzględnia stany ujemne. Liczy produkty, nie brakujące sztuki. Ilości zarezerwowane nie są odejmowane.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Suma wartości zrealizowanych zamówień klientów, bez VAT.</b><br>Używa daty zamówienia w bieżącym miesiącu kalendarzowym, według lokalnej strefy czasowej. Wyklucza zamówienia nowe, w toku i anulowane. Faktury i płatności nie są dodawane. Ręczne ruchy magazynowe nie są liczone jako sprzedaż.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Suma kwot netto faktur, przed VAT.</b><br>Uwzględnia faktury wystawione i opłacone z datą w bieżącym miesiącu kalendarzowym, według lokalnej strefy czasowej. Wyklucza wersje robocze i faktury anulowane. Każda faktura liczy się raz, niezależnie od płatności. Zamówienia klientów nie są dodawane.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Liczy nowe zamówienia klientów lub zamówienia w toku.</b><br>Uwzględnia wszystkie daty. Wyklucza zamówienia zrealizowane i anulowane. Liczy zamówienia, nie ilości produktów ani kwoty.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (wartość sprzedaży zapasów - wartość według kosztu standardowego) / wartość sprzedaży zapasów.</b><br>Używa dwóch wyświetlanych wartości zapasów: produkty są ważone według wartości sprzedaży. Przy zerowej wartości sprzedaży marża jest niedostępna. To potencjalna marża obecnych zapasów, nie historyczny zysk ze sprzedaży. Zerowy koszt zakupu oznacza założenie bezpłatnego nabycia.</div></html>

