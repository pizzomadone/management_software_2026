Unable\ to\ return\ supplier\ order=Nie można zwrócić zamówienia dostawcy
Returned\ supplier\ orders\ are\ historical\ and\ cannot\ be\ deleted.=Zwrócone zamówienia są historyczne i nie mogą zostać usunięte.

