Sales\ without\ reconstructable\ historical\ cost\ remain\ visible\ but\ are\ excluded\ from\ historical\ cost,\ gross\ profit\ and\ other\ calculations\ that\ require\ that\ cost.=Sprzedaże bez możliwego do odtworzenia kosztu historycznego pozostają widoczne, ale są wykluczane z kosztu historycznego, zysku brutto i innych obliczeń wymagających tego kosztu.
SALE_REVERSAL=STORNO SPRZEDAŻY
ORDER_REVERSAL=STORNO ZAMÓWIENIA
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferowany: ustawia tego dostawcę jako preferowanego dla produktu. Jego cena zakupu staje się domyślną ceną referencyjną proponowaną w nowych zamówieniach; historyczne koszty FIFO i cena sprzedaży nie zmieniają się.
Supplier\ '{0}'\ has\ related\ business\ records\:=Dostawca '{0}' ma powiązane dane biznesowe:
Existing\ orders=Istniejące zamówienia
{0}\ supplied\ product(s)\ will\ be\ disassociated={0} dostarczanych produktów zostanie odłączonych
For\ {0}\ product(s),\ this\ is\ the\ preferred\ supplier.\ WareStat\ will\ automatically\ choose\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price;\ if\ no\ alternative\ exists,\ the\ product\ will\ remain\ without\ a\ preferred\ supplier.=Dla {0} produktów jest to preferowany dostawca. WareStat automatycznie wybierze pozostałego dostawcę z najniższą ceną zakupu; jeśli nie ma alternatywy, produkt pozostanie bez preferowanego dostawcy.
Choose\ what\ should\ happen\:=Wybierz, co ma się stać:
Keep\:\ nothing\ is\ deleted;\ supplier,\ orders,\ stock\ and\ references\ remain\ unchanged.=Zachowaj: nic nie zostanie usunięte; dostawca, zamówienia, stan i powiązania pozostaną bez zmian.
Delete\ all\:\ supplier\ orders\ and\ product\ associations\ are\ permanently\ deleted;\ stock\ received\ from\ completed\ orders\ is\ reversed\ and\ related\ movements\ are\ deleted.=Usuń wszystko: zamówienia do dostawcy i powiązania produktów zostaną trwale usunięte; stan otrzymany z zakończonych zamówień zostanie wycofany, a powiązane ruchy usunięte.
All\ orders\ from\ this\ supplier=Wszystkie zamówienia od tego dostawcy
All\ supplied-product\ associations=Wszystkie powiązania dostarczanych produktów
Preferred-supplier\ references\ linked\ to\ those\ products=Powiązania preferowanego dostawcy dla tych produktów
All\ related\ warehouse\ movements=Wszystkie powiązane ruchy magazynowe
If\ preferred\ suppliers\ change,\ the\ lowest-cost\ remaining\ supplier\ will\ be\ selected\ automatically.=Jeśli preferowany dostawca ulegnie zmianie, automatycznie zostanie wybrany najtańszy pozostały dostawca.
This\ action\ CANNOT\ be\ undone!=Tej operacji NIE MOŻNA cofnąć!
This\ completed\ sale\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Ta zakończona sprzedaż ma niepełną historię FIFO i nie może być bezpiecznie stornowana
This\ outward\ movement\ cannot\ be\ changed\ because\ later\ FIFO\ movements\ exist\ for\ the\ same\ product=Nie można zmienić tego ruchu wychodzącego, ponieważ istnieją późniejsze ruchy FIFO dla tego samego produktu
This\ completed\ sale\ has\ already\ been\ reversed=Ta zakończona sprzedaż została już stornowana
Only\ completed\ customer\ orders\ can\ be\ reversed=Można stornować tylko zakończone zamówienia klientów
This\ supplier\ receipt\ cannot\ be\ reversed\ because\ its\ FIFO\ lot\ has\ historical\ consumption\ records=Tego przyjęcia od dostawcy nie można cofnąć, ponieważ jego partia FIFO ma już historyczne zapisy zużycia
This\ outward\ movement\ has\ no\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Ten ruch wychodzący nie ma historii FIFO i nie może być bezpiecznie cofnięty
This\ supplier\ receipt\ has\ no\ FIFO\ lot\ history\ and\ cannot\ be\ reversed\ safely=To przyjęcie od dostawcy nie ma historii partii FIFO i nie może być bezpiecznie cofnięte
Completed\ or\ reversed\ customer\ sales\ cannot\ be\ deleted.\ Reverse\ completed\ sales\ instead.=Zakończonych lub stornowanych sprzedaży klienta nie można usuwać. Zakończone sprzedaże należy stornować.
Reverse\ Sale=Stornuj sprzedaż
Reverse\ the\ completed\ sale\ while\ preserving\ FIFO\ history.=Stornuj zakończoną sprzedaż, zachowując historię FIFO.
Historical\ cost\ unavailable=Koszt historyczny niedostępny
Reverse\ Movement=Stornuj ruch
MOVEMENT_REVERSAL=Storno ruchu
Movement\ reversed\ successfully.=Ruch został stornowany.
Reverse\ this\ outward\ movement?\ The\ original\ remains\ in\ history,\ quantities\ return\ to\ their\ original\ FIFO\ lots\ and\ later\ sales\ are\ not\ changed.=Stornować to wydanie? Oryginalny ruch pozostanie w historii, ilości wrócą do pierwotnych partii FIFO, a późniejsze sprzedaże nie zmienią się.
Posted\ outward\ movements\ cannot\ be\ edited\ or\ deleted.\ Use\ Reverse\ Movement.=Zaksięgowanych wydań nie można edytować ani usuwać. Użyj opcji Stornuj ruch.
This\ inward\ movement\ has\ historical\ FIFO\ consumption\ records\ and\ cannot\ be\ changed.=To przyjęcie ma historyczne zapisy zużycia FIFO i nie można go zmienić.
Only\ manual\ outward\ movements\ or\ stock\ reductions\ can\ be\ reversed\ here.=Tutaj można stornować tylko ręczne wydania lub korekty zmniejszające stan.
This\ movement\ has\ already\ been\ reversed.=Ten ruch został już stornowany.
This\ outward\ movement\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely.=To wydanie ma niepełną historię FIFO i nie można go bezpiecznie stornować.
The\ last\ actual\ purchase\ cost,\ historical\ costs\ and\ existing\ FIFO\ lots\ will\ not\ change.=Ostatni rzeczywisty koszt zakupu, koszty historyczne i istniejące partie FIFO nie zmienią się.
No\ alternative\ supplier\ remains.\ This\ product\ now\ has\ no\ preferred\ supplier.=Nie ma innych dostawców. Ten produkt nie ma teraz preferowanego dostawcy.
Database\ Updated=Baza danych zaktualizowana
Error\ loading\ movement=Błąd wczytywania ruchu
Error\ deleting\ movement=Błąd usuwania ruchu
