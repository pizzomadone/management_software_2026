# Currency change workflow
Changing\ the\ operating\ currency\ affects\ products,\ costs,\ supplier\ price\ lists,\ customer\ orders,\ supplier\ orders\ and\ Draft\ invoices.=Zmiana waluty operacyjnej wpływa na produkty, koszty, cenniki dostawców, zamówienia klientów, zamówienia do dostawców i faktury robocze.
Issued,\ Paid\ and\ Canceled\ invoices\ keep\ their\ original\ currency\ and\ amounts.=Wystawione, opłacone i anulowane faktury zachowują oryginalną walutę i kwoty.
Choose\ how\ existing\ operational\ values\ should\ be\ handled\:=Wybierz sposób obsługi istniejących wartości operacyjnych:
Change\ currency\ only=Zmień tylko walutę
Convert\ values=Przelicz kwoty
Change\ Currency=Zmień walutę
No\ amounts\ will\ be\ converted.=Żadne kwoty nie zostaną przeliczone.
For\ example,\ 100\ {OLD}\ will\ become\ 100\ {NEW}.=Na przykład 100 {OLD} stanie się 100 {NEW}.
Confirm\ Currency\ Change=Potwierdź zmianę waluty
Enter\ the\ exchange\ rate\:\ 1\ {OLD}\ \=\ ?\ {NEW}=Wprowadź kurs wymiany: 1 {OLD} = ? {NEW}
Exchange\ rate\ must\ be\ a\ valid\ positive\ number.=Kurs wymiany musi być prawidłową liczbą dodatnią.
Existing\ operational\ monetary\ values\ will\ be\ converted\ using\:=Istniejące operacyjne wartości pieniężne zostaną przeliczone według:
Issued,\ Paid\ and\ Canceled\ invoices\ will\ not\ be\ changed.=Wystawione, opłacone i anulowane faktury nie zostaną zmienione.
Confirm\ Currency\ Conversion=Potwierdź przeliczenie waluty
Historical\ invoice\ in\ a\ different\ currency\:\ only\ the\ status\ can\ be\ changed.=Faktura historyczna w innej walucie: można zmienić tylko status.
This\ historical\ invoice\ uses\ {OLD}.\ The\ current\ operating\ currency\ is\ {NEW}.\ Only\ its\ status\ can\ be\ changed.=Ta faktura historyczna używa {OLD}. Bieżąca waluta operacyjna to {NEW}. Można zmienić tylko jej status.
Historical\ Invoice=Faktura historyczna
A\ historical\ invoice\ in\ another\ currency\ cannot\ be\ returned\ to\ Draft.=Faktury historycznej w innej walucie nie można przywrócić do statusu Szkic.
Page=Strona

# Clear currency-change explanations
Currency\ change\:\ {OLD}\ →\ {NEW}=Zmiana waluty: {OLD} → {NEW}
Change\ currency\ only\:\ numbers\ stay\ the\ same.=Zmień tylko walutę: wartości liczbowe pozostaną bez zmian.
Convert\ values\:\ monetary\ values\ are\ recalculated\ using\ a\ rate\ you\ enter.=Przelicz wartości: kwoty zostaną przeliczone według podanego kursu.
Currency\ changed\ successfully.=Waluta została zmieniona.
No\ amounts\ were\ converted.=Żadne kwoty nie zostały przeliczone.
Operational\ values\ were\ converted\ using\ the\ selected\ exchange\ rate.=Wartości operacyjne zostały przeliczone według wybranego kursu.

# Finalized invoice protection
Finalized\ invoice\:\ only\ the\ status\ can\ be\ changed.=Faktura ostateczna: można zmienić tylko status.
Issued,\ Paid\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ their\ status\ can\ be\ changed.=Faktury wystawione, opłacone i anulowane są dokumentami historycznymi. Można zmienić tylko ich status.
A\ finalized\ invoice\ cannot\ be\ returned\ to\ Draft.=Faktury ostatecznej nie można przywrócić do statusu Szkic.

