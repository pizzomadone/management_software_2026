Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ their\ current\ purchase\ cost.\ Reserved\ units\ remain\ included.=Nur aktive Produkte mit positivem physischem Bestand werden mit ihren aktuellen Einkaufskosten bewertet. Reservierte Einheiten bleiben enthalten.
