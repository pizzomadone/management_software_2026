# Supplier receipt validation
Purchase\ price\ must\ be\ greater\ than\ zero=Der Einkaufspreis muss größer als null sein
Supplier\ receipt\ date\ is\ required=Das Wareneingangsdatum der Lieferantenbestellung ist erforderlich
Every\ product\ must\ have\ a\ supplier,\ a\ positive\ quantity\ and\ a\ purchase\ price\ greater\ than\ zero.\ Check\:\ {0}=Jedes Produkt muss einen Lieferanten, eine positive Menge und einen Einkaufspreis größer als null haben. Prüfen: {0}
Preferred\ Supplier\ Cost=Kosten beim bevorzugten Lieferanten
Click\ to\ edit\ the\ preferred\ supplier\ cost.=Klicken, um die Kosten beim bevorzugten Lieferanten zu bearbeiten.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.\ Click\ the\ value\ to\ edit\ it.=Die Kosten beim bevorzugten Lieferanten sind die aktuell für diesen Lieferanten gespeicherten Einkaufskosten. Klicken Sie auf den Wert, um ihn zu bearbeiten.
When\ a\ supplier\ order\ is\ received,\ its\ actual\ unit\ purchase\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ that\ supplier's\ current\ cost.=Beim Wareneingang einer Lieferantenbestellung wird der tatsächliche Einkaufspreis je Einheit zum FIFO-Lospreis und aktualisiert die aktuellen Kosten dieses Lieferanten.
Last\ purchase\ cost\ is\ the\ unit\ cost\ of\ the\ most\ recently\ received\ supplier\ purchase.\ It\ is\ updated\ automatically\ and\ cannot\ be\ edited\ here.=Der letzte Einkaufspreis ist der Stückpreis des zuletzt eingegangenen Lieferantenkaufs. Er wird automatisch aktualisiert und kann hier nicht bearbeitet werden.
Historical\ FIFO\ lots\ and\ completed\ sales\ keep\ the\ costs\ recorded\ when\ they\ were\ created.=Historische FIFO-Lose und abgeschlossene Verkäufe behalten die bei ihrer Erstellung gespeicherten Kosten.
Purchase\ Cost\ Help=Hilfe zu Einkaufskosten
Purchase\ price\:\ the\ supplier's\ current\ purchase\ cost\ for\ this\ product.\ It\ is\ proposed\ in\ new\ supplier\ orders.=Einkaufspreis: die aktuellen Einkaufskosten dieses Produkts bei diesem Lieferanten. Sie werden in neuen Lieferantenbestellungen vorgeschlagen.
If\ the\ actual\ unit\ price\ is\ changed\ in\ a\ supplier\ order,\ the\ price\ used\ when\ the\ order\ is\ received\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ this\ supplier\ cost.=Wird der tatsächliche Stückpreis in einer Lieferantenbestellung geändert, wird der beim Wareneingang verwendete Preis zum FIFO-Lospreis und aktualisiert diese Lieferantenkosten.
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Bevorzugt: macht diesen Lieferanten zum bevorzugten Lieferanten des Produkts. Sein Einkaufspreis wird als Standard in neuen Lieferantenbestellungen vorgeschlagen; historische FIFO-Kosten und Verkaufspreis bleiben unverändert.
The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ purchase\ cost\ and\ is\ proposed\ automatically\ in\ new\ supplier\ orders.=Der hier gezeigte Einkaufspreis ist der aktuelle Einkaufspreis des Lieferanten und wird in neuen Lieferantenbestellungen automatisch vorgeschlagen.
When\ an\ order\ is\ received,\ its\ actual\ unit\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ also\ becomes\ the\ current\ cost\ saved\ for\ that\ supplier.=Beim Wareneingang wird der tatsächliche Stückpreis zum FIFO-Lospreis und zugleich zu den aktuell für diesen Lieferanten gespeicherten Kosten.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.=Die Kosten des bevorzugten Lieferanten sind die aktuell für diesen Lieferanten gespeicherten Einkaufskosten.
The\ completed\ customer\ order\ cannot\ be\ created\ because\ stock\ cannot\ go\ below\ zero.\ Reduce\ the\ quantities\ or\ save\ the\ invoice\ without\ creating\ the\ order.=Der abgeschlossene Kundenauftrag kann nicht erstellt werden, da der Bestand nicht unter null fallen darf. Reduzieren Sie die Mengen oder speichern Sie die Rechnung ohne Auftrag.

Payment\ Status\:=Zahlungsstatus:
Paid\ Amount\:=Bezahlter Betrag:
Paid\ Amount\ *\:=Bezahlter Betrag *:
Update\ Payment=Zahlung aktualisieren
Payment\ can\ be\ updated\ separately\ only\ for\ completed\ customer\ orders.=Die Zahlung kann nur bei abgeschlossenen Kundenaufträgen separat aktualisiert werden.
Partial\ paid\ amount\ must\ be\ greater\ than\ zero\ and\ less\ than\ the\ total.=Der Teilzahlungsbetrag muss größer als null und kleiner als der Gesamtbetrag sein.
Invalid\ Payment=Ungültige Zahlung
Error\ while\ updating\ payment=Fehler beim Aktualisieren der Zahlung
Payment\ is\ managed\ by\ the\ linked\ customer\ order\ and\ is\ read-only\ here.=Die Zahlung wird über den verknüpften Kundenauftrag verwaltet und ist hier schreibgeschützt.
Invoice\ linked\ to\ a\ customer\ order\:\ document\ content\ is\ locked\ and\ payment\ is\ managed\ from\ the\ order.=Rechnung mit einem Kundenauftrag verknüpft: Der Dokumentinhalt ist gesperrt und die Zahlung wird über den Auftrag verwaltet.
Historical\ invoice\ in\ a\ different\ currency\:\ only\ status\ and\ payment\ can\ be\ changed.=Historische Rechnung in einer anderen Währung: Nur Status und Zahlung können geändert werden.
Finalized\ invoice\:\ only\ status\ and\ payment\ can\ be\ changed.=Finalisierte Rechnung: Nur Status und Zahlung können geändert werden.
This\ invoice\ is\ linked\ to\ a\ customer\ order.\ Products,\ quantities,\ customer\ and\ date\ cannot\ be\ changed.\ Payment\ is\ managed\ from\ the\ order.=Diese Rechnung ist mit einem Kundenauftrag verknüpft. Produkte, Mengen, Kunde und Datum können nicht geändert werden. Die Zahlung wird über den Auftrag verwaltet.
This\ historical\ invoice\ uses\ {OLD}.\ The\ current\ operating\ currency\ is\ {NEW}.\ Only\ status\ and\ payment\ can\ be\ changed.=Diese historische Rechnung verwendet {OLD}. Die aktuelle Betriebswährung ist {NEW}. Nur Status und Zahlung können geändert werden.
Issued\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ status\ and\ payment\ can\ be\ changed.=Ausgestellte und stornierte Rechnungen sind historische Dokumente. Nur Status und Zahlung können geändert werden.
Sale\ Price\ incl.\ VAT=Verkaufspreis inkl. MwSt.
Customer\ sale\ price\ incl.\ VAT=Kundenverkaufspreis inkl. MwSt.
Unit\ Price\ incl.\ VAT=Stückpreis inkl. MwSt.
Total\ incl.\ VAT=Gesamt inkl. MwSt.
Unit\ price\ excl.\ VAT=Stückpreis exkl. MwSt.
Total\ excl.\ VAT=Gesamt exkl. MwSt.
