The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.=Der hier angezeigte Einkaufspreis ist der aktuelle Referenzpreis des Lieferanten. Er wird in neuen Lieferantenbestellungen automatisch vorgeschlagen und kann dort weiterhin geändert werden, zum Beispiel für Rabatte oder ausgehandelte Preise.
When\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.=Wenn Sie einen anderen Lieferanten als bevorzugt festlegen, wird dessen Einkaufspreis zum standardmäßig vorgeschlagenen Einkaufspreis für dieses Produkt. Der Verkaufspreis des Produkts und historische FIFO-Kosten werden nicht geändert.
