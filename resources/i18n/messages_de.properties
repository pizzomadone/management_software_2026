{0}\ net\ +\ {1}\ VAT={0} netto + {1} MwSt.
Estimated\ margin\:\ {0}\ ({1}/unit)=Geschätzte Marge: {0} ({1}/Stück)
Margin\ unavailable\:\ enter\ a\ purchase\ cost.=Marge nicht verfügbar: Einkaufskosten eingeben.
Margin\ unavailable\:\ purchase\ cost\ missing.=Marge nicht verfügbar: Einkaufskosten fehlen.
Margin\ unavailable\:\ net\ sale\ price\ is\ zero.=Marge nicht verfügbar: Nettopreis ist null.
Estimated\ margin\ \=\ (net\ sale\ price\ -\ purchase\ cost)\ /\ net\ sale\ price.\ Other\ expenses\ are\ excluded.=Geschätzte Marge = (Nettoverkaufspreis - Einkaufskosten) / Nettoverkaufspreis. Andere Ausgaben sind nicht enthalten.
Estimate\ based\ on\ the\ last\ actual\ purchase\ cost.\ Margin\ \=\ (net\ sale\ price\ -\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Schätzung auf Basis der letzten tatsächlichen Einkaufskosten. Marge = (Nettopreis - Kosten) / Nettopreis. Der tatsächliche Verkaufsgewinn verwendet FIFO; andere Ausgaben sind nicht enthalten.

Stock\ at\ preferred\ supplier\ cost=Bestand: bevorzugter Lieferantenpreis
In-stock\ products\ with\ missing\ preferred\ supplier\ cost=Lagerprodukte ohne Preis des bevorzugten Lieferanten
*\ Some\ in-stock\ products\ have\ no\ preferred\ supplier\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Für einige Lagerprodukte fehlt der Preis des bevorzugten Lieferanten; Bestandswert und potenzielle Marge sind unvollständig.
Estimated\ Margin=Geschätzte Marge
Estimated\ margin\ \=\ (net\ sale\ price\ -\ preferred\ supplier\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Geschätzte Marge = (Nettoverkaufspreis - Preis des bevorzugten Lieferanten) / Nettoverkaufspreis. Der tatsächliche Verkaufsgewinn verwendet FIFO; weitere Kosten sind ausgeschlossen.
Margin\ unavailable\:\ preferred\ supplier\ cost\ missing.=Marge nicht verfügbar: Preis des bevorzugten Lieferanten fehlt.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ the\ current\ preferred\ supplier\ cost.\ Reserved\ units\ remain\ included.=Nur aktive Produkte mit positivem physischem Bestand werden zum aktuellen Preis des bevorzugten Lieferanten bewertet. Reservierte Einheiten bleiben enthalten.

Positive\ physical\ stock\ is\ valued\ at\ the\ current\ preferred\ supplier\ cost,\ including\ inactive\ products\ that\ still\ remain\ in\ stock.\ Reserved\ units\ remain\ included.=Positiver physischer Bestand wird zum aktuellen Preis des bevorzugten Lieferanten bewertet, einschließlich inaktiver Produkte, die noch auf Lager sind. Reservierte Einheiten bleiben enthalten.

Reservation\ does\ not\ affect\ stock.\ In\ Progress\ reserves\ available\ stock.\ Completed\ decreases\ physical\ stock\ and\ applies\ FIFO.=Reservierung verändert den Bestand nicht. In Bearbeitung reserviert den verfügbaren Bestand. Abgeschlossen reduziert den physischen Bestand und wendet FIFO an.
Insufficient\ stock\ for\ the\ following\ products\:=Unzureichender Bestand für folgende Produkte:
The\ order\ cannot\ reserve\ more\ units\ than\ are\ currently\ available.\ Reduce\ the\ quantities\ or\ replenish\ stock.=Der Auftrag kann nicht mehr Einheiten reservieren als derzeit verfügbar. Reduzieren Sie die Mengen oder füllen Sie den Bestand auf.

Reservation=Reservierung
tooltip.order.statusFlow=<html><b>Reservierung</b>: nur kaufmännisch; keine Auswirkung auf Bestand oder FIFO.<br><b>Neu</b>: reserviert alle angeforderten Einheiten.<br><b>In Bearbeitung</b>: hält die Reservierung aufrecht.<br><b>Abgeschlossen</b>: speichert das Abschlussdatum, reduziert den physischen Bestand und verbraucht FIFO.<br><b>Storniert</b>: gibt die Reservierung frei.</html>
With\ insufficient\ available\ stock,\ the\ order\ can\ only\ be\ saved\ as\ Reservation.\ Reservation\ does\ not\ change\ stock,\ reserved\ quantities,\ lots\ or\ FIFO.=Bei unzureichender Verfügbarkeit kann der Auftrag nur als Reservierung gespeichert werden. Reservierung verändert weder Bestand noch reservierte Mengen, Lose oder FIFO.

