Its\ current\ purchase\ price\ ({0})\ will\ become\ the\ default\ purchase\ price\ proposed\ for\ this\ product\ in\ new\ supplier\ orders.=Der aktuelle Einkaufspreis ({0}) wird zum standardmäßig vorgeschlagenen Einkaufspreis für dieses Produkt in neuen Lieferantenbestellungen.
The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ will\ not\ be\ changed.=Der Verkaufspreis des Produkts und historische FIFO-Kosten werden nicht geändert.
