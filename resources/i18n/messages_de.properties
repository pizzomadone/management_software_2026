*\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Verkäufe ohne rekonstruierbare historische Kosten werden aus der Berechnung historischer Kosten und des Bruttogewinns ausgeschlossen.
