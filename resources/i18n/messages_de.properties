Only\ completed\ supplier\ orders\ can\ have\ a\ new\ return.=Neue Rückgaben sind nur für abgeschlossene Lieferantenbestellungen möglich.
Supplier\ return\ quantity\ exceeds\ the\ original\ FIFO\ lot\ availability.=Die Rückgabemenge überschreitet den verfügbaren Bestand des ursprünglichen FIFO-Loses.
Not\ enough\ unreserved\ stock\ for\ this\ supplier\ return.=Nicht reservierter Bestand reicht für diese Rückgabe nicht aus.
This\ supplier\ return\ was\ already\ reversed\ or\ does\ not\ exist.=Diese Rückgabe wurde bereits storniert oder existiert nicht.
Supplier\ order\ has\ historical\ stock\ movements\ and\ cannot\ be\ deleted.=Die Lieferantenbestellung enthält historische Lagerbewegungen und kann nicht gelöscht werden.
Return\ lines\ must\ have\ distinct\ products\ and\ positive\ quantities.=Rückgabezeilen müssen eindeutig sein und positive Mengen enthalten.
Supplier\ return\ FIFO\ history\ is\ incomplete.=Die FIFO-Historie der Rückgabe ist unvollständig.
Cannot\ restore\ the\ original\ FIFO\ lot.=Das ursprüngliche FIFO-Los kann nicht wiederhergestellt werden.
Cannot\ restore\ product\ stock.=Der Produktbestand kann nicht wiederhergestellt werden.
Return\ value\ is\ based\ on\ purchase\ prices;\ no\ refund\ is\ recorded.=Der Rückgabewert basiert auf Einkaufspreisen; es wird keine Erstattung erfasst.
Modify\ Invoice=Rechnung bearbeiten
Cannot\ delete\ this\ supplier\:\ recorded\ returns,\ including\ reversed\ returns,\ must\ remain\ in\ history.=Lieferant kann nicht gelöscht werden: Erfasste Rückgaben, auch stornierte, müssen in der Historie erhalten bleiben.
Cannot\ delete\ this\ supplier\:\ purchased\ goods\ have\ already\ been\ sold\ or\ moved\ and\ have\ FIFO\ history.=Lieferant kann nicht gelöscht werden: Gekaufte Waren wurden bereits verkauft oder bewegt und besitzen einen FIFO-Verlauf.
Cannot\ delete\ this\ supplier\:\ completed\ purchases\ have\ missing\ or\ depleted\ original\ FIFO\ lots.=Lieferant kann nicht gelöscht werden: Für abgeschlossene Einkäufe fehlen ursprüngliche FIFO-Lose oder sie wurden bereits verbraucht.
Cannot\ delete\ this\ supplier\:\ historical\ FIFO\ lots\ still\ reference\ this\ supplier.=Lieferant kann nicht gelöscht werden: Historische FIFO-Lose verweisen noch auf diesen Lieferanten.
Cannot\ reduce\ stock\ to\ {0}\ units\ because\ {1}\ units\ are\ reserved.=Der Bestand kann nicht auf {0} Einheiten reduziert werden, da {1} Einheiten reserviert sind.
Choose\ the\ invoice\ date\ independently\ of\ the\ order\ before\ issuing.=Wählen Sie vor der Ausstellung das Rechnungsdatum unabhängig vom Auftragsdatum.
