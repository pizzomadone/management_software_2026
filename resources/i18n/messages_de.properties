Supplier\ return\ requires\ all\ received\ goods\ to\ be\ available\ in\ their\ original\ FIFO\ lots.=Für die Retoure muss die gesamte erhaltene Ware in ihren ursprünglichen FIFO-Losen verfügbar sein.
Supplier\ return\ requires\ a\ complete\ FIFO\ receipt\ history.=Die Retoure erfordert eine vollständige FIFO-Wareneingangshistorie.
