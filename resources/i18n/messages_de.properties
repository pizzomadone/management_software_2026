tooltip.kpi.warehouseValue=<html><table width='300'><tr><td><b>Formel: Summe je Produkt aus max(physischem Bestand, 0) × aktuellem Stückpreis des bevorzugten Lieferanten, je Produkt gerundet.</b><br>Aktive/inaktive Produkte und reservierte Einheiten enthalten; negative Bestände ausgeschlossen. Keine historischen FIFO-Kosten. Fehlende oder null Kosten werden mit 0 angesetzt und durch * markiert.</td></tr></table></html>
tooltip.kpi.warehouseSaleValue=<html><table width='300'><tr><td><b>Formel: Summe je Produkt aus max(physischem Bestand, 0) × aktuellem Nettoverkaufspreis pro Stück, je Produkt gerundet.</b><br>Aktive/inaktive Produkte und Reservierungen enthalten; negative Bestände ausgeschlossen. Potenzieller Verkaufswert, kein erzielter Umsatz.</td></tr></table></html>
tooltip.kpi.zeroStock=<html><table width='300'><tr><td><b>Zählt aktive Produkte mit verfügbarem Bestand ≤ 0.</b><br>Verfügbar = physischer Bestand − reservierte Menge. Enthält Null-/Negativbestände und vollständig reservierte Artikel; kein Mindestbestand erforderlich.</td></tr></table></html>
tooltip.kpi.monthRevenue=<html><table width='300'><tr><td><b>Summe der Nettobeträge abgeschlossener Kundenaufträge im aktuellen lokalen Kalendermonat.</b><br>Maßgeblich ist das Abschlussdatum, bei fehlendem Datum in Altdaten das Auftragsdatum. Stornierte/rückgängig gemachte und offene Aufträge ausgeschlossen. Rechnungen/Zahlungen ändern den Wert nicht.</td></tr></table></html>
tooltip.kpi.monthInvoiced=<html><table width='300'><tr><td><b>Summe der Nettobeträge ausgestellter Rechnungen mit Rechnungsdatum im aktuellen lokalen Kalendermonat.</b><br>Entwürfe/stornierte Rechnungen ausgeschlossen; unabhängig von Zahlungen. Verschiedene Währungen getrennt, ohne Umrechnung. Nicht zum Auftragsumsatz addieren: beide können denselben Verkauf enthalten.</td></tr></table></html>
tooltip.kpi.pendingOrders=<html><table width='300'><tr><td><b>Zählt Kundenaufträge mit Status Reservierung, Neu oder In Bearbeitung.</b><br>Alle Daten; Abgeschlossen, Storniert und Rückgängig ausgeschlossen. Anzahl der Aufträge, nicht Stückzahlen oder offene Beträge.</td></tr></table></html>
tooltip.kpi.avgMargin=<html><table width='300'><tr><td><b>Formel: 100 × (Nettoverkaufswert des Bestands − Wert zum bevorzugten Lieferantenpreis) ÷ Nettoverkaufswert.</b><br>Berechnung aus Gesamtwerten, nicht Durchschnitt einzelner Margen. Eine Nachkommastelle; — bei Verkaufswert 0. Potenzielle Marge, kein realisierter Gewinn; * für fehlende Kosten.</td></tr></table></html>

