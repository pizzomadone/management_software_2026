A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.\\n\\nThe\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.\\n\\nWhen\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.\\n\\nDouble-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Ein Produkt kann mehrere Lieferanten haben, aber nur einen bevorzugten Lieferanten.\n\nDer hier angezeigte Einkaufspreis ist der aktuelle Referenzpreis des Lieferanten. Er wird in neuen Lieferantenbestellungen automatisch vorgeschlagen und kann dort weiterhin geändert werden, zum Beispiel für Rabatte oder ausgehandelte Preise.\n\nWenn Sie einen anderen Lieferanten als bevorzugt festlegen, wird dessen Einkaufspreis zum standardmäßig vorgeschlagenen Einkaufspreis für dieses Produkt. Der Verkaufspreis des Produkts und historische FIFO-Kosten werden nicht geändert.\n\nDoppelklicken Sie auf eine Zeile, um die Lieferantenbeziehung zu bearbeiten.
