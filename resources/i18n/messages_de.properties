Purchase\ price\:\ the\ supplier's\ current\ reference\ purchase\ price.\ It\ is\ proposed\ in\ new\ supplier\ orders\ and\ can\ be\ changed\ in\ the\ order.=Einkaufspreis: der aktuelle Referenz-Einkaufspreis dieses Lieferanten. Er wird bei neuen Lieferantenbestellungen vorgeschlagen und kann in der Bestellung geändert werden.

Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ product's\ default\ purchase\ price;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Bevorzugt: legt diesen Lieferanten als bevorzugten Lieferanten des Produkts fest. Sein Einkaufspreis wird zum Standard-Einkaufspreis des Produkts; historische FIFO-Kosten und der Verkaufspreis bleiben unverändert.

