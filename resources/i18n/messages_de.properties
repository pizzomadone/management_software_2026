tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Summe aus positivem Bestand x Einkaufskosten.</b><br>Standardkostenmethode: Verwendet die in jedem Produktdatensatz eingetragenen Einkaufskosten. Nur aktive Produkte; jeden Produktwert vor der Summe auf 2 Dezimalstellen runden. Reservierte Einheiten bleiben enthalten. Nullkosten tragen null bei; negative Bestände werden ausgeschlossen und separat angezeigt.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Summe aus positivem Bestand x Katalogverkaufspreis.</b><br>Nur aktive Produkte; jeden Produktwert vor der Summe auf 2 Dezimalstellen runden. Reservierte Einheiten bleiben enthalten; negative Bestände werden ausgeschlossen. Dies ist der potenzielle Verkaufswert des aktuellen Bestands, kein bereits erzielter Umsatz.</div></html>
tooltip.kpi.lowStock=<html><div style='width: 260px'><b>Zählt Produkte unter dem Mindestbestand oder mit negativem Bestand.</b><br>Nur aktive Produkte. Jedes Produkt zählt einmal, wenn der Bestand unter dem Mindestbestand liegt (sofern dieser größer als null ist) oder wenn der Bestand negativ ist. Zählt Produkte, keine Einheiten. Reservierte Mengen werden nicht abgezogen.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Zählt Produkte mit Bestand kleiner oder gleich null.</b><br>Nur aktive Produkte; negative Bestände sind enthalten. Zählt Produkte, keine fehlenden Einheiten. Reservierte Mengen werden nicht abgezogen.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Summe abgeschlossener Kundenaufträge, ohne MwSt.</b><br>Maßgeblich ist das Auftragsdatum im aktuellen Kalendermonat, in der lokalen Zeitzone. Neue, laufende und stornierte Aufträge sind ausgeschlossen. Rechnungen und Zahlungen werden nicht addiert. Manuelle Lagerbewegungen zählen nicht als Verkäufe.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Summe der Rechnungsbeträge vor Mehrwertsteuer.</b><br>Enthält ausgestellte und bezahlte Rechnungen mit Datum im aktuellen Kalendermonat, in der lokalen Zeitzone. Entwürfe und stornierte Rechnungen sind ausgeschlossen. Jede Rechnung zählt unabhängig von ihrer Bezahlung einmal. Kundenaufträge werden nicht addiert.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Zählt neue oder laufende Kundenaufträge.</b><br>Über alle Datumsbereiche. Abgeschlossene und stornierte Aufträge sind ausgeschlossen. Zählt Aufträge, keine Produktmengen oder Geldbeträge.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (Lagerverkaufswert - Lagerwert zu Standardkosten) / Lagerverkaufswert.</b><br>Verwendet die beiden angezeigten Lagerwerte: Produkte werden nach ihrem Verkaufswert gewichtet. Bei Verkaufswert null ist die Marge nicht verfügbar. Dies ist eine potenzielle Marge des aktuellen Bestands, kein historischer Verkaufsgewinn. Einkaufskosten von null setzen einen kostenlosen Erwerb voraus.</div></html>

