The\ original\ sale\ will\ remain\ in\ history\ as\ reversed.\ Stock\ will\ be\ returned\ to\ the\ exact\ FIFO\ lots\ originally\ used.=Der ursprüngliche Verkauf bleibt als storniert in der Historie. Der Bestand wird exakt in die ursprünglich verwendeten FIFO-Lose zurückgeführt.
