Delete\ all\:\ supplier\ orders\ and\ product\ associations\ are\ permanently\ deleted;\ stock\ received\ from\ completed\ orders\ is\ reversed\ and\ related\ movements\ are\ deleted.=Alles löschen: Lieferantenbestellungen und Produktzuordnungen werden dauerhaft gelöscht; Bestand aus abgeschlossenen Bestellungen wird zurückgebucht und zugehörige Bewegungen werden gelöscht.
