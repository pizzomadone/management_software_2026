Each\ stock\ entry\ creates\ a\ FIFO\ lot\ with\ its\ own\ quantity\ and\ unit\ cost.=Jeder Zugang erzeugt ein FIFO-Los mit Menge und Stückkosten.
When\ stock\ leaves\ the\ warehouse,\ WareStat\ consumes\ the\ oldest\ available\ lot\ first.=Abgänge verbrauchen zuerst das älteste verfügbare Los.
Initial\ Qty\ is\ the\ quantity\ received;\ Remaining\ Qty\ is\ what\ is\ still\ available\ in\ that\ lot.=Anfangsmenge = erhaltene Menge; Restmenge = noch verfügbare Menge.
Example\:=Beispiel:
5\ units\ at\ cost\ 5.00,\ then\ 5\ units\ at\ cost\ 10.00.\ If\ 7\ units\ are\ sold,\ FIFO\ uses\ all\ 5\ units\ from\ the\ first\ lot\ and\ 2\ from\ the\ second\:\ historical\ cost\ \=\ 45.00.\ The\ second\ lot\ keeps\ 3\ units\ at\ cost\ 10.00.=5 zu 5,00 und 5 zu 10,00 kaufen; 7 verkaufen → FIFO-Kosten 45,00, 3 Stück zu 10,00 bleiben.
