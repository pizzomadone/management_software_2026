Current\ purchase\ price\ from\ the\ preferred\ supplier.\ It\ is\ used\ as\ the\ default\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order.=Aktueller Einkaufspreis des bevorzugten Lieferanten. Er wird in neuen Lieferantenbestellungen als Standardwert verwendet und kann in der Bestellung weiterhin geändert werden.
