Sale\ reversed\ successfully.\ Stock\ and\ FIFO\ layers\ were\ restored\ while\ the\ original\ sale\ was\ kept\ in\ history.=Verkauf erfolgreich storniert. Bestand und FIFO-Lose wurden wiederhergestellt, während der ursprüngliche Verkauf in der Historie erhalten bleibt.
