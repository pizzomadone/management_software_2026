Completed\ or\ reversed\ customer\ sales\ cannot\ be\ deleted.\ Reverse\ completed\ sales\ instead.=Abgeschlossene oder stornierte Kundenverkäufe können nicht gelöscht werden. Abgeschlossene Verkäufe müssen storniert werden.
