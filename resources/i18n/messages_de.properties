Import\ completed\:\ {0}\ product(s)\ without\ purchase\ cost,\ {1}\ sale(s)\ with\ historical\ cost\ that\ cannot\ be\ reconstructed,\ {2}\ completed\ sale(s)\ without\ reconstructable\ FIFO\ history.=Import abgeschlossen: {0} Produkt(e) ohne Einkaufskosten, {1} Verkauf/Verkäufe mit nicht rekonstruierbaren historischen Kosten, {2} abgeschlossene(r) Verkauf/Verkäufe ohne rekonstruierbare FIFO-Historie.
Completed\ sales\ without\ reconstructable\ FIFO\ history\ remain\ visible\ but\ cannot\ be\ reopened\ or\ reversed\ automatically\ because\ the\ original\ lots\ cannot\ be\ determined\ safely.=Abgeschlossene Verkäufe ohne rekonstruierbare FIFO-Historie bleiben sichtbar, können aber nicht automatisch wieder geöffnet oder storniert werden, da die ursprünglichen Lose nicht sicher bestimmt werden können.
This\ sale\ has\ been\ reversed\ and\ is\ kept\ as\ historical\ data;\ the\ order\ cannot\ be\ modified.=Dieser Verkauf wurde storniert und bleibt als historischer Datensatz erhalten; der Auftrag kann nicht geändert werden.
This\ order\ cannot\ be\ modified\ because\ it\ has\ a\ linked\ invoice.\ Payment\ can\ still\ be\ updated.\ To\ reverse\ the\ sale,\ delete\ a\ draft\ invoice\ or\ cancel\ an\ issued\ invoice\ first,\ then\ use\ Reverse\ Sale.=Dieser Auftrag kann nicht geändert werden, weil eine Rechnung verknüpft ist. Die Zahlung kann weiterhin aktualisiert werden. Zum Stornieren des Verkaufs zuerst eine Entwurfsrechnung löschen oder eine ausgestellte Rechnung stornieren und danach Verkauf stornieren verwenden.
This\ completed\ order\ is\ locked\ to\ protect\ stock\ and\ FIFO\ history.\ Payment\ can\ be\ updated,\ or\ it\ can\ be\ returned\ to\ In\ Progress\ if\ completion\ was\ a\ mistake.=Dieser abgeschlossene Auftrag ist zum Schutz von Bestand und FIFO-Historie gesperrt. Die Zahlung kann aktualisiert oder der Auftrag bei versehentlichem Abschluss auf In Bearbeitung zurückgesetzt werden.
Reversed\ order\:\ it\ cannot\ be\ modified.=Stornierter Auftrag: nicht änderbar.
Order\ locked\:\ linked\ invoice.\ Only\ payment\ can\ be\ changed.\ To\ reverse\ the\ sale,\ remove\ or\ cancel\ the\ invoice\ first.=Auftrag gesperrt: Rechnung verknüpft. Nur die Zahlung ist änderbar. Zum Stornieren zuerst die Rechnung entfernen oder stornieren.
Completed\ order\:\ only\ payment\ can\ be\ changed,\ or\ the\ order\ can\ be\ returned\ to\ In\ Progress.=Abgeschlossener Auftrag: nur Zahlung änderbar oder auf In Bearbeitung zurücksetzen.
Order\ locked\:\ linked\ invoice.\ Only\ payment\ can\ be\ changed.\ To\ reverse\ the\ sale,\ delete\ the\ invoice\ if\ it\ is\ a\ draft,\ or\ cancel\ it\ if\ it\ has\ been\ issued.=Auftrag gesperrt: Rechnung verknüpft. Nur die Zahlung ist änderbar. Zum Stornieren die Rechnung löschen, wenn sie ein Entwurf ist, oder stornieren, wenn sie bereits ausgestellt wurde.
Order\ Cannot\ Be\ Changed=Auftrag nicht änderbar
Delete\ the\ draft\ invoice\ first.=Löschen Sie zuerst die Entwurfsrechnung.
Only\ a\ completed\ sale\ can\ be\ reversed\ while\ linked\ to\ a\ canceled\ invoice.=Nur ein abgeschlossener Verkauf kann mit einer verknüpften stornierten Rechnung storniert werden.
Cancel\ the\ issued\ invoice\ first.=Stornieren Sie zuerst die ausgestellte Rechnung.
Order\ cannot\ be\ reversed\ because\ invoice\ {0}\ is\ linked\ to\ it.\ {1}=Der Auftrag kann nicht storniert werden, weil die Rechnung {0} damit verknüpft ist. {1}
Order\ cannot\ be\ deleted\ because\ invoice\ {0}\ is\ linked\ to\ it.\ {1}=Der Auftrag kann nicht gelöscht werden, weil die Rechnung {0} damit verknüpft ist. {1}
This\ older\ database\ does\ not\ record\ its\ currency.\ Select\ its\ ORIGINAL\ currency.\ Amounts\ will\ not\ be\ converted.=Diese ältere Datenbank speichert ihre Währung nicht. Wählen Sie die URSPRÜNGLICHE Währung. Beträge werden nicht umgerechnet.
