Completed\ or\ reversed\ sales\ cannot\ be\ modified.\ Use\ the\ reversal\ function\ for\ a\ completed\ sale\ so\ FIFO\ history\ is\ preserved.=Las ventas completadas o revertidas no pueden modificarse. Usa la reversión de una venta completada para conservar el historial FIFO.
