# Supplier receipt validation
Purchase\ price\ must\ be\ greater\ than\ zero=El precio de compra debe ser mayor que cero
Supplier\ receipt\ date\ is\ required=La fecha de recepción del pedido al proveedor es obligatoria
Every\ product\ must\ have\ a\ supplier,\ a\ positive\ quantity\ and\ a\ purchase\ price\ greater\ than\ zero.\ Check\:\ {0}=Cada producto debe tener un proveedor, una cantidad positiva y un precio de compra mayor que cero. Compruebe: {0}
Preferred\ Supplier\ Cost=Coste del proveedor preferido
Click\ to\ edit\ the\ preferred\ supplier\ cost.=Haz clic para modificar el coste del proveedor preferido.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.\ Click\ the\ value\ to\ edit\ it.=El coste del proveedor preferido es el coste de compra actual guardado para ese proveedor. Haz clic en el valor para modificarlo.
When\ a\ supplier\ order\ is\ received,\ its\ actual\ unit\ purchase\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ that\ supplier's\ current\ cost.=Al recibir un pedido de proveedor, su precio unitario de compra real se convierte en el coste del lote FIFO y actualiza el coste actual de ese proveedor.
Last\ purchase\ cost\ is\ the\ unit\ cost\ of\ the\ most\ recently\ received\ supplier\ purchase.\ It\ is\ updated\ automatically\ and\ cannot\ be\ edited\ here.=El último coste de compra es el coste unitario de la compra a proveedor recibida más recientemente. Se actualiza automáticamente y no puede modificarse aquí.
Historical\ FIFO\ lots\ and\ completed\ sales\ keep\ the\ costs\ recorded\ when\ they\ were\ created.=Los lotes FIFO históricos y las ventas completadas conservan los costes registrados cuando se crearon.
Purchase\ Cost\ Help=Ayuda sobre costes de compra
Purchase\ price\:\ the\ supplier's\ current\ purchase\ cost\ for\ this\ product.\ It\ is\ proposed\ in\ new\ supplier\ orders.=Precio de compra: el coste de compra actual de este producto con el proveedor. Se propone en los nuevos pedidos a proveedores.
If\ the\ actual\ unit\ price\ is\ changed\ in\ a\ supplier\ order,\ the\ price\ used\ when\ the\ order\ is\ received\ becomes\ the\ FIFO\ lot\ cost\ and\ updates\ this\ supplier\ cost.=Si se cambia el precio unitario real en un pedido a proveedor, el precio usado al recibirlo se convierte en el coste del lote FIFO y actualiza el coste de este proveedor.
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferido: establece este proveedor como preferido para el producto. Su precio de compra pasa a ser el precio predeterminado propuesto en nuevos pedidos a proveedores; los costes FIFO históricos y el precio de venta no cambian.
The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ purchase\ cost\ and\ is\ proposed\ automatically\ in\ new\ supplier\ orders.=El precio de compra mostrado aquí es el coste de compra actual del proveedor y se propone automáticamente en nuevos pedidos a proveedores.
When\ an\ order\ is\ received,\ its\ actual\ unit\ price\ becomes\ the\ FIFO\ lot\ cost\ and\ also\ becomes\ the\ current\ cost\ saved\ for\ that\ supplier.=Al recibir un pedido, su precio unitario real se convierte en el coste del lote FIFO y también en el coste actual guardado para ese proveedor.
Preferred\ supplier\ cost\ is\ the\ current\ purchase\ cost\ saved\ for\ the\ preferred\ supplier.=El coste del proveedor preferido es el coste de compra actual guardado para el proveedor preferido.
The\ completed\ customer\ order\ cannot\ be\ created\ because\ stock\ cannot\ go\ below\ zero.\ Reduce\ the\ quantities\ or\ save\ the\ invoice\ without\ creating\ the\ order.=No se puede crear el pedido de cliente completado porque el stock no puede quedar por debajo de cero. Reduce las cantidades o guarda la factura sin crear el pedido.

Payment\ Status\:=Estado del pago:
Paid\ Amount\:=Importe pagado:
Paid\ Amount\ *\:=Importe pagado *:
Update\ Payment=Actualizar pago
Payment\ can\ be\ updated\ separately\ only\ for\ completed\ customer\ orders.=El pago solo puede actualizarse por separado para pedidos de cliente completados.
Partial\ paid\ amount\ must\ be\ greater\ than\ zero\ and\ less\ than\ the\ total.=El importe del pago parcial debe ser mayor que cero y menor que el total.
Invalid\ Payment=Pago no válido
Error\ while\ updating\ payment=Error al actualizar el pago
Payment\ is\ managed\ by\ the\ linked\ customer\ order\ and\ is\ read-only\ here.=El pago se gestiona desde el pedido de cliente vinculado y aquí es de solo lectura.
Invoice\ linked\ to\ a\ customer\ order\:\ document\ content\ is\ locked\ and\ payment\ is\ managed\ from\ the\ order.=Factura vinculada a un pedido de cliente: el contenido del documento está bloqueado y el pago se gestiona desde el pedido.
Historical\ invoice\ in\ a\ different\ currency\:\ only\ status\ and\ payment\ can\ be\ changed.=Factura histórica en una moneda diferente: solo se pueden cambiar el estado y el pago.
Finalized\ invoice\:\ only\ status\ and\ payment\ can\ be\ changed.=Factura finalizada: solo se pueden cambiar el estado y el pago.
This\ invoice\ is\ linked\ to\ a\ customer\ order.\ Products,\ quantities,\ customer\ and\ date\ cannot\ be\ changed.\ Payment\ is\ managed\ from\ the\ order.=Esta factura está vinculada a un pedido de cliente. Los productos, cantidades, cliente y fecha no se pueden modificar. El pago se gestiona desde el pedido.
This\ historical\ invoice\ uses\ {OLD}.\ The\ current\ operating\ currency\ is\ {NEW}.\ Only\ status\ and\ payment\ can\ be\ changed.=Esta factura histórica usa {OLD}. La moneda operativa actual es {NEW}. Solo se pueden cambiar el estado y el pago.
Issued\ and\ Canceled\ invoices\ are\ historical\ documents.\ Only\ status\ and\ payment\ can\ be\ changed.=Las facturas emitidas y canceladas son documentos históricos. Solo se pueden cambiar el estado y el pago.
Sale\ Price\ incl.\ VAT=Precio de venta IVA incluido
Customer\ sale\ price\ incl.\ VAT=Precio de venta al cliente IVA incluido
Unit\ Price\ incl.\ VAT=Precio unitario IVA incluido
Total\ incl.\ VAT=Total IVA incluido
Unit\ price\ excl.\ VAT=Precio unitario IVA excluido
Total\ excl.\ VAT=Total IVA excluido
Stock\ at\ net\ sale\ price=Stock al precio de venta neto

{0}\ net\ +\ {1}\ VAT={0} neto + {1} IVA
Estimated\ margin\:\ {0}\ ({1}/unit)=Margen estimado: {0} ({1}/unidad)
Margin\ unavailable\:\ enter\ a\ purchase\ cost.=Margen no disponible: introduce el coste.
Margin\ unavailable\:\ purchase\ cost\ missing.=Margen no disponible: falta el coste.
Margin\ unavailable\:\ net\ sale\ price\ is\ zero.=Margen no disponible: precio neto cero.
Estimated\ margin\ \=\ (net\ sale\ price\ -\ purchase\ cost)\ /\ net\ sale\ price.\ Other\ expenses\ are\ excluded.=Margen estimado = (precio de venta neto - coste de compra) / precio de venta neto. Otros gastos excluidos.
Estimate\ based\ on\ the\ last\ actual\ purchase\ cost.\ Margin\ \=\ (net\ sale\ price\ -\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Estimación basada en el último coste de compra real. Margen = (precio neto - coste) / precio neto. El beneficio real de la venta usa FIFO; otros gastos excluidos.

Stock\ at\ preferred\ supplier\ cost=Stock: coste proveedor preferido
In-stock\ products\ with\ missing\ preferred\ supplier\ cost=Productos en stock sin coste del proveedor preferido
*\ Some\ in-stock\ products\ have\ no\ preferred\ supplier\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Algunos productos en stock no tienen coste del proveedor preferido; el valor del stock a coste y el margen potencial están incompletos.
Estimated\ Margin=Margen estimado
Estimated\ margin\ \=\ (net\ sale\ price\ -\ preferred\ supplier\ cost)\ /\ net\ sale\ price.\ Actual\ sale\ profit\ uses\ FIFO;\ other\ expenses\ are\ excluded.=Margen estimado = (precio de venta neto - coste del proveedor preferido) / precio de venta neto. El beneficio real de las ventas usa FIFO; se excluyen otros gastos.
Margin\ unavailable\:\ preferred\ supplier\ cost\ missing.=Margen no disponible: falta el coste del proveedor preferido.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ the\ current\ preferred\ supplier\ cost.\ Reserved\ units\ remain\ included.=Solo los productos activos con stock físico positivo se valoran al coste actual del proveedor preferido. Las unidades reservadas siguen incluidas.

Positive\ physical\ stock\ is\ valued\ at\ the\ current\ preferred\ supplier\ cost,\ including\ inactive\ products\ that\ still\ remain\ in\ stock.\ Reserved\ units\ remain\ included.=El stock físico positivo se valora al coste actual del proveedor preferido, incluidos los productos inactivos que todavía permanecen en almacén. Las unidades reservadas siguen incluidas.

Insufficient\ stock\ for\ the\ following\ products\:=Stock insuficiente para los siguientes productos:
The\ order\ cannot\ reserve\ more\ units\ than\ are\ currently\ available.\ Reduce\ the\ quantities\ or\ replenish\ stock.=El pedido no puede reservar más unidades de las disponibles actualmente. Reduzca las cantidades o reponga el stock.

Reservation\ does\ not\ affect\ stock.\ In\ Progress\ reserves\ available\ stock.\ Completed\ decreases\ physical\ stock\ and\ applies\ FIFO.=Reserva no modifica el stock. En proceso reserva el stock disponible. Completado reduce el stock físico y aplica FIFO.

