tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Suma de stock positivo x coste de compra.</b><br>Método del coste estándar: usa el coste de compra indicado en la ficha de cada producto. Solo productos activos; redondea cada producto a 2 decimales antes de sumar. Las unidades reservadas siguen incluidas. Los costes cero aportan cero; el stock negativo se excluye y se señala por separado.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Suma de stock positivo x precio de venta del catálogo.</b><br>Solo productos activos; redondea cada producto a 2 decimales antes de sumar. Las unidades reservadas siguen incluidas; se excluye el stock negativo. Es el valor potencial de venta de las existencias actuales, no un ingreso ya obtenido.</div></html>
tooltip.kpi.lowStock=<html><div style='width: 260px'><b>Cuenta productos bajo el stock mínimo o con stock negativo.</b><br>Solo productos activos. Cuenta cada producto una vez si su stock es inferior al mínimo (cuando el mínimo es mayor que cero), o si el stock es negativo. Cuenta productos, no unidades. No resta las cantidades reservadas.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Cuenta productos con stock menor o igual a cero.</b><br>Solo productos activos; incluye los saldos negativos. Cuenta productos, no unidades faltantes. No resta las cantidades reservadas.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Suma de totales de pedidos de clientes completados, sin IVA.</b><br>Usa la fecha del pedido dentro del mes natural actual, en la zona horaria local. Excluye pedidos nuevos, en curso y cancelados. No suma facturas ni pagos. Los movimientos manuales de almacén no cuentan como ventas.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Suma de bases imponibles de las facturas, antes del IVA.</b><br>Incluye facturas emitidas y pagadas con fecha en el mes natural actual, en la zona horaria local. Excluye borradores y facturas canceladas. Cada factura cuenta una vez, independientemente del pago. No suma pedidos de clientes.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Cuenta pedidos de clientes nuevos o en curso.</b><br>Considera todas las fechas. Excluye pedidos completados y cancelados. Cuenta pedidos, no cantidades de productos ni importes.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (valor de venta del stock - valor al coste estándar) / valor de venta del stock.</b><br>Usa los dos valores de stock mostrados en el panel: cada producto se pondera por su valor de venta. Si el valor de venta es cero, el margen no está disponible. Es un margen potencial del stock actual, no el beneficio histórico de las ventas. Un coste de compra cero supone una compra gratuita.</div></html>

