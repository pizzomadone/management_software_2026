Order\ locked\:\ linked\ invoice.\ Only\ payment\ can\ be\ changed.\ To\ reverse\ the\ sale,\ delete\ the\ invoice\ if\ it\ is\ a\ draft,\ or\ cancel\ it\ if\ it\ has\ been\ issued.=Pedido bloqueado: factura vinculada. Solo puede modificarse el pago. Para revertir la venta, elimina la factura si está en borrador o cancélala si ya fue emitida.
