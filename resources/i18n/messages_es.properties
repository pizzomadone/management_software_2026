A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.\\n\\nThe\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.\\n\\nWhen\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.\\n\\nDouble-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Un producto puede tener varios proveedores, pero solo uno preferido.\n\nEl precio de compra mostrado aquí es el precio de referencia actual del proveedor. Se propone automáticamente en los nuevos pedidos a proveedores y puede modificarse en el pedido, por ejemplo para descuentos o precios negociados.\n\nAl establecer otro proveedor como preferido, su precio de compra pasa a ser el precio de compra predeterminado propuesto para este producto. El precio de venta del producto y los costes FIFO históricos no cambian.\n\nHaz doble clic en una fila para modificar la relación con el proveedor.
