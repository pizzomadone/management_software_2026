This\ order\ cannot\ be\ modified\ because\ it\ has\ a\ linked\ invoice.\ Payment\ can\ still\ be\ updated.\ To\ reverse\ the\ sale,\ delete\ a\ draft\ invoice\ or\ cancel\ an\ issued\ invoice\ first,\ then\ use\ Reverse\ Sale.=Este pedido no puede modificarse porque tiene una factura vinculada. El pago sí puede actualizarse. Para revertir la venta, elimina primero una factura en borrador o cancela una factura emitida y después usa Revertir venta.
This\ completed\ order\ is\ locked\ to\ protect\ stock\ and\ FIFO\ history.\ Payment\ can\ be\ updated,\ or\ it\ can\ be\ returned\ to\ In\ Progress\ if\ completion\ was\ a\ mistake.=Este pedido completado está bloqueado para proteger el stock y el historial FIFO. El pago puede actualizarse o el pedido puede volver a En curso si se completó por error.
