tooltip.kpi.warehouseValue=<html><table width='300'><tr><td><b>Fórmula: suma por producto de máx(unidades físicas, 0) × coste unitario actual del proveedor preferido, redondeado por producto.</b><br>Incluye productos activos e inactivos y unidades reservadas; excluye existencias negativas. No emplea costes FIFO históricos. Los costes ausentes o cero se tratan como cero y se señalan con *.</td></tr></table></html>
tooltip.kpi.warehouseSaleValue=<html><table width='300'><tr><td><b>Fórmula: suma por producto de máx(unidades físicas, 0) × precio unitario actual sin IVA, redondeado por producto.</b><br>Incluye productos activos e inactivos y unidades reservadas; excluye existencias negativas. Es valor potencial, no ingresos realizados.</td></tr></table></html>
tooltip.kpi.zeroStock=<html><table width='300'><tr><td><b>Cuenta productos activos con disponibilidad ≤ 0.</b><br>Disponibilidad = existencias físicas − unidades reservadas. Incluye existencias físicas nulas/negativas y unidades totalmente reservadas; no exige mínimo configurado.</td></tr></table></html>
tooltip.kpi.monthRevenue=<html><table width='300'><tr><td><b>Suma de importes sin IVA de pedidos de clientes Completados durante el mes calendario local actual.</b><br>Utiliza la fecha de finalización; si falta en registros antiguos, la del pedido. Excluye pedidos revertidos y pendientes. Las facturas y pagos no alteran este total.</td></tr></table></html>
tooltip.kpi.monthInvoiced=<html><table width='300'><tr><td><b>Suma de bases imponibles sin IVA de facturas Emitidas fechadas en el mes calendario local actual.</b><br>Excluye borradores y facturas canceladas; no depende del pago. Muestra monedas diferentes por separado, sin conversión. No sumarlo a las ventas: una transacción puede aparecer en ambos.</td></tr></table></html>
tooltip.kpi.pendingOrders=<html><table width='300'><tr><td><b>Cuenta pedidos de clientes en Reserva, Nuevo o En proceso.</b><br>Incluye todas las fechas y excluye Completado, Cancelado y Revertido. Cuenta pedidos, no unidades ni importes pendientes.</td></tr></table></html>
tooltip.kpi.avgMargin=<html><table width='300'><tr><td><b>Fórmula: 100 × (valor neto de venta del stock − valor al coste del proveedor preferido) ÷ valor neto de venta.</b><br>Usa valores totales, no la media de márgenes por producto. Una cifra decimal; — si el valor de venta es cero. Es margen potencial, no beneficio realizado; * marca costes ausentes.</td></tr></table></html>

