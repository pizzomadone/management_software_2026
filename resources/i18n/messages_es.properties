tooltip.order.statusFlow=<html><b>Reserva</b>: solo comercial; sin efecto sobre stock ni FIFO.<br><b>Nuevo</b>: reserva todas las unidades solicitadas.<br><b>En proceso</b>: mantiene la reserva.<br><b>Completado</b>: registra la fecha de finalización, reduce el stock físico y consume FIFO.<br><b>Cancelado</b>: libera cualquier reserva.</html>
