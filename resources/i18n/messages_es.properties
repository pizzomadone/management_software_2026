Delete\ the\ selected\ product.=Eliminar el producto seleccionado.
Reload\ the\ product\ list.=Recargar la lista de productos.
Each\ stock\ entry\ creates\ a\ FIFO\ lot\ with\ its\ own\ quantity\ and\ unit\ cost.=Cada entrada crea un lote FIFO con cantidad y coste unitario.
When\ stock\ leaves\ the\ warehouse,\ WareStat\ consumes\ the\ oldest\ available\ lot\ first.=Las salidas consumen primero el lote disponible más antiguo.
Initial\ Qty\ is\ the\ quantity\ received;\ Remaining\ Qty\ is\ what\ is\ still\ available\ in\ that\ lot.=Cant. inicial = cantidad recibida; Cant. restante = cantidad aún disponible.
Example\:=Ejemplo:
5\ units\ at\ cost\ 5.00,\ then\ 5\ units\ at\ cost\ 10.00.\ If\ 7\ units\ are\ sold,\ FIFO\ uses\ all\ 5\ units\ from\ the\ first\ lot\ and\ 2\ from\ the\ second\:\ historical\ cost\ \=\ 45.00.\ The\ second\ lot\ keeps\ 3\ units\ at\ cost\ 10.00.=Compras 5 a 5,00 y 5 a 10,00; vendes 7 → coste FIFO 45,00 y quedan 3 unidades a 10,00.
FIFO\ Lots\ Help=Lotes FIFO
New\ preferred\ supplier\:\ {0}.=Nuevo proveedor preferido: {0}.
The\ default\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ supplier's\ price\ ({0}).=El precio de compra predeterminado se alineará con el precio del nuevo proveedor ({0}).
Confirm?=¿Confirmar?
Current\ purchase\ price\ from\ the\ preferred\ supplier.\ It\ is\ used\ as\ the\ default\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order.=Precio de compra actual del proveedor preferido. Se usa como valor predeterminado en los nuevos pedidos a proveedores y aún puede modificarse en el pedido.
The\ product\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ preferred\ supplier's\ price\ ({0}).=El precio de compra del producto se alineará con el precio del nuevo proveedor preferido ({0}).
Quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La cantidad debe ser un número entero entre 0 y 999999.
Minimum\ quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La cantidad mínima debe ser un número entero entre 0 y 999999.

Supplier\ Product\ Code=Código de producto del proveedor

Supplier\ Product\ Code\ (optional)=Código de producto del proveedor (opcional)

Supplier\:\ the\ supplier\ associated\ with\ this\ product.=Proveedor: el proveedor asociado a este producto.

Supplier\ product\ code\ (optional)\:\ the\ code\ this\ supplier\ uses\ for\ the\ product\ in\ its\ catalog,\ quotes,\ invoices\ or\ portal.\ Leave\ it\ blank\ if\ the\ supplier\ does\ not\ provide\ one.=Código de producto del proveedor (opcional): el código con el que el proveedor identifica el producto en su catálogo, presupuestos, facturas o portal. Déjelo vacío si el proveedor no proporciona ninguno.

Purchase\ price\:\ the\ supplier's\ current\ reference\ purchase\ price.\ It\ is\ proposed\ in\ new\ supplier\ orders\ and\ can\ be\ changed\ in\ the\ order.=Precio de compra: el precio de compra de referencia actual de este proveedor. Se propone en los nuevos pedidos al proveedor y puede modificarse en el pedido.

Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ product's\ default\ purchase\ price;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferido: establece este proveedor como preferido para el producto. Su precio de compra pasa a ser el precio de compra predeterminado del producto; los costes FIFO históricos y el precio de venta no cambian.

Notes\:\ optional\ notes\ about\ this\ product-supplier\ relationship.=Notas: notas opcionales sobre la relación entre el producto y el proveedor.

Supplier\ product\ fields=Campos del proveedor del producto
Product\:\ the\ WareStat\ product\ supplied\ by\ this\ supplier.=Producto: el producto de WareStat suministrado por este proveedor.
Purchase\ Cost=Coste de compra
Current\ purchase\ cost\ of\ the\ product.\ It\ is\ required\ for\ stock\ valuation\ and\ future\ FIFO\ movements.\ Historical\ sales\ retain\ their\ original\ FIFO\ cost.=Coste de compra actual del producto. Es necesario para valorar el almacén y para futuros movimientos FIFO. Las ventas históricas conservan su coste FIFO original.
Purchase\ cost\ is\ required.=El coste de compra es obligatorio.
Purchase\ cost\ must\ be\ greater\ than\ zero.=El coste de compra debe ser mayor que cero.
The\ new\ preferred\ supplier's\ price\ ({0})\ will\ become\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders.=El precio del nuevo proveedor preferido ({0}) será el precio de referencia predeterminado propuesto en los nuevos pedidos a proveedor.
Edit\ Movement=Editar movimiento
Inbound\ Unit\ Cost=Coste unitario de entrada
Unit\ cost\ of\ this\ inward\ movement.\ It\ becomes\ the\ cost\ of\ the\ FIFO\ lot\ and\ can\ be\ changed\ before\ saving.=Coste unitario de esta entrada. Se convierte en el coste del lote FIFO y puede modificarse antes de guardar.
Select\ a\ product\ to\ see\ availability\ information=Selecciona un producto para ver la información de disponibilidad
Insufficient\ stock!\ Available\:\ {0},\ Requested\:\ {1}=¡Stock insuficiente! Disponible: {0}, solicitado: {1}
Available\:\ {0},\ After\ movement\:\ {1}=Disponible: {0}, después del movimiento: {1}
Current\:\ {0},\ After\ movement\:\ {1}=Actual: {0}, después del movimiento: {1}
Purchase\ Cost\ Required=Coste de compra obligatorio
Inbound\ unit\ cost\ is\ required.=El coste unitario de entrada es obligatorio.
Inbound\ unit\ cost\ must\ be\ a\ valid\ non-negative\ number.=El coste unitario de entrada debe ser un número válido no negativo.
Insufficient\ quantity.\ Current\ availability\:\ {0}=Cantidad insuficiente. Disponibilidad actual: {0}
Requested\:\ {0}=Solicitado: {0}
Error\ saving\ movement=Error al guardar el movimiento
Operation\ not\ available\:\ one\ or\ more\ products\ have\ no\ purchase\ cost.=Operación no disponible: uno o más productos no tienen coste de compra.
Enter\ the\ purchase\ cost\ in\ the\ product\ sheet\ before\ making\ purchases\ or\ sales.=Introduce el coste de compra en la ficha del producto antes de realizar compras o ventas.
...\ and\ {0}\ more\ product(s).=... y {0} producto(s) más.
Purchase\ cost\ is\ missing.\ Purchases\ and\ sales\ are\ blocked\ until\ the\ product\ is\ corrected.=Falta el coste de compra. Las compras y ventas están bloqueadas hasta corregir el producto.
Historical\ cost\ is\ the\ actual\ cost\ of\ the\ products\ sold,\ determined\ from\ the\ FIFO\ lots\ used\ when\ the\ sale\ was\ completed.=Coste histórico = coste FIFO registrado al completar la venta.
Gross\ profit\ \=\ historical\ sales\ revenue\ -\ historical\ FIFO\ purchase\ cost.\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded.=Beneficio bruto = ventas netas - coste FIFO histórico. Se excluyen ventas con coste histórico desconocido.
*\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Las ventas sin coste histórico reconstruible se excluyen de los cálculos de coste histórico y beneficio bruto.
In-stock\ products\ with\ missing\ purchase\ cost=Productos en stock sin coste de compra
*\ Some\ in-stock\ products\ have\ no\ purchase\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Algunos productos en stock no tienen coste de compra; el valor del almacén al coste y el margen potencial están incompletos.
*\ Some\ imported\ sales\ have\ no\ reconstructable\ historical\ cost\ and\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Algunas ventas importadas no tienen un coste histórico reconstruible y se excluyen de los cálculos de coste histórico y beneficio bruto.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ their\ current\ purchase\ cost.\ Reserved\ units\ remain\ included.=Solo se valoran los productos activos con stock físico positivo usando su coste de compra actual. Las unidades reservadas siguen incluidas.
Preferred\ supplier\ changed\ automatically\ to\ {0},\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price\ ({1}).=El proveedor preferido cambió automáticamente a {0}, el proveedor restante con el precio de compra más bajo ({1}).
Preferred\ Supplier\ Changed=Proveedor preferido cambiado
Preferred\ supplier\ changed\ automatically\ to\ the\ lowest-cost\ remaining\ supplier\ for\:=Proveedor preferido cambiado automáticamente al proveedor restante de menor coste para:
Supplier\ '{0}'\ and\ all\ related\ records\ deleted\ successfully.=El proveedor '{0}' y todos los registros relacionados se eliminaron correctamente.
{0}\ product(s)\ now\ have\ no\ preferred\ supplier\ because\ no\ alternative\ supplier\ remained.={0} producto(s) quedan sin proveedor preferido porque no había otro proveedor disponible.
Supplier\ Deleted=Proveedor eliminado
Completed\ or\ reversed\ sales\ cannot\ be\ modified.\ Use\ the\ reversal\ function\ for\ a\ completed\ sale\ so\ FIFO\ history\ is\ preserved.=Las ventas completadas o revertidas no pueden modificarse. Usa la reversión de una venta completada para conservar el historial FIFO.
Historical\ Sale=Venta histórica
This\ sale\ has\ already\ been\ reversed\ and\ is\ kept\ as\ historical\ data.=Esta venta ya ha sido revertida y se conserva como dato histórico.
Reverse\ the\ completed\ sale\ for\ customer\ '{0}'?=¿Revertir la venta completada del cliente '{0}'?
The\ original\ sale\ will\ remain\ in\ history\ as\ reversed.\ Stock\ will\ be\ returned\ to\ the\ exact\ FIFO\ lots\ originally\ used.=La venta original permanecerá en el historial como revertida. El stock volverá a los lotes FIFO exactos utilizados originalmente.
Reverse\ Completed\ Sale=Revertir venta completada
Sale\ reversed\ successfully.\ Stock\ and\ FIFO\ layers\ were\ restored\ while\ the\ original\ sale\ was\ kept\ in\ history.=Venta revertida correctamente. Se restauraron el stock y los lotes FIFO manteniendo la venta original en el historial.
Sale\ Reversed=Venta revertida
Unable\ to\ reverse\ the\ completed\ sale=No se puede revertir la venta completada
Reversed=Revertida
Import\ completed\:\ {0}\ product(s)\ without\ purchase\ cost,\ {1}\ sale(s)\ with\ historical\ cost\ that\ cannot\ be\ reconstructed.=Importación completada: {0} producto(s) sin coste de compra, {1} venta(s) con coste histórico que no puede reconstruirse.
Products\ without\ purchase\ cost\ are\ highlighted\ in\ orange\ and\ cannot\ be\ purchased\ or\ sold\ until\ the\ cost\ is\ entered\ in\ the\ product\ sheet.=Los productos sin coste de compra se resaltan en naranja y no pueden comprarse ni venderse hasta introducir el coste en la ficha del producto.
Sales\ without\ reconstructable\ historical\ cost\ remain\ visible\ but\ are\ excluded\ from\ historical\ cost,\ gross\ profit\ and\ other\ calculations\ that\ require\ that\ cost.=Las ventas sin coste histórico reconstruible siguen visibles, pero se excluyen del coste histórico, beneficio bruto y otros cálculos que requieren ese coste.
SALE_REVERSAL=REVERSIÓN DE VENTA
ORDER_REVERSAL=REVERSIÓN DE PEDIDO
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferido: convierte a este proveedor en el preferido del producto. Su precio de compra pasa a ser el precio de referencia predeterminado propuesto en nuevos pedidos; los costes FIFO históricos y el precio de venta no cambian.
Supplier\ '{0}'\ has\ related\ business\ records\:=El proveedor '{0}' tiene registros comerciales relacionados:
Existing\ orders=Pedidos existentes
{0}\ supplied\ product(s)\ will\ be\ disassociated=Se desvincularán {0} producto(s) suministrados
For\ {0}\ product(s),\ this\ is\ the\ preferred\ supplier.\ WareStat\ will\ automatically\ choose\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price;\ if\ no\ alternative\ exists,\ the\ product\ will\ remain\ without\ a\ preferred\ supplier.=Para {0} producto(s), este es el proveedor preferido. WareStat elegirá automáticamente el proveedor restante con el precio de compra más bajo; si no hay alternativa, el producto quedará sin proveedor preferido.
Choose\ what\ should\ happen\:=Elige qué debe ocurrir:
Keep\:\ nothing\ is\ deleted;\ supplier,\ orders,\ stock\ and\ references\ remain\ unchanged.=Conservar: no se elimina nada; proveedor, pedidos, stock y referencias permanecen sin cambios.
Delete\ all\:\ supplier\ orders\ and\ product\ associations\ are\ permanently\ deleted;\ stock\ received\ from\ completed\ orders\ is\ reversed\ and\ related\ movements\ are\ deleted.=Eliminar todo: los pedidos al proveedor y las asociaciones de productos se eliminan permanentemente; se revierte el stock recibido de pedidos completados y se eliminan los movimientos relacionados.
All\ orders\ from\ this\ supplier=Todos los pedidos de este proveedor
All\ supplied-product\ associations=Todas las asociaciones de productos suministrados
Preferred-supplier\ references\ linked\ to\ those\ products=Referencias de proveedor preferido vinculadas a esos productos
All\ related\ warehouse\ movements=Todos los movimientos de almacén relacionados
If\ preferred\ suppliers\ change,\ the\ lowest-cost\ remaining\ supplier\ will\ be\ selected\ automatically.=Si cambia el proveedor preferido, se seleccionará automáticamente el proveedor restante de menor coste.
This\ action\ CANNOT\ be\ undone!=¡Esta acción NO se puede deshacer!
This\ completed\ sale\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Esta venta completada tiene un historial FIFO incompleto y no puede revertirse de forma segura
This\ outward\ movement\ cannot\ be\ changed\ because\ later\ FIFO\ movements\ exist\ for\ the\ same\ product=Este movimiento de salida no puede modificarse porque existen movimientos FIFO posteriores para el mismo producto
This\ completed\ sale\ has\ already\ been\ reversed=Esta venta completada ya ha sido revertida
Only\ completed\ customer\ orders\ can\ be\ reversed=Solo pueden revertirse los pedidos de cliente completados
This\ supplier\ receipt\ cannot\ be\ reversed\ because\ its\ FIFO\ lot\ has\ historical\ consumption\ records=Esta recepción de proveedor no puede revertirse porque su lote FIFO ya tiene registros históricos de consumo
This\ outward\ movement\ has\ no\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Este movimiento de salida no tiene historial FIFO y no puede revertirse de forma segura
This\ supplier\ receipt\ has\ no\ FIFO\ lot\ history\ and\ cannot\ be\ reversed\ safely=Esta recepción de proveedor no tiene historial de lotes FIFO y no puede revertirse de forma segura
Completed\ or\ reversed\ customer\ sales\ cannot\ be\ deleted.\ Reverse\ completed\ sales\ instead.=Las ventas de cliente completadas o revertidas no pueden eliminarse. Revierta las ventas completadas.
Reverse\ Sale=Revertir venta
Reverse\ the\ completed\ sale\ while\ preserving\ FIFO\ history.=Revertir la venta completada conservando el historial FIFO.
Historical\ cost\ unavailable=Costo histórico no disponible
Reverse\ Movement=Revertir movimiento
MOVEMENT_REVERSAL=Reversión de movimiento
Movement\ reversed\ successfully.=Movimiento revertido correctamente.
Reverse\ this\ outward\ movement?\ The\ original\ remains\ in\ history,\ quantities\ return\ to\ their\ original\ FIFO\ lots\ and\ later\ sales\ are\ not\ changed.=¿Revertir esta salida? El movimiento original permanece en el historial, las cantidades vuelven a sus lotes FIFO originales y las ventas posteriores no cambian.
Posted\ outward\ movements\ cannot\ be\ edited\ or\ deleted.\ Use\ Reverse\ Movement.=Las salidas registradas no se pueden modificar ni eliminar. Usa Revertir movimiento.
This\ inward\ movement\ has\ historical\ FIFO\ consumption\ records\ and\ cannot\ be\ changed.=Esta entrada tiene registros históricos de consumo FIFO y no se puede modificar.
Only\ manual\ outward\ movements\ or\ stock\ reductions\ can\ be\ reversed\ here.=Aquí solo se pueden revertir salidas manuales o ajustes negativos de existencias.
This\ movement\ has\ already\ been\ reversed.=Este movimiento ya se ha revertido.
This\ outward\ movement\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely.=Esta salida tiene un historial FIFO incompleto y no se puede revertir de forma segura.
The\ last\ actual\ purchase\ cost,\ historical\ costs\ and\ existing\ FIFO\ lots\ will\ not\ change.=El último costo real de compra, los costos históricos y los lotes FIFO existentes no cambiarán.
No\ alternative\ supplier\ remains.\ This\ product\ now\ has\ no\ preferred\ supplier.=No quedan proveedores alternativos. Este producto ya no tiene un proveedor preferido.
Database\ Updated=Base de datos actualizada
Error\ loading\ movement=Error al cargar el movimiento
Error\ deleting\ movement=Error al eliminar el movimiento
