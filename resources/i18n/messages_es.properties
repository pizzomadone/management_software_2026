Each\ stock\ entry\ creates\ a\ FIFO\ lot\ with\ its\ own\ quantity\ and\ unit\ cost.=Cada entrada de almacén crea un lote FIFO con su propia cantidad y coste unitario.
When\ stock\ leaves\ the\ warehouse,\ WareStat\ consumes\ the\ oldest\ available\ lot\ first.=Cuando sale stock del almacén, WareStat consume primero el lote disponible más antiguo.
Initial\ Qty\ is\ the\ quantity\ received;\ Remaining\ Qty\ is\ what\ is\ still\ available\ in\ that\ lot.=Cantidad inicial es la cantidad recibida; Cantidad restante es lo que sigue disponible en ese lote.
Example\:=Ejemplo:
5\ units\ at\ cost\ 5.00,\ then\ 5\ units\ at\ cost\ 10.00.\ If\ 7\ units\ are\ sold,\ FIFO\ uses\ all\ 5\ units\ from\ the\ first\ lot\ and\ 2\ from\ the\ second\:\ historical\ cost\ \=\ 45.00.\ The\ second\ lot\ keeps\ 3\ units\ at\ cost\ 10.00.=5 unidades a coste 5,00 y luego 5 unidades a coste 10,00. Si se venden 7, FIFO usa primero las 5 del primer lote y después 2 del segundo: coste histórico = 45,00. En el segundo lote quedan 3 unidades a coste 10,00.
FIFO\ Lots\ Help=Ayuda sobre lotes FIFO
New\ preferred\ supplier\:\ {0}.=Nuevo proveedor preferido: {0}.
The\ default\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ supplier's\ price\ ({0}).=El precio de compra predeterminado se alineará con el precio del nuevo proveedor ({0}).
Confirm?=¿Confirmar?
Current\ purchase\ price\ from\ the\ preferred\ supplier.\ It\ is\ used\ as\ the\ default\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order.=Precio de compra actual del proveedor preferido. Se usa como valor predeterminado en los nuevos pedidos a proveedores y aún puede modificarse en el pedido.
The\ product\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ preferred\ supplier's\ price\ ({0}).=El precio de compra del producto se alineará con el precio del nuevo proveedor preferido ({0}).
Quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La cantidad debe ser un número entero entre 0 y 999999.
Minimum\ quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La cantidad mínima debe ser un número entero entre 0 y 999999.

Supplier\ Product\ Code=Código de producto del proveedor

Supplier\ Product\ Code\ (optional)=Código de producto del proveedor (opcional)

Supplier\:\ the\ supplier\ associated\ with\ this\ product.=Proveedor: el proveedor asociado a este producto.

Supplier\ product\ code\ (optional)\:\ the\ code\ this\ supplier\ uses\ for\ the\ product\ in\ its\ catalog,\ quotes,\ invoices\ or\ portal.\ Leave\ it\ blank\ if\ the\ supplier\ does\ not\ provide\ one.=Código de producto del proveedor (opcional): el código con el que el proveedor identifica el producto en su catálogo, presupuestos, facturas o portal. Déjelo vacío si el proveedor no proporciona ninguno.

Purchase\ price\:\ the\ supplier's\ current\ reference\ purchase\ price.\ It\ is\ proposed\ in\ new\ supplier\ orders\ and\ can\ be\ changed\ in\ the\ order.=Precio de compra: el precio de compra de referencia actual de este proveedor. Se propone en los nuevos pedidos al proveedor y puede modificarse en el pedido.

Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ product's\ default\ purchase\ price;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Preferido: establece este proveedor como preferido para el producto. Su precio de compra pasa a ser el precio de compra predeterminado del producto; los costes FIFO históricos y el precio de venta no cambian.

Notes\:\ optional\ notes\ about\ this\ product-supplier\ relationship.=Notas: notas opcionales sobre la relación entre el producto y el proveedor.

Supplier\ product\ fields=Campos del proveedor del producto
Product\:\ the\ WareStat\ product\ supplied\ by\ this\ supplier.=Producto: el producto de WareStat suministrado por este proveedor.
Purchase\ Cost=Coste de compra
Current\ purchase\ cost\ of\ the\ product.\ It\ is\ required\ for\ stock\ valuation\ and\ future\ FIFO\ movements.\ Historical\ sales\ retain\ their\ original\ FIFO\ cost.=Coste de compra actual del producto. Es necesario para valorar el almacén y para futuros movimientos FIFO. Las ventas históricas conservan su coste FIFO original.
Purchase\ cost\ is\ required.=El coste de compra es obligatorio.
Purchase\ cost\ must\ be\ greater\ than\ zero.=El coste de compra debe ser mayor que cero.
The\ new\ preferred\ supplier's\ price\ ({0})\ will\ become\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders.=El precio del nuevo proveedor preferido ({0}) será el precio de referencia predeterminado propuesto en los nuevos pedidos a proveedor.
Edit\ Movement=Editar movimiento
Inbound\ Unit\ Cost=Coste unitario de entrada
Unit\ cost\ of\ this\ inward\ movement.\ It\ becomes\ the\ cost\ of\ the\ FIFO\ lot\ and\ can\ be\ changed\ before\ saving.=Coste unitario de esta entrada. Se convierte en el coste del lote FIFO y puede modificarse antes de guardar.
