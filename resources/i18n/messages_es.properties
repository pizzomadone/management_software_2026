tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Suma del stock físico positivo x coste de compra actual.</b><br>Solo productos activos. Las unidades reservadas siguen incluidas porque aún están físicamente en almacén. Los productos sin coste de compra hacen que el valor sea incompleto; el stock negativo se excluye.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Suma de stock positivo x precio de venta del catálogo.</b><br>Solo productos activos; redondea cada producto a 2 decimales antes de sumar. Las unidades reservadas siguen incluidas; se excluye el stock negativo. Es el valor potencial de venta de las existencias actuales, no un ingreso ya obtenido.</div></html>
tooltip.kpi.lowStock=<html><div style='width: 260px'><b>Cuenta productos por debajo del stock mínimo disponible o con disponibilidad negativa.</b><br>Disponible = stock físico - cantidad reservada. Solo productos activos.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Cuenta productos con stock disponible menor o igual a cero.</b><br>Disponible = stock físico - cantidad reservada. Solo productos activos; incluye saldos negativos.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Suma de totales de pedidos de clientes completados, sin IVA.</b><br>Usa la fecha del pedido dentro del mes natural actual, en la zona horaria local. Excluye pedidos nuevos, en curso y cancelados. No suma facturas ni pagos. Los movimientos manuales de almacén no cuentan como ventas.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Suma de bases imponibles de las facturas, antes del IVA.</b><br>Incluye facturas emitidas y pagadas con fecha en el mes natural actual, en la zona horaria local. Excluye borradores y facturas canceladas. Cada factura cuenta una vez, independientemente del pago. No suma pedidos de clientes.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Cuenta pedidos de clientes nuevos o en curso.</b><br>Considera todas las fechas. Excluye pedidos completados y cancelados. Cuenta pedidos, no cantidades de productos ni importes.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (valor de venta del stock - valor al coste de compra actual) / valor de venta.</b><br>Es un margen potencial del stock actual, no el beneficio histórico. Si faltan costes de compra, el valor se marca como incompleto.</div></html>

