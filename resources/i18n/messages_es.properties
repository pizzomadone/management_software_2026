The\ original\ sale\ will\ remain\ in\ history\ as\ reversed.\ Stock\ will\ be\ returned\ to\ the\ exact\ FIFO\ lots\ originally\ used.=La venta original permanecerá en el historial como revertida. El stock volverá a los lotes FIFO exactos utilizados originalmente.
Reverse\ Completed\ Sale=Revertir venta completada
Sale\ reversed\ successfully.\ Stock\ and\ FIFO\ layers\ were\ restored\ while\ the\ original\ sale\ was\ kept\ in\ history.=Venta revertida correctamente. Se restauraron el stock y los lotes FIFO manteniendo la venta original en el historial.
Sale\ Reversed=Venta revertida
