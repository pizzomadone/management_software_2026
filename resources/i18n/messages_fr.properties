A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.\\n\\nThe\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.\\n\\nWhen\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.\\n\\nDouble-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Un produit peut avoir plusieurs fournisseurs, mais un seul fournisseur préféré.\n\nLe prix d'achat affiché ici est le prix de référence actuel du fournisseur. Il est proposé automatiquement dans les nouvelles commandes fournisseur et peut toujours être modifié dans la commande, par exemple pour des remises ou des prix négociés.\n\nLorsque vous définissez un autre fournisseur comme préféré, son prix d'achat devient le prix d'achat par défaut proposé pour ce produit. Le prix de vente du produit et les coûts FIFO historiques ne sont pas modifiés.\n\nDouble-cliquez sur une ligne pour modifier la relation fournisseur.
