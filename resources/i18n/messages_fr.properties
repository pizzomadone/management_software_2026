Its\ current\ purchase\ price\ ({0})\ will\ become\ the\ default\ purchase\ price\ proposed\ for\ this\ product\ in\ new\ supplier\ orders.=Son prix d'achat actuel ({0}) deviendra le prix d'achat par défaut proposé pour ce produit dans les nouvelles commandes fournisseur.
The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ will\ not\ be\ changed.=Le prix de vente du produit et les coûts FIFO historiques ne seront pas modifiés.
A\ product\ can\ have\ multiple\ suppliers,\ but\ only\ one\ preferred\ supplier.=Un produit peut avoir plusieurs fournisseurs, mais un seul fournisseur préféré.
The\ purchase\ price\ shown\ here\ is\ the\ supplier's\ current\ reference\ price.\ It\ is\ proposed\ automatically\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order,\ for\ example\ for\ discounts\ or\ negotiated\ prices.=Le prix d'achat affiché ici est le prix de référence actuel du fournisseur. Il est proposé automatiquement dans les nouvelles commandes fournisseur et peut toujours être modifié dans la commande, par exemple pour des remises ou des prix négociés.
When\ you\ set\ a\ different\ preferred\ supplier,\ that\ supplier's\ purchase\ price\ becomes\ the\ default\ purchase\ price\ proposed\ for\ this\ product.\ The\ product\ sale\ price\ and\ historical\ FIFO\ costs\ are\ not\ changed.=Lorsque vous définissez un autre fournisseur comme préféré, son prix d'achat devient le prix d'achat par défaut proposé pour ce produit. Le prix de vente du produit et les coûts FIFO historiques ne sont pas modifiés.
Double-click\ a\ row\ to\ edit\ the\ supplier\ relationship.=Double-cliquez sur une ligne pour modifier la relation fournisseur.
Search\ products\ by\ code,\ name\ or\ description.=Rechercher des produits par code, nom ou description.
Create\ a\ new\ product.=Créer un nouveau produit.
Open\ the\ selected\ product\ details.=Ouvrir les détails du produit sélectionné.
Edit\ the\ selected\ product.=Modifier le produit sélectionné.
View\ FIFO\ lots\ for\ the\ selected\ product.=Afficher les lots FIFO du produit sélectionné.
Delete\ the\ selected\ product.=Supprimer le produit sélectionné.
Reload\ the\ product\ list.=Recharger la liste des produits.
Each\ stock\ entry\ creates\ a\ FIFO\ lot\ with\ its\ own\ quantity\ and\ unit\ cost.=Chaque entrée en stock crée un lot FIFO avec sa propre quantité et son coût unitaire.
When\ stock\ leaves\ the\ warehouse,\ WareStat\ consumes\ the\ oldest\ available\ lot\ first.=Lors d'une sortie de stock, WareStat consomme d'abord le lot disponible le plus ancien.
Initial\ Qty\ is\ the\ quantity\ received;\ Remaining\ Qty\ is\ what\ is\ still\ available\ in\ that\ lot.=Quantité initiale correspond à la quantité reçue ; Quantité restante correspond à ce qui reste disponible dans le lot.
Example\:=Exemple :
5\ units\ at\ cost\ 5.00,\ then\ 5\ units\ at\ cost\ 10.00.\ If\ 7\ units\ are\ sold,\ FIFO\ uses\ all\ 5\ units\ from\ the\ first\ lot\ and\ 2\ from\ the\ second\:\ historical\ cost\ \=\ 45.00.\ The\ second\ lot\ keeps\ 3\ units\ at\ cost\ 10.00.=5 unités au coût de 5,00, puis 5 unités au coût de 10,00. Si 7 unités sont vendues, FIFO utilise d'abord les 5 du premier lot puis 2 du second : coût historique = 45,00. Il reste 3 unités à coût 10,00 dans le second lot.
FIFO\ Lots\ Help=Aide sur les lots FIFO
New\ preferred\ supplier\:\ {0}.=Nouveau fournisseur préféré : {0}.
The\ default\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ supplier's\ price\ ({0}).=Le prix d'achat par défaut sera aligné sur le prix du nouveau fournisseur ({0}).
Confirm?=Confirmer ?
Current\ purchase\ price\ from\ the\ preferred\ supplier.\ It\ is\ used\ as\ the\ default\ in\ new\ supplier\ orders\ and\ can\ still\ be\ changed\ in\ the\ order.=Prix d'achat actuel du fournisseur préféré. Il est utilisé par défaut dans les nouvelles commandes fournisseur et peut toujours être modifié dans la commande.
The\ product\ purchase\ price\ will\ be\ aligned\ with\ the\ new\ preferred\ supplier's\ price\ ({0}).=Le prix d'achat du produit sera aligné sur le prix du nouveau fournisseur préféré ({0}).
Quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La quantité doit être un nombre entier compris entre 0 et 999999.
Minimum\ quantity\ must\ be\ a\ whole\ number\ between\ 0\ and\ 999999.=La quantité minimale doit être un nombre entier compris entre 0 et 999999.

Supplier\ Product\ Code=Code produit du fournisseur

Supplier\ Product\ Code\ (optional)=Code produit du fournisseur (facultatif)

Supplier\:\ the\ supplier\ associated\ with\ this\ product.=Fournisseur : le fournisseur associé à ce produit.

Supplier\ product\ code\ (optional)\:\ the\ code\ this\ supplier\ uses\ for\ the\ product\ in\ its\ catalog,\ quotes,\ invoices\ or\ portal.\ Leave\ it\ blank\ if\ the\ supplier\ does\ not\ provide\ one.=Code produit du fournisseur (facultatif) : le code utilisé par le fournisseur pour identifier le produit dans son catalogue, ses devis, ses factures ou son portail. Laissez ce champ vide si le fournisseur n'en fournit pas.

Purchase\ price\:\ the\ supplier's\ current\ reference\ purchase\ price.\ It\ is\ proposed\ in\ new\ supplier\ orders\ and\ can\ be\ changed\ in\ the\ order.=Prix d'achat : le prix d'achat de référence actuel de ce fournisseur. Il est proposé dans les nouvelles commandes fournisseur et peut être modifié dans la commande.

Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ product's\ default\ purchase\ price;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Préféré : définit ce fournisseur comme fournisseur préféré du produit. Son prix d'achat devient le prix d'achat par défaut du produit ; les coûts FIFO historiques et le prix de vente ne changent pas.

Notes\:\ optional\ notes\ about\ this\ product-supplier\ relationship.=Remarques : notes facultatives sur la relation entre le produit et le fournisseur.

Supplier\ product\ fields=Champs fournisseur du produit
Product\:\ the\ WareStat\ product\ supplied\ by\ this\ supplier.=Produit : le produit WareStat fourni par ce fournisseur.
Purchase\ Cost=Coût d'achat
Current\ purchase\ cost\ of\ the\ product.\ It\ is\ required\ for\ stock\ valuation\ and\ future\ FIFO\ movements.\ Historical\ sales\ retain\ their\ original\ FIFO\ cost.=Coût d'achat actuel du produit. Il est requis pour valoriser le stock et pour les futurs mouvements FIFO. Les ventes historiques conservent leur coût FIFO d'origine.
Purchase\ cost\ is\ required.=Le coût d'achat est obligatoire.
Purchase\ cost\ must\ be\ greater\ than\ zero.=Le coût d'achat doit être supérieur à zéro.
The\ new\ preferred\ supplier's\ price\ ({0})\ will\ become\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders.=Le prix du nouveau fournisseur préféré ({0}) deviendra le prix de référence proposé par défaut dans les nouvelles commandes fournisseur.
Edit\ Movement=Modifier le mouvement
Inbound\ Unit\ Cost=Coût unitaire d'entrée
Unit\ cost\ of\ this\ inward\ movement.\ It\ becomes\ the\ cost\ of\ the\ FIFO\ lot\ and\ can\ be\ changed\ before\ saving.=Coût unitaire de cette entrée. Il devient le coût du lot FIFO et peut être modifié avant l'enregistrement.
Select\ a\ product\ to\ see\ availability\ information=Sélectionnez un produit pour afficher les informations de disponibilité
Insufficient\ stock!\ Available\:\ {0},\ Requested\:\ {1}=Stock insuffisant ! Disponible : {0}, demandé : {1}
Available\:\ {0},\ After\ movement\:\ {1}=Disponible : {0}, après mouvement : {1}
Current\:\ {0},\ After\ movement\:\ {1}=Actuel : {0}, après mouvement : {1}
Purchase\ Cost\ Required=Coût d'achat obligatoire
Inbound\ unit\ cost\ is\ required.=Le coût unitaire d'entrée est obligatoire.
Inbound\ unit\ cost\ must\ be\ a\ valid\ non-negative\ number.=Le coût unitaire d'entrée doit être un nombre valide non négatif.
Insufficient\ quantity.\ Current\ availability\:\ {0}=Quantité insuffisante. Disponibilité actuelle : {0}
Requested\:\ {0}=Demandé : {0}
Error\ saving\ movement=Erreur lors de l'enregistrement du mouvement
Operation\ not\ available\:\ one\ or\ more\ products\ have\ no\ purchase\ cost.=Opération indisponible : un ou plusieurs produits n'ont pas de coût d'achat.
Enter\ the\ purchase\ cost\ in\ the\ product\ sheet\ before\ making\ purchases\ or\ sales.=Saisissez le coût d'achat dans la fiche produit avant d'effectuer des achats ou des ventes.
...\ and\ {0}\ more\ product(s).=... et {0} autre(s) produit(s).
Purchase\ cost\ is\ missing.\ Purchases\ and\ sales\ are\ blocked\ until\ the\ product\ is\ corrected.=Le coût d'achat est manquant. Les achats et ventes sont bloqués jusqu'à correction du produit.
Historical\ cost\ is\ the\ actual\ cost\ of\ the\ products\ sold,\ determined\ from\ the\ FIFO\ lots\ used\ when\ the\ sale\ was\ completed.=Le coût historique est le coût réel des produits vendus, déterminé à partir des lots FIFO utilisés lors de la vente.
Gross\ profit\ \=\ historical\ sales\ revenue\ -\ historical\ FIFO\ purchase\ cost.\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded.=Marge brute = chiffre d'affaires historique - coût d'achat FIFO historique. Les ventes sans coût historique reconstituable sont exclues.
*\ Sales\ without\ reconstructable\ historical\ cost\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Les ventes sans coût historique reconstituable sont exclues des calculs du coût historique et de la marge brute.
In-stock\ products\ with\ missing\ purchase\ cost=Produits en stock sans coût d'achat
*\ Some\ in-stock\ products\ have\ no\ purchase\ cost;\ warehouse\ cost\ value\ and\ potential\ margin\ are\ incomplete.=* Certains produits en stock n'ont pas de coût d'achat ; la valeur du stock au coût et la marge potentielle sont incomplètes.
*\ Some\ imported\ sales\ have\ no\ reconstructable\ historical\ cost\ and\ are\ excluded\ from\ historical\ cost\ and\ gross\ profit\ calculations.=* Certaines ventes importées n'ont pas de coût historique reconstituable et sont exclues des calculs du coût historique et de la marge brute.
Only\ active\ products\ with\ positive\ physical\ stock\ are\ valued\ at\ their\ current\ purchase\ cost.\ Reserved\ units\ remain\ included.=Seuls les produits actifs avec un stock physique positif sont valorisés à leur coût d'achat actuel. Les unités réservées restent incluses.
Preferred\ supplier\ changed\ automatically\ to\ {0},\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price\ ({1}).=Le fournisseur préféré a été remplacé automatiquement par {0}, le fournisseur restant au prix d'achat le plus bas ({1}).
Preferred\ Supplier\ Changed=Fournisseur préféré modifié
Preferred\ supplier\ changed\ automatically\ to\ the\ lowest-cost\ remaining\ supplier\ for\:=Fournisseur préféré remplacé automatiquement par le fournisseur restant le moins cher pour :
Supplier\ '{0}'\ and\ all\ related\ records\ deleted\ successfully.=Le fournisseur '{0}' et tous les enregistrements associés ont été supprimés avec succès.
{0}\ product(s)\ now\ have\ no\ preferred\ supplier\ because\ no\ alternative\ supplier\ remained.={0} produit(s) n'ont désormais plus de fournisseur préféré car aucun fournisseur alternatif ne restait.
Supplier\ Deleted=Fournisseur supprimé
Completed\ or\ reversed\ sales\ cannot\ be\ modified.\ Use\ the\ reversal\ function\ for\ a\ completed\ sale\ so\ FIFO\ history\ is\ preserved.=Les ventes terminées ou contre-passées ne peuvent pas être modifiées. Utilisez la contre-passation afin de préserver l'historique FIFO.
Historical\ Sale=Vente historique
This\ sale\ has\ already\ been\ reversed\ and\ is\ kept\ as\ historical\ data.=Cette vente a déjà été contre-passée et est conservée comme donnée historique.
Reverse\ the\ completed\ sale\ for\ customer\ '{0}'?=Contre-passer la vente terminée du client '{0}' ?
The\ original\ sale\ will\ remain\ in\ history\ as\ reversed.\ Stock\ will\ be\ returned\ to\ the\ exact\ FIFO\ lots\ originally\ used.=La vente d'origine restera dans l'historique comme contre-passée. Le stock sera restitué exactement aux lots FIFO utilisés à l'origine.
Reverse\ Completed\ Sale=Contre-passer la vente terminée
Sale\ reversed\ successfully.\ Stock\ and\ FIFO\ layers\ were\ restored\ while\ the\ original\ sale\ was\ kept\ in\ history.=Vente contre-passée avec succès. Le stock et les lots FIFO ont été restaurés en conservant la vente d'origine dans l'historique.
Sale\ Reversed=Vente contre-passée
Unable\ to\ reverse\ the\ completed\ sale=Impossible de contre-passer la vente terminée
Reversed=Contre-passée
Import\ completed\:\ {0}\ product(s)\ without\ purchase\ cost,\ {1}\ sale(s)\ with\ historical\ cost\ that\ cannot\ be\ reconstructed.=Importation terminée : {0} produit(s) sans coût d'achat, {1} vente(s) dont le coût historique ne peut pas être reconstitué.
Products\ without\ purchase\ cost\ are\ highlighted\ in\ orange\ and\ cannot\ be\ purchased\ or\ sold\ until\ the\ cost\ is\ entered\ in\ the\ product\ sheet.=Les produits sans coût d'achat sont surlignés en orange et ne peuvent être achetés ou vendus tant que le coût n'est pas saisi dans la fiche produit.
Sales\ without\ reconstructable\ historical\ cost\ remain\ visible\ but\ are\ excluded\ from\ historical\ cost,\ gross\ profit\ and\ other\ calculations\ that\ require\ that\ cost.=Les ventes sans coût historique reconstituable restent visibles mais sont exclues du coût historique, de la marge brute et des autres calculs nécessitant ce coût.
SALE_REVERSAL=CONTRE-PASSATION VENTE
ORDER_REVERSAL=CONTRE-PASSATION COMMANDE
Preferred\:\ makes\ this\ the\ preferred\ supplier\ for\ the\ product.\ Its\ purchase\ price\ becomes\ the\ default\ reference\ price\ proposed\ in\ new\ supplier\ orders;\ historical\ FIFO\ costs\ and\ the\ sale\ price\ are\ not\ changed.=Préféré : définit ce fournisseur comme fournisseur préféré du produit. Son prix d'achat devient le prix de référence proposé par défaut dans les nouvelles commandes ; les coûts FIFO historiques et le prix de vente ne changent pas.
Supplier\ '{0}'\ has\ related\ business\ records\:=Le fournisseur '{0}' possède des enregistrements commerciaux associés :
Existing\ orders=Commandes existantes
{0}\ supplied\ product(s)\ will\ be\ disassociated={0} produit(s) fourni(s) seront dissociés
For\ {0}\ product(s),\ this\ is\ the\ preferred\ supplier.\ WareStat\ will\ automatically\ choose\ the\ remaining\ supplier\ with\ the\ lowest\ purchase\ price;\ if\ no\ alternative\ exists,\ the\ product\ will\ remain\ without\ a\ preferred\ supplier.=Pour {0} produit(s), il s'agit du fournisseur préféré. WareStat choisira automatiquement le fournisseur restant au prix d'achat le plus bas ; sans alternative, le produit restera sans fournisseur préféré.
Choose\ what\ should\ happen\:=Choisissez l'action à effectuer :
Keep\:\ nothing\ is\ deleted;\ supplier,\ orders,\ stock\ and\ references\ remain\ unchanged.=Conserver : rien n'est supprimé ; fournisseur, commandes, stock et références restent inchangés.
Delete\ all\:\ supplier\ orders\ and\ product\ associations\ are\ permanently\ deleted;\ stock\ received\ from\ completed\ orders\ is\ reversed\ and\ related\ movements\ are\ deleted.=Tout supprimer : les commandes fournisseur et associations produit sont supprimées définitivement ; le stock reçu des commandes terminées est annulé et les mouvements associés sont supprimés.
All\ orders\ from\ this\ supplier=Toutes les commandes de ce fournisseur
All\ supplied-product\ associations=Toutes les associations de produits fournis
Preferred-supplier\ references\ linked\ to\ those\ products=Références de fournisseur préféré liées à ces produits
All\ related\ warehouse\ movements=Tous les mouvements de stock associés
If\ preferred\ suppliers\ change,\ the\ lowest-cost\ remaining\ supplier\ will\ be\ selected\ automatically.=Si le fournisseur préféré change, le fournisseur restant le moins cher sera sélectionné automatiquement.
This\ action\ CANNOT\ be\ undone!=Cette action est IRRÉVERSIBLE !
This\ completed\ sale\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Cette vente terminée a un historique FIFO incomplet et ne peut pas être contre-passée en toute sécurité
This\ outward\ movement\ cannot\ be\ changed\ because\ later\ FIFO\ movements\ exist\ for\ the\ same\ product=Ce mouvement de sortie ne peut pas être modifié car des mouvements FIFO ultérieurs existent pour le même produit
This\ completed\ sale\ has\ already\ been\ reversed=Cette vente terminée a déjà été contre-passée
Only\ completed\ customer\ orders\ can\ be\ reversed=Seules les commandes client terminées peuvent être contre-passées
This\ supplier\ receipt\ cannot\ be\ reversed\ because\ its\ FIFO\ lot\ has\ historical\ consumption\ records=Cette réception fournisseur ne peut pas être annulée car son lot FIFO possède déjà un historique de consommation
This\ outward\ movement\ has\ no\ FIFO\ history\ and\ cannot\ be\ reversed\ safely=Ce mouvement de sortie n'a pas d'historique FIFO et ne peut pas être annulé en toute sécurité
This\ supplier\ receipt\ has\ no\ FIFO\ lot\ history\ and\ cannot\ be\ reversed\ safely=Cette réception fournisseur n'a pas d'historique de lot FIFO et ne peut pas être annulée en toute sécurité
Completed\ or\ reversed\ customer\ sales\ cannot\ be\ deleted.\ Reverse\ completed\ sales\ instead.=Les ventes client terminées ou contre-passées ne peuvent pas être supprimées. Contre-passez les ventes terminées.
Reverse\ Sale=Contre-passer la vente
Reverse\ the\ completed\ sale\ while\ preserving\ FIFO\ history.=Contre-passer la vente terminée en conservant l'historique FIFO.
Historical\ cost\ unavailable=Coût historique indisponible
Reverse\ Movement=Extourner le mouvement
MOVEMENT_REVERSAL=Extourne de mouvement
Movement\ reversed\ successfully.=Mouvement extourné.
Reverse\ this\ outward\ movement?\ The\ original\ remains\ in\ history,\ quantities\ return\ to\ their\ original\ FIFO\ lots\ and\ later\ sales\ are\ not\ changed.=Extourner cette sortie ? Le mouvement original reste dans l’historique, les quantités retournent dans leurs lots FIFO d’origine et les ventes ultérieures restent inchangées.
Posted\ outward\ movements\ cannot\ be\ edited\ or\ deleted.\ Use\ Reverse\ Movement.=Les sorties enregistrées ne peuvent être ni modifiées ni supprimées. Utilisez Extourner le mouvement.
This\ inward\ movement\ has\ historical\ FIFO\ consumption\ records\ and\ cannot\ be\ changed.=Cette entrée possède des consommations FIFO historiques et ne peut pas être modifiée.
Only\ manual\ outward\ movements\ or\ stock\ reductions\ can\ be\ reversed\ here.=Seules les sorties manuelles ou les diminutions de stock peuvent être extournées ici.
This\ movement\ has\ already\ been\ reversed.=Ce mouvement a déjà été extourné.
This\ outward\ movement\ has\ incomplete\ FIFO\ history\ and\ cannot\ be\ reversed\ safely.=Cette sortie possède un historique FIFO incomplet et ne peut pas être extournée sans risque.
The\ last\ actual\ purchase\ cost,\ historical\ costs\ and\ existing\ FIFO\ lots\ will\ not\ change.=Le dernier coût réel d’achat, les coûts historiques et les lots FIFO existants ne seront pas modifiés.
No\ alternative\ supplier\ remains.\ This\ product\ now\ has\ no\ preferred\ supplier.=Il ne reste aucun autre fournisseur. Ce produit n’a désormais plus de fournisseur préféré.
Database\ Updated=Base de données mise à jour
Error\ loading\ movement=Erreur de chargement du mouvement
Error\ deleting\ movement=Erreur de suppression du mouvement
tooltip.kpi.lowStock=<html><div style='width: 260px'>Compte les produits actifs dont le stock disponible est supérieur à zéro et inférieur au minimum. Disponible = stock physique - quantité réservée. Les produits épuisés sont comptés séparément.</div></html>
