tooltip.kpi.warehouseValue=<html><div style='width: 260px'><b>Somme du stock physique positif x coût d'achat actuel.</b><br>Produits actifs uniquement. Les unités réservées restent incluses car elles sont encore physiquement en stock. Les coûts manquants rendent la valeur incomplète ; les stocks négatifs sont exclus.</div></html>
tooltip.kpi.warehouseSaleValue=<html><div style='width: 260px'><b>Somme des stocks positifs x prix de vente du catalogue.</b><br>Produits actifs uniquement ; arrondit chaque produit à 2 décimales avant la somme. Les unités réservées restent incluses ; les stocks négatifs sont exclus. Il s’agit de la valeur de vente potentielle du stock actuel, pas d’un chiffre d’affaires déjà réalisé.</div></html>
tooltip.kpi.zeroStock=<html><div style='width: 260px'><b>Compte les produits dont le stock disponible est inférieur ou égal à zéro.</b><br>Disponible = stock physique - quantité réservée. Produits actifs uniquement ; les soldes négatifs sont inclus.</div></html>
tooltip.kpi.monthRevenue=<html><div style='width: 260px'><b>Somme des totaux des commandes clients terminées, hors taxes.</b><br>Utilise la date de commande dans le mois civil en cours, selon le fuseau horaire local. Exclut les commandes nouvelles, en cours et annulées. Les factures et paiements ne sont pas ajoutés. Les mouvements manuels de stock ne comptent pas comme ventes.</div></html>
tooltip.kpi.monthInvoiced=<html><div style='width: 260px'><b>Somme des montants hors taxes des factures.</b><br>Inclut les factures émises et payées datées du mois civil en cours, selon le fuseau horaire local. Exclut les brouillons et les factures annulées. Chaque facture compte une fois, quel que soit son paiement. Les commandes clients ne sont pas ajoutées.</div></html>
tooltip.kpi.pendingOrders=<html><div style='width: 260px'><b>Compte les commandes clients nouvelles ou en cours.</b><br>Toutes dates confondues. Exclut les commandes terminées et annulées. Compte des commandes, pas des quantités de produits ni des montants.</div></html>
tooltip.kpi.avgMargin=<html><div style='width: 260px'><b>100 x (valeur de vente du stock - valeur au coût d'achat actuel) / valeur de vente.</b><br>Il s'agit d'une marge potentielle sur le stock actuel, pas du bénéfice historique. Si des coûts manquent, la valeur est indiquée comme incomplète.</div></html>

